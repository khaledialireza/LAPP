<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAPP">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>LAPP | Deutsch lernen</title>
  <meta name="description" content="LAPP — آموزش زبان آلمانی با دیالوگ صوتی، واژگان و تمرین.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=muib1hav">
</head>
<body data-screen="home">
  <div class="frame">
    <!-- Status bar -->

    <main>
      <!-- HOME -->
      <section class="screen active" id="home">
        <div class="home-hero hero5">
          <div class="h5-chips">
            <div class="lesson-pick">
              <button class="lp-btn chip5" id="lpBtn" aria-haspopup="listbox" aria-expanded="false"><b class="js-lesson-num">L1</b> <span class="lp-name" id="lpName"></span> <span class="lp-caret">▾</span></button>
            </div>
            <span class="chip5" id="hLevel"></span>
            <button class="chip5 h5-more" data-go="lesson" data-i18n="lessonMore"></button>
          </div>
          <div class="lp-menu" id="lpMenu" role="listbox" hidden></div>
          <div class="h5-lbl"><span class="js-lesson-word">Lektion</span> · Weitermachen</div>
          <div class="h5-ttl" id="hLessonTitle"></div>
          <div class="h5-sub fa" id="hLessonFa"></div>
          <div class="h5-orbrow">
            <button class="orb" id="hSpeak" aria-label="Jetzt sprechen"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
            <div class="h5-orbtxt"><b>Jetzt sprechen</b><span>Rollenspiel · <span class="fa" data-i18n="speakHint"></span></span></div>
            <button class="h5-listen" data-act="toggle">▶ Hören</button>
          </div>
        </div>
        <div class="home-side">
          <div class="home-head">
            <div class="home-hl">
              <h1 class="home-greet" id="hGreet">Guten Tag</h1>
              <div class="home-date" id="homeDate"></div>
            </div>
            <span class="streak" id="hStreak" title="Streak">🔥 0</span>
          </div>
          <div class="rings5">
            <svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)" fill="none" stroke-linecap="round" stroke-width="11">
              <circle cx="50" cy="50" r="42" class="rg-bg rg-s"/><circle cx="50" cy="50" r="42" class="rg rg-s" id="rgSpeak" pathLength="100" stroke-dasharray="0 100"/>
              <circle cx="50" cy="50" r="29" class="rg-bg rg-l"/><circle cx="50" cy="50" r="29" class="rg rg-l" id="rgListen" pathLength="100" stroke-dasharray="0 100"/>
              <circle cx="50" cy="50" r="16" class="rg-bg rg-w"/><circle cx="50" cy="50" r="16" class="rg rg-w" id="rgWords" pathLength="100" stroke-dasharray="0 100"/></g></svg>
            <div class="rings-lg">
              <div><b class="c-s" id="lgSpeak">0/8</b> <span>Sätze gesprochen</span></div>
              <div><b class="c-l" id="lgListen">0/15</b> <span>Min gehört</span></div>
              <div><b class="c-w" id="lgWords">0</b> <span>Wörter</span></div>
            </div>
          </div>
          <button class="word5" data-go="vocab">
            <span class="kk">Wort des Tages</span>
            <span class="sp" id="wotdSay" role="button" aria-label="anhören"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></span>
            <span class="wd5" id="wotdDe"></span>
            <span class="m fa"><span id="wotdFa"></span> · <span id="wotdEn"></span></span>
            <span class="ex" id="wotdEx"></span>
          </button>
        </div>
      </section>

      <!-- LESSON -->
      <section class="screen" id="lesson">
        <div class="screen-head">
          <button class="back-btn" data-go="home"><span class="back-chev">‹</span><span data-i18n="tabHome"></span></button>
          <h1 id="lTitle"></h1>
          <div class="lessons-row" id="lessonList"></div>
        </div>
        <div class="lesson-grid">
          <div class="tile intro">
            <span class="chip" id="lLevel" style="align-self:flex-start"></span>
            <div class="big" id="lDe"></div>
            <p class="fa" id="lSum" style="line-height:1.9;margin:0;color:var(--muted)"></p>
            <div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn" data-go="audio">▶ Dialog hören</button>
              <button class="btn ghost" data-go="practice">Üben</button>
            </div>
            <div class="tile" style="background:var(--tile-2);margin-top:6px">
              <h3>du vs. Sie</h3>
              <div class="fa" style="font-size:13px;line-height:1.9"><b>du</b> = <span data-i18n="duInfo"></span><br><b>Sie</b> = <span data-i18n="sieInfo"></span></div>
            </div>
          </div>
          <div class="tile phr">
            <h3>Wichtige Sätze · <span class="fa" data-i18n="keyPhrases"></span></h3>
            <div id="phrases"></div>
          </div>
        </div>
      </section>

      <!-- AUDIO -->
      <section class="screen" id="audio">
        <div class="ly-head">
          <div><h1 class="ly-title">Dialog</h1><div class="ly-meta">Daily German Talk · <span id="mNum"></span></div></div>
          <button class="ly-chip fa" id="faBtn" aria-pressed="true" data-i18n="showTranslation"></button>
        </div>
        <div class="lyrics" id="mTranscript"></div>
        <div class="ly-tools">
          <div class="ly-seg" id="mSpkTabs"><button class="on" data-spk="all">Alle</button><button data-spk="anna">Anna</button><button data-spk="ben">Ben</button></div>
          <button class="ly-chip" data-speed-cycle aria-label="Tempo">🐢 <span class="js-speed">1×</span></button>
          <button class="ly-chip" id="lyRepeat">↻ Satz</button>
        </div>
      </section>

      <!-- VOCAB -->
      <section class="screen" id="vocab">
        <div class="dc-head">
          <div><h1 class="dc-title">Wörterbuch</h1><div class="dc-sub" id="vocabSub"></div></div>
          <div class="ly-seg" id="vocabScope"><button class="on" data-scope="lesson">Lektion</button><button data-scope="all">Alle</button></div>
        </div>
        <div class="mbar"><div class="mbar-b" id="vMbar"></div><div class="mbar-lg" id="vMleg"></div></div>
        <input class="v-search" id="vocabSearch" type="search" placeholder="Suchen · جستجو" data-i18n-ph="Suchen · {search}" aria-label="Suchen">
        <div class="pchips" id="vocabPos"></div>
        <div class="dlist" id="vocabGrid"></div>
      </section>

      <!-- PRACTICE -->
      <section class="screen" id="practice">
        <div class="p-hub" id="pHub">
          <div class="screen-head"><h1>Üben <small class="fa" data-i18n="speakNotWrite"></small></h1><div class="ex-stats" id="exStats"></div></div>
          <div class="hub-scroll">
            <h3 class="hub-h">Sprechen · <span class="fa" data-i18n="speaking"></span></h3>
            <div class="hub-grid">
              <button class="hub-tile speak" data-open="role"><span class="ht-ico">🎭</span><b>Rollenspiel</b><span class="fa" data-i18n="roleSub"></span></button>
              <button class="hub-tile speak" data-open="gap"><span class="ht-ico">🧩</span><b>Lückendialog</b><span class="fa" data-i18n="gapSub"></span></button>
              <button class="hub-tile speak" data-open="read"><span class="ht-ico">📖</span><b>Vorlesen</b><span class="fa" data-i18n="readSub"></span></button>
              <button class="hub-tile speak" data-open="fc"><span class="ht-ico">🃏</span><b>Karteikarten</b><span class="fa" data-i18n="fcSub"></span></button>
            </div>
            <h3 class="hub-h">Übungen · <span class="fa" data-i18n="exercises"></span></h3>
            <div class="hub-grid" id="hubEx"></div>
          </div>
          <button class="exam-btn" data-open="exam"><span>🏁 Prüfung</span><span class="fa" data-i18n="examSub"></span></button>
        </div>

        <div class="p-view" id="pView" hidden>
          <div class="pv-head">
            <button class="icon-btn pv-back" id="pBack" aria-label="zurück">‹</button>
            <h2 id="pTitle"></h2>
            <span class="pv-prog" id="pProg"></span>
          </div>

          <div class="pv-panel" id="pEx" hidden>
            <div class="ex-wrap">
              <article class="ex-card">
                <div class="ex-top"><span class="ex-type" id="exType"></span><span class="ex-state" id="exState"></span><span class="ex-num" id="exNum"></span></div>
                <div class="ex-body" id="exBody"></div>
                <div class="ex-feedback" id="exFeedback" hidden></div>
                <div class="ex-foot">
                  <button class="btn ghost" id="exPrev">‹ Zurück</button>
                  <button class="btn" id="exCheck" hidden>Prüfen · <span class="fa" data-i18n="check"></span></button>
                  <button class="btn ghost" id="exNext">Weiter ›</button>
                </div>
              </article>
            </div>
            <div class="ex-map" id="exMap"></div>
          </div>

          <div class="pv-panel" id="pFc" hidden>
            <div class="fc-stats" id="fcStats"></div>
            <article class="fc-card" id="fcCard">
              <div class="fc-dir" id="fcDir"></div>
              <div class="fc-prompt" id="fcPrompt"></div>
              <span class="chip fa fc-pos" id="fcPos"></span>
              <div class="fc-opts" id="fcOpts"></div>
              <div class="fc-voice" id="fcVoice" hidden>
                <button class="mic" id="fcMic" aria-label="Mikrofon">🎤</button>
                <p class="heard fa" id="fcHeard" data-i18n="sayGerman"></p>
                <button class="chip-btn" id="fcSkip">Weiß nicht · <span class="fa" data-i18n="dontKnow"></span></button>
              </div>
              <div class="fc-info fa" id="fcInfo" hidden></div>
              <button class="btn" id="fcNext" hidden>Weiter ›</button>
            </article>
          </div>

          <div class="pv-panel" id="pDlg" hidden>
            <p class="dlg-intro fa" id="dlgIntro"></p>
            <div class="dlg-list" id="dlgList"></div>
            <div class="dlg-foot" id="dlgFoot"></div>
            <div class="dlg-sheet" id="dlgSheet" hidden></div>
          </div>

          <div class="pv-panel" id="pEnd" hidden></div>
        </div>
      </section>
    </main>

    <!-- Bottom dock -->
    <footer class="dock">
      <button class="dock-round dock-tabs-btn" id="dockTabsBtn" aria-label="Tabs"></button>
      <nav class="nav">
        <button class="tab-me" data-profile aria-label="Profile"><span class="avatar-btn js-avatar">?</span><span class="tab-l fa" data-i18n="tabMe"></span></button>
        <button data-go="vocab" aria-label="Vokabeln"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20 12 4l7 16M8 14h8"/></svg><span class="tab-l fa" data-i18n="tabVocab"></span></button>
        <button data-go="home" class="on" aria-label="Start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11 12 4l9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg><span class="tab-l fa" data-i18n="tabHome"></span></button>
        <button data-go="audio" aria-label="Audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span class="tab-l fa" data-i18n="tabDialog"></span></button>
        <button data-go="practice" aria-label="Üben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="tab-l fa" data-i18n="tabPractice"></span></button>
      </nav>
      <button class="dock-round dock-play" data-act="toggle" aria-label="play"><svg class="dring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" class="ring-bg"/><circle cx="18" cy="18" r="16" class="ring-fg" pathLength="100"/></svg><svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button>
      <div class="dock-player">
        <button class="dp-cover" data-go="audio" aria-label="Dialog"><svg class="dring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" class="ring-bg"/><circle cx="18" cy="18" r="16" class="ring-fg" pathLength="100"/></svg><span class="js-lesson-num">L1</span></button>
        <button class="dp-text" data-go="audio"><span class="dp-line" id="dpLine"></span><span class="dp-sub"><span id="dpWho"></span> · <span class="tCur">0:00</span> / <span class="tDur">0:00</span></span></button>
        <button class="icon-btn" data-act="toggle" aria-label="play"><svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button>
        <button class="icon-btn" data-act="next" aria-label="weiter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l8-7zM12 5v14l8-7z"/></svg></button>
        <div class="progress dp-prog" data-seek><i class="bar"></i></div>
      </div>
      <button class="dock-swap" id="dockSwap" aria-label="Dock links/rechts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></button>
    </footer>
  </div>

  <audio id="player" preload="metadata"></audio>
  <div class="toast" id="toast"></div>
  <div class="lang-menu" id="langMenu" hidden></div>
  <div class="pop-back" id="profBack" hidden>
    <div class="pop prof" role="dialog" aria-modal="true" aria-labelledby="profTitle">
      <div class="pop-head">
        <div class="avatar-big js-avatar">?</div>
        <div><div class="pop-word" id="profTitle" data-i18n="profile"></div><div class="pop-lemma fa" data-i18n="savedOnDevice"></div></div>
        <button class="icon-btn pop-x" id="profClose" aria-label="close">✕</button>
      </div>
      <label class="prof-name"><span class="fa" data-i18n="yourName"></span><input id="profName" maxlength="30" autocomplete="name"></label>
      <h3 class="fa" data-i18n="progress"></h3>
      <div class="prof-stats" id="profStats"></div>
      <div class="prof-lang"><span class="fa" data-i18n="uiLanguage"></span><div class="tabs" id="profLang"></div></div>
      <button class="btn ghost prof-reset" id="profReset" data-i18n="resetProgress"></button>
    </div>
  </div>
  <div class="pop-back vs-back" id="vBack" hidden><div class="vsheet" id="vSheet" role="dialog" aria-modal="true"></div></div>

  <div class="pop-back" id="popBack" hidden>
    <div class="pop" role="dialog" aria-modal="true" aria-labelledby="popWord">
      <div class="pop-head">
        <div><div class="pop-word" id="popWord"></div><div class="pop-lemma" id="popLemma"></div></div>
        <button class="say" id="popSay" aria-label="vorlesen"></button>
        <button class="icon-btn pop-x" id="popClose" aria-label="schließen">✕</button>
      </div>
      <span class="chip fa" id="popPos"></span>
      <p class="pop-fa fa" id="popFa"></p>
      <div class="pop-g fa" id="popG"></div>
      <div class="pop-ctx"><h3>Im Satz · <span class="fa" data-i18n="inSentence"></span></h3><p id="popCtx"></p><p class="fa" id="popCtxFa"></p></div>
    </div>
  </div>

  <script src="data/lessons.js?v=muib1hav"></script>
  <script src="data/lesson1-fa.js?v=muib1hav"></script>
  <script src="data/lesson1-times.js?v=muib1hav"></script>
  <script src="data/lesson1-words.js?v=muib1hav"></script>
  <script src="data/dict-de.js?v=muib1hav"></script>
  <script src="data/dict-tr.js?v=muib1hav"></script>
  <script src="data/lesson1-ru.js?v=muib1hav"></script>
  <script src="data/lesson1-uk.js?v=muib1hav"></script>
  <script src="i18n.js?v=muib1hav"></script>
  <script src="exercises.js?v=muib1hav"></script>
  <script src="app.js?v=muib1hav"></script>
</body>
</html>
