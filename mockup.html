<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAPP · iOS Mockup</title>
<!-- Mockup only: iOS-style redesign preview. One screen per URL: mockup.html?s=home&t=dark -->
<style>
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #F2F2F7; --fill: rgba(120,120,128,.12);
  --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.18);
  --tint: #FF2D55; --tint-soft: rgba(255,45,85,.12); --green: #34C759; --red: #FF3B30; --blue: #007AFF; --orange: #FF9500; --purple: #AF52DE; --teal: #30B0C7; --indigo: #5856D6;
  --glass: rgba(255,255,255,.72); --glass-border: rgba(255,255,255,.6); --shadow: 0 8px 30px rgba(0,0,0,.12);
}
:root[data-t="dark"] {
  --bg: #000; --card: #1C1C1E; --card2: #2C2C2E; --fill: rgba(120,120,128,.24);
  --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6);
  --tint: #FF375F; --tint-soft: rgba(255,55,95,.18); --green: #30D158; --red: #FF453A; --blue: #0A84FF; --orange: #FF9F0A; --purple: #BF5AF2; --teal: #40C8E0; --indigo: #5E5CE6;
  --glass: rgba(30,30,32,.72); --glass-border: rgba(255,255,255,.08); --shadow: 0 8px 30px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font-family: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Vazirmatn", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; }
.fa { direction: rtl; font-family: -apple-system, "Vazirmatn", system-ui, sans-serif; }
.screen { position: relative; height: 100%; display: flex; flex-direction: column; }
/* fake iOS status bar (the real phone draws its own) */
.sb { height: 54px; flex: 0 0 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 44px; font-weight: 600; font-size: 17px; }
.sb .icons { display: flex; gap: 6px; align-items: center; }
.scroll { flex: 1; overflow: auto; padding: 0 16px 190px; }
/* navigation bar with large title */
.nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 0; height: 44px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--fill); font-size: 15px; font-weight: 600; }
.pill .sub { color: var(--label2); font-weight: 500; }
.pill svg { width: 12px; height: 12px; color: var(--label2); }
.nav-right { display: flex; gap: 10px; align-items: center; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FF6B9A, #8A6CF0); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.lang { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 17px; background: var(--fill); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.large { font-size: 34px; font-weight: 700; letter-spacing: .37px; padding: 8px 0 4px; }
.large-sub { color: var(--label2); font-size: 15px; margin-bottom: 14px; }
.section-h { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: -.08px; padding: 22px 16px 7px; }
/* grouped inset list */
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--sep); }
.row .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: 0 0 30px; }
.row .ico svg { width: 18px; height: 18px; }
.row .txt { flex: 1; min-width: 0; }
.row .t1 { font-size: 17px; }
.row .t2 { font-size: 13px; color: var(--label2); margin-top: 1px; }
.row .val { color: var(--label2); font-size: 15px; }
.row .chev { color: var(--label3); width: 8px; }
/* cards */
.card { background: var(--card); border-radius: 16px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kicker { font-size: 12px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .3px; }
.h2 { font-size: 22px; font-weight: 700; margin-top: 4px; }
.muted { color: var(--label2); font-size: 15px; }
.ring { width: 64px; height: 64px; }
.stat { display: flex; align-items: center; gap: 14px; }
.big-num { font-size: 28px; font-weight: 700; }
/* tab bar: floating glass capsule + mini player (Apple Music style) */
.chrome { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 30px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border: .5px solid var(--glass-border); box-shadow: var(--shadow); pointer-events: auto; }
.mini { height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 8px; }
.mini .art { width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #FF6B9A, #8A6CF0); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.mini .mt { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .mt small { display: block; color: var(--label2); font-size: 12px; font-weight: 400; }
.mini button { width: 40px; height: 40px; display: grid; place-items: center; }
.mini svg { width: 22px; height: 22px; }
.tabbar { height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 6px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--label2); border-radius: 26px; margin: 6px 0; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--tint); background: var(--fill); }
/* segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin: 4px 0 14px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 600; }
.seg .on { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12); }
:root[data-t="dark"] .seg .on { background: #636366; }
/* dialog */
.sent { padding: 20px; border-radius: 20px; }
.who { font-size: 13px; font-weight: 700; color: var(--tint); display: flex; justify-content: space-between; }
.who span { color: var(--label2); font-weight: 500; }
.de { font-size: 26px; line-height: 1.35; font-weight: 600; margin: 12px 0 10px; letter-spacing: -.3px; }
.de .w { border-bottom: 1.5px dotted var(--label3); }
.de .w.hl { background: var(--tint-soft); color: var(--tint); border-radius: 6px; padding: 0 2px; border: 0; }
.tr { font-size: 17px; color: var(--label2); line-height: 1.7; }
.arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 0; }
.btn-gray { height: 50px; border-radius: 14px; background: var(--fill); display: grid; place-items: center; font-size: 17px; font-weight: 600; color: var(--tint); }
.line-row .t1 { font-size: 16px; }
.line-row.now { background: var(--tint-soft); }
.spk { font-size: 12px; font-weight: 700; color: var(--tint); width: 36px; }
.spk.ben { color: var(--indigo); }
/* practice */
.btn-big svg { width: 20px; height: 20px; }
.btn-big { width: 100%; height: 56px; border-radius: 16px; background: var(--tint); color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; }
.bar { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }
/* flashcard */
.fc { margin-top: 20px; padding: 28px 20px; border-radius: 24px; text-align: center; }
.fc .dir { font-size: 13px; color: var(--label2); }
.fc .word { font-size: 36px; font-weight: 700; margin: 18px 0 8px; letter-spacing: -.5px; }
.fc .pos { display: inline-block; font-size: 13px; color: var(--tint); background: var(--tint-soft); border-radius: 12px; padding: 4px 10px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.opt { height: 64px; border-radius: 16px; background: var(--card); font-size: 19px; font-weight: 600; }
.opt.ok { background: rgba(52,199,89,.16); color: var(--green); box-shadow: inset 0 0 0 2px var(--green); }
.streak { display: flex; justify-content: center; gap: 22px; color: var(--label2); font-size: 15px; font-weight: 600; margin-top: 10px; }
/* sheet */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 20px 40px; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
:root[data-t="dark"] .sheet { background: #1C1C1E; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 14px; }
.sheet .word { font-size: 30px; font-weight: 700; }
.sheet .meaning { font-size: 22px; margin: 12px 0; }
.gram { background: var(--card2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.9; }
.sheet .close { position: absolute; right: 16px; top: 16px; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label2); font-size: 14px; font-weight: 700; }
.mark { background: var(--tint-soft); color: var(--tint); border-radius: 4px; padding: 0 3px; }
/* speaking bubbles */
.bub { max-width: 82%; padding: 12px 14px; border-radius: 20px; font-size: 17px; line-height: 1.4; }
.bub.them { background: var(--card); border-bottom-left-radius: 6px; }
.bub.me { background: var(--tint); color: #fff; margin-left: auto; border-bottom-right-radius: 6px; }
.bub small { display: block; font-size: 12px; opacity: .7; font-weight: 600; margin-bottom: 3px; }
.listen { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 26px 0 0; color: var(--tint); font-weight: 600; }
.wave { display: flex; gap: 3px; align-items: center; height: 28px; }
.wave i { width: 4px; border-radius: 2px; background: var(--tint); }
.mic-big { width: 76px; height: 76px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; margin: 14px auto 0; box-shadow: 0 0 0 10px var(--tint-soft); }
.mic-big svg { width: 32px; height: 32px; color: #fff; }
</style>
</head>
<body>
<div class="screen" id="app"></div>
<script src="data/lessons.js"></script>
<script src="data/lesson1-fa.js"></script>
<script src="data/dict-de.js"></script>
<script>
const q = new URLSearchParams(location.search);
const S = q.get("s") || "home";
document.documentElement.dataset.t = q.get("t") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const L = LESSONS[0];
const lines = L.transcript.split("\n").map(s => s.trim()).filter(Boolean).map((s, i) => { const m = s.match(/^\*\*(.+?):\*\*\s*(.*)$/); return { who: m[1], text: m[2], fa: L.transcriptFa[i] }; });
const I = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  fwd: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14l9-7zM12 5v14l9-7z"/></svg>',
  chev: '<svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2"><path d="m1 1 6 6-6 6"/></svg>',
  down: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 4 4 4 4-4"/></svg>',
  words: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20 12 4l7 16M8 14h8"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>',
  wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>',
  person2: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM1 20c0-3.3 3.6-6 8-6s8 2.7 8 6zm16-5.9c3.1.3 6 2.4 6 5.9h-5c0-2.3-.4-4.3-1-5.9z"/></svg>',
  puzzle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12a2 2 0 0 0-2-2V6h-4a2 2 0 1 0-4 0H6v4a2 2 0 1 0 0 4v4h4a2 2 0 1 0 4 0h4v-4a2 2 0 0 0 2-2z"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h13v2H4z"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h12v14H4zM8 2h12v14h-2V4H8z"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5zm3 1h11l-2 4 2 4H8z"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>'
};
const sb = `<div class="sb"><span>9:41</span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 3c2 0 3.9.8 5.3 2.1l1.4-1.5A9.6 9.6 0 0 0 8 1C5.5 1 3.1 2 1.3 3.6l1.4 1.5A7.6 7.6 0 0 1 8 3zm0 4c1 0 2 .4 2.7 1.1l1.4-1.5A6 6 0 0 0 8 5a6 6 0 0 0-4.1 1.6l1.4 1.5C6 7.4 7 7 8 7zm0 4 1.8-1.9a2.6 2.6 0 0 0-3.6 0z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg></span></div>`;
const nav = `<div class="nav"><button class="pill"><b>L1</b><span class="sub">Sich vorstellen</span>${I.down}</button><div class="nav-right"><span class="lang">FA</span><span class="avatar">A</span></div></div>`;
const tabs = active => `<div class="tabbar glass">${[["vocab", I.words, "واژگان"], ["lesson", I.book, "درس"], ["home", I.home, "خانه"], ["audio", I.wave, "دیالوگ"], ["practice", I.target, "تمرین"]].map(([k, ic, lb]) => `<div class="tab ${k === active ? "on" : ""}">${ic}<span class="fa">${lb}</span></div>`).join("")}</div>`;
const mini = (i = 6) => `<div class="mini glass"><div class="art">L1</div><div class="mt">${lines[i].text}<small>${lines[i].who} · Daily German Talk</small></div><button>${I.play}</button><button>${I.fwd}</button></div>`;
const bottomBar = (active, withMini = true) => `<div class="chrome">${withMini ? mini() : ""}${tabs(active)}</div>`;
const row = (color, icon, t1, t2, val, extra = "") => `<div class="row"><span class="ico" style="background:${color}">${icon}</span><div class="txt"><div class="t1">${t1}</div>${t2 ? `<div class="t2 fa" style="text-align:left">${t2}</div>` : ""}${extra}</div>${val ? `<span class="val">${val}</span>` : ""}<span class="chev">${I.chev}</span></div>`;
const words = (t, hl) => t.split(" ").map(w => `<span class="w ${w.replace(/[^\wäöüß]/gi, "") === hl ? "hl" : ""}">${w}</span>`).join(" ");

const screens = {
  home: () => `${sb}${nav}<div class="scroll">
    <div class="large">Guten Abend</div><div class="large-sub">Freitag, 25. September · <span class="fa">۵ دقیقه تمرین امروز</span></div>
    <div class="grid2">
      <div class="card stat"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--fill)" stroke-width="3.5"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--tint)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="34 100" transform="rotate(-90 18 18)"/></svg><div><div class="big-num">34%</div><div class="muted fa">پیشرفت درس</div></div></div>
      <div class="card"><div class="kicker">🔥 Serie</div><div class="big-num" style="margin-top:6px">4 <span class="muted fa" style="font-size:15px">روز</span></div></div>
    </div>
    <div class="section-h">Weiterhören</div>
    <div class="card"><div class="who">Anna <span>7 / 173</span></div><div class="de" style="font-size:22px">${lines[6].text}</div><div class="tr fa">${lines[6].fa}</div></div>
    <div class="section-h">Wort des Tages</div>
    <div class="group">${row("var(--orange)", I.words, "das Vorbild", "الگو · اسم خنثی", "")}</div>
    <div class="section-h">Lektion</div>
    <div class="group">${row("var(--blue)", I.book, "Sich vorstellen", "معرفی خود · A1", "")}</div>
  </div>${bottomBar("home")}`,

  audio: () => `${sb}${nav}<div class="scroll">
    <div class="large">Dialog</div>
    <div class="card sent"><div class="who">Anna <span>7 / 173</span></div><div class="de">${words(lines[6].text, "prima")}</div><div class="tr fa">${lines[6].fa}</div></div>
    <div class="arrows"><button class="btn-gray">‹ Zurück</button><button class="btn-gray">Weiter ›</button></div>
    <div class="section-h">Transkript</div>
    <div class="seg"><button class="on">Alle</button><button>Anna</button><button>Ben</button></div>
    <div class="group">${lines.slice(4, 10).map((l, k) => `<div class="row line-row ${k === 2 ? "now" : ""}"><span class="spk ${l.who === "Ben" ? "ben" : ""}">${l.who}</span><div class="txt"><div class="t1">${l.text}</div></div></div>`).join("")}</div>
  </div>${bottomBar("audio")}`,

  practice: () => `${sb}${nav}<div class="scroll">
    <div class="large">Üben</div><div class="large-sub fa" style="text-align:left">حرف بزن، نه فقط بنویس</div>
    <div class="section-h">Sprechen</div>
    <div class="group">
      ${row("var(--tint)", I.person2, "Rollenspiel", "نقش‌آفرینی · ۱۰ خط", "")}
      ${row("var(--purple)", I.puzzle, "Lückendialog", "جای خالی را بگو · ۵ خط", "")}
      ${row("var(--indigo)", I.text, "Vorlesen", "بلندخوانی · ۵ خط", "")}
      ${row("var(--orange)", I.cards, "Karteikarten", "فلش‌کارت لغات · صوتی", "")}
    </div>
    <div class="section-h">Übungen</div>
    <div class="group">
      ${[["var(--blue)", "Übersetzen", "ترجمه کن", 12, 20], ["var(--teal)", "Lücke füllen", "جای خالی را بنویس", 7, 20], ["var(--green)", "Satz bauen", "جمله را بساز", 4, 20]].map(([c, a, b, d, n]) => row(c, I.text, a, b, `${d}/${n}`, `<div class="bar"><i style="width:${d / n * 100}%"></i></div>`)).join("")}
    </div>
    <button class="btn-big">${I.flag} Prüfung starten</button>
  </div>${bottomBar("practice", false)}`,

  speak: () => `${sb}<div class="nav"><button class="pill">‹ Üben</button><span class="muted">3 / 10</span></div><div class="scroll">
    <div class="large">Rollenspiel</div><div class="large-sub fa" style="text-align:left">وقتی نوبت توست، میکروفون خودش روشن می‌شود</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="bub them"><small>Ben</small>${lines[37].text}</div>
      <div class="bub me"><small>Anna · du</small>${lines[38].text}</div>
    </div>
    <div class="mic-big">${I.mic}</div>
    <div class="listen"><span class="wave">${[10, 18, 26, 14, 22, 9, 16].map(h => `<i style="height:${h}px"></i>`).join("")}</span><span class="fa">گوش می‌دهم… بگو</span></div>
  </div>${bottomBar("practice", false)}`,

  flash: () => `${sb}<div class="nav"><button class="pill">‹ Üben</button><span class="lang">FA</span></div><div class="scroll">
    <div class="large">Karteikarten</div>
