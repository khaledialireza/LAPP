<title>LAPP · iOS Mockup</title>
<!-- Mockup only: iOS-style redesign preview. One screen per URL: mockup.html?s=home&t=dark -->
<style>
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #F2F2F7; --fill: rgba(120,120,128,.12);
  --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.18);
  --tint: #FF2D55; --tint-soft: rgba(255,45,85,.12); --green: #34C759; --red: #FF3B30; --blue: #007AFF; --orange: #FF9500; --purple: #AF52DE; --teal: #30B0C7; --indigo: #5856D6;
  --glass: rgba(255,255,255,.72); --glass-border: rgba(255,255,255,.6); --shadow: 0 8px 30px rgba(0,0,0,.12);
}
:root[data-t="dark"] {
  --bg: #000; --card: #1C1C1E; --card2: #2C2C2E; --fill: rgba(120,120,128,.24);
  --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6);
  --tint: #FF375F; --tint-soft: rgba(255,55,95,.18); --green: #30D158; --red: #FF453A; --blue: #0A84FF; --orange: #FF9F0A; --purple: #BF5AF2; --teal: #40C8E0; --indigo: #5E5CE6;
  --glass: rgba(30,30,32,.72); --glass-border: rgba(255,255,255,.08); --shadow: 0 8px 30px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font-family: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Vazirmatn", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; }
.fa { direction: rtl; font-family: -apple-system, "Vazirmatn", system-ui, sans-serif; }
.screen { position: relative; height: 100%; display: flex; flex-direction: column; }
/* fake iOS status bar (the real phone draws its own) */
.sb { height: 54px; flex: 0 0 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 44px; font-weight: 600; font-size: 17px; }
.sb .icons { display: flex; gap: 6px; align-items: center; }
.scroll { flex: 1; overflow: auto; padding: 0 16px 190px; }
/* navigation bar with large title */
.nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 0; height: 44px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--fill); font-size: 15px; font-weight: 600; }
.pill .sub { color: var(--label2); font-weight: 500; }
.pill svg { width: 12px; height: 12px; color: var(--label2); }
.nav-right { display: flex; gap: 10px; align-items: center; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FF6B9A, #8A6CF0); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.lang { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 17px; background: var(--fill); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.large { font-size: 34px; font-weight: 700; letter-spacing: .37px; padding: 8px 0 4px; }
.large-sub { color: var(--label2); font-size: 15px; margin-bottom: 14px; }
.section-h { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: -.08px; padding: 22px 16px 7px; }
/* grouped inset list */
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--sep); }
.row .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: 0 0 30px; }
.row .ico svg { width: 18px; height: 18px; }
.row .txt { flex: 1; min-width: 0; }
.row .t1 { font-size: 17px; }
.row .t2 { font-size: 13px; color: var(--label2); margin-top: 1px; }
.row .val { color: var(--label2); font-size: 15px; }
.row .chev { color: var(--label3); width: 8px; }
/* cards */
.card { background: var(--card); border-radius: 16px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kicker { font-size: 12px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .3px; }
.h2 { font-size: 22px; font-weight: 700; margin-top: 4px; }
.muted { color: var(--label2); font-size: 15px; }
.ring { width: 64px; height: 64px; }
.stat { display: flex; align-items: center; gap: 14px; }
.big-num { font-size: 28px; font-weight: 700; }
/* tab bar: floating glass capsule + mini player (Apple Music style) */
.chrome { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 30px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border: .5px solid var(--glass-border); box-shadow: var(--shadow); pointer-events: auto; }
.mini { height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 8px; }
.mini .art { width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(135deg, #FF6B9A, #8A6CF0); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.mini .mt { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .mt small { display: block; color: var(--label2); font-size: 12px; font-weight: 400; }
.mini button { width: 40px; height: 40px; display: grid; place-items: center; }
.mini svg { width: 22px; height: 22px; }
.tabbar { height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 6px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--label2); border-radius: 26px; margin: 6px 0; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--tint); background: var(--fill); }
/* segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin: 4px 0 14px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 600; }
.seg .on { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12); }
:root[data-t="dark"] .seg .on { background: #636366; }
/* dialog */
.sent { padding: 20px; border-radius: 20px; }
.who { font-size: 13px; font-weight: 700; color: var(--tint); display: flex; justify-content: space-between; }
.who span { color: var(--label2); font-weight: 500; }
.de { font-size: 26px; line-height: 1.35; font-weight: 600; margin: 12px 0 10px; letter-spacing: -.3px; }
.de .w { border-bottom: 1.5px dotted var(--label3); }
.de .w.hl { background: var(--tint-soft); color: var(--tint); border-radius: 6px; padding: 0 2px; border: 0; }
.tr { font-size: 17px; color: var(--label2); line-height: 1.7; }
.arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 0; }
.btn-gray { height: 50px; border-radius: 14px; background: var(--fill); display: grid; place-items: center; font-size: 17px; font-weight: 600; color: var(--tint); }
.line-row .t1 { font-size: 16px; }
.line-row.now { background: var(--tint-soft); }
.spk { font-size: 12px; font-weight: 700; color: var(--tint); width: 36px; }
.spk.ben { color: var(--indigo); }
/* practice */
.btn-big svg { width: 20px; height: 20px; }
.btn-big { width: 100%; height: 56px; border-radius: 16px; background: var(--tint); color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; }
.bar { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }
/* flashcard */
.fc { margin-top: 20px; padding: 28px 20px; border-radius: 24px; text-align: center; }
.fc .dir { font-size: 13px; color: var(--label2); }
.fc .word { font-size: 36px; font-weight: 700; margin: 18px 0 8px; letter-spacing: -.5px; }
.fc .pos { display: inline-block; font-size: 13px; color: var(--tint); background: var(--tint-soft); border-radius: 12px; padding: 4px 10px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.opt { height: 64px; border-radius: 16px; background: var(--card); font-size: 19px; font-weight: 600; }
.opt.ok { background: rgba(52,199,89,.16); color: var(--green); box-shadow: inset 0 0 0 2px var(--green); }
.streak { display: flex; justify-content: center; gap: 22px; color: var(--label2); font-size: 15px; font-weight: 600; margin-top: 10px; }
/* sheet */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 20px 40px; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
:root[data-t="dark"] .sheet { background: #1C1C1E; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 14px; }
.sheet .word { font-size: 30px; font-weight: 700; }
.sheet .meaning { font-size: 22px; margin: 12px 0; }
.gram { background: var(--card2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.9; }
.sheet .close { position: absolute; right: 16px; top: 16px; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label2); font-size: 14px; font-weight: 700; }
.mark { background: var(--tint-soft); color: var(--tint); border-radius: 4px; padding: 0 3px; }
/* speaking bubbles */
.bub { max-width: 82%; padding: 12px 14px; border-radius: 20px; font-size: 17px; line-height: 1.4; }
.bub.them { background: var(--card); border-bottom-left-radius: 6px; }
.bub.me { background: var(--tint); color: #fff; margin-left: auto; border-bottom-right-radius: 6px; }
.bub small { display: block; font-size: 12px; opacity: .7; font-weight: 600; margin-bottom: 3px; }
.listen { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 26px 0 0; color: var(--tint); font-weight: 600; }
.wave { display: flex; gap: 3px; align-items: center; height: 28px; }
.wave i { width: 4px; border-radius: 2px; background: var(--tint); }
.mic-big { width: 76px; height: 76px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; margin: 14px auto 0; box-shadow: 0 0 0 10px var(--tint-soft); }
.mic-big svg { width: 32px; height: 32px; color: #fff; }

/* home v2 */
.navh { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 0; height: 44px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile3 { background: var(--card); border-radius: 16px; padding: 12px; min-height: 118px; display: flex; flex-direction: column; gap: 4px; }
.tile3 .kicker { font-size: 11px; }
.tile3 .t { font-size: 16px; font-weight: 700; line-height: 1.2; }
.tile3 .s { font-size: 13px; color: var(--label2); text-align: left; }
.tile3 .chipx { margin-top: auto; align-self: flex-start; font-size: 12px; color: var(--tint); background: var(--tint-soft); border-radius: 10px; padding: 2px 8px; }
.ring-s { width: 46px; height: 46px; margin: 4px 0; }
.player { background: var(--card); border-radius: 20px; padding: 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.player .top { display: flex; align-items: center; gap: 12px; }
.player .art { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #FF6B9A, #8A6CF0); color: #fff; font-weight: 800; display: grid; place-items: center; }
.player .meta { flex: 1; }
.player .meta b { display: block; font-size: 15px; } .player .meta span { font-size: 13px; color: var(--label2); }
.player .de2 { font-size: 21px; font-weight: 600; line-height: 1.35; letter-spacing: -.2px; }
.player .fa2 { font-size: 16px; color: var(--label2); line-height: 1.8; text-align: left; }
.player .prog { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 4px; } .player .prog i { display: block; height: 100%; width: 24%; background: var(--tint); }
.player .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--label2); }
.player .ctrls { display: flex; justify-content: center; align-items: center; gap: 28px; }
.player .ctrls button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--label); }
.player .ctrls .pp { width: 60px; height: 60px; border-radius: 50%; background: var(--tint); color: #fff; }
.player .ctrls svg { width: 24px; height: 24px; }

/* landscape with side rail */
.land { position: relative; height: 100%; display: flex; }
.land.left { flex-direction: row-reverse; }
.land .main { flex: 1; min-width: 0; padding: 14px 18px 14px 18px; display: grid; grid-template-columns: 1fr 1.15fr; grid-template-rows: auto 1fr; gap: 12px; }
.land.right .main { padding-left: 54px; } .land.left .main { padding-right: 54px; }
.rail { width: 76px; flex: 0 0 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0; }
.land.right .rail { padding-right: 14px; } .land.left .rail { padding-left: 14px; }
.rail .pillv { border-radius: 30px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.rail .tabv { width: 48px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--label2); }
.rail .tabv svg { width: 23px; height: 23px; }
.rail .tabv.on { color: var(--tint); background: var(--fill); }
.rail .swap { margin-top: 10px; width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--label2); }
.rail .swap svg { width: 18px; height: 18px; }
.land .topbar { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
.land .greet { font-size: 26px; font-weight: 700; }
.land .tiles3 { grid-template-columns: repeat(3, 1fr); align-self: start; }
.land .tile3 { min-height: 104px; }
.land .player { margin: 0; grid-row: 2; grid-column: 2; }
.land .player .de2 { font-size: 17px; } .land .player .fa2 { font-size: 14px; line-height: 1.6; }
.land .player .ctrls .pp { width: 50px; height: 50px; }
.npill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 12px; border-radius: 17px; background: var(--tint-soft); color: var(--tint); font-size: 13px; font-weight: 600; }
.npill .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; } .npill .bars i { width: 3px; background: var(--tint); border-radius: 1px; }
.npill button { width: 26px; height: 26px; border-radius: 13px; background: var(--tint); color: #fff; display: grid; place-items: center; } .npill svg { width: 12px; height: 12px; }

.avatar.sm { width: 26px; height: 26px; font-size: 12px; }
.tab.on .avatar.sm, .tabv.on .avatar.sm { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--tint); }
.tile3.tap { position: relative; box-shadow: inset 0 0 0 2px var(--tint); }
.tile3.tap::after { content: "›"; position: absolute; right: 10px; top: 6px; font-size: 22px; color: var(--tint); font-weight: 600; }
.backnav { display: flex; align-items: center; gap: 2px; color: var(--tint); font-size: 17px; padding: 6px 12px; }
.backnav b { font-size: 26px; font-weight: 400; margin-top: -3px; }
.phr { padding: 12px 16px; border-bottom: .5px solid var(--sep); } .phr:last-child { border: 0; }
.phr .d { font-weight: 600; font-size: 16px; } .phr .f { color: var(--label2); font-size: 14px; margin-top: 3px; }

/* dock with player accessory (iOS 26 style) */
.dk { display: flex; gap: 8px; align-items: center; }
.dk .tabbar { flex: 1; }
.rbtn { width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center; flex: 0 0 64px; position: relative; color: var(--tint); }
.rbtn svg.ic { width: 26px; height: 26px; }
.rbtn .ring { position: absolute; inset: 5px; width: auto; height: auto; }
.dk .mini { flex: 1; min-width: 0; height: 64px; border-radius: 32px; padding-right: 10px; }
.dk .mini .art { width: 46px; height: 46px; border-radius: 23px; }
.pbar { position: absolute; left: 70px; right: 96px; bottom: 7px; height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.pbar i { display: block; width: 28%; height: 100%; background: var(--tint); }
.nowcard { background: var(--card); border-radius: 20px; padding: 16px; margin-top: 12px; }
.nowcard .k { font-size: 12px; font-weight: 600; color: var(--label2); text-transform: uppercase; display: flex; justify-content: space-between; }
.nowcard .d { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 8px 0 6px; }
.nowcard .f { font-size: 15px; color: var(--label2); line-height: 1.8; }
.tapnote { position: absolute; font-size: 12px; font-weight: 700; color: #fff; background: #0A84FF; border-radius: 10px; padding: 3px 8px; pointer-events: none; }
.railp { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.railp .vmini { width: 60px; border-radius: 30px; padding: 7px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.railp .vmini .art { width: 46px; height: 46px; border-radius: 23px; background: linear-gradient(135deg, #FF6B9A, #8A6CF0); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.railp .vmini button { width: 44px; height: 40px; display: grid; place-items: center; }
.railp .vmini svg { width: 22px; height: 22px; }
.land .main.one { grid-template-columns: 1fr; }

/* landscape v3 */
.l3 { position: relative; height: 100%; display: flex; }
.l3 .content { flex: 1; min-width: 0; padding: 14px 10px 14px 59px; display: grid; gap: 12px; }
.l3 .rail { width: auto; flex: 0 0 auto; padding: 0 59px 0 6px; }
.l3 .railp .pillv { padding: 4px; }
.l3 .rail .tabv { height: 40px; width: 44px; }
.l3.b .content { grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; }
.l3 .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.l3 .hd .g { font-size: 22px; font-weight: 700; line-height: 1.1; } .l3 .hd .d { font-size: 12px; color: var(--label2); }
.chipL { height: 30px; padding: 0 10px; border-radius: 15px; background: var(--card); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.l3 .glist { background: var(--card); border-radius: 16px; overflow: hidden; align-self: stretch; display: flex; flex-direction: column; }
.l3 .gr { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: .5px solid var(--sep); }
.l3 .gr:first-child { border-top: 0; }
.l3 .gr .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; flex: 0 0 30px; }
.l3 .gr .tx { flex: 1; min-width: 0; } .l3 .gr .k { font-size: 11px; color: var(--label2); text-transform: uppercase; font-weight: 600; }
.l3 .gr .v { font-size: 15px; font-weight: 600; } .l3 .gr .f { font-size: 12px; color: var(--label2); }
.l3 .gr .chev { color: var(--label3); }
.l3 .big { grid-column: 2; grid-row: 1 / span 2; background: var(--card); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; }
.l3 .big .k { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--label2); }
.l3 .big .d { font-size: 22px; font-weight: 600; line-height: 1.35; margin: 12px 0 8px; }
.l3 .big .f { font-size: 16px; color: var(--label2); line-height: 1.8; }
.l3 .big .nav2 { margin-top: auto; display: flex; gap: 8px; }
.l3 .big .nav2 span { flex: 1; height: 40px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; font-size: 20px; color: var(--label2); }
.l3.a .content { grid-template-rows: auto auto 1fr; }
.l3.a .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.l3.a .mt { background: var(--card); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.l3.a .big { grid-column: auto; grid-row: auto; }
.l3.a .big .d { font-size: 19px; margin: 8px 0 4px; }

/* landscape v4: home as a dashboard */
.l4 { position: relative; height: 100%; display: flex; }
.l4 .content { flex: 1; min-width: 0; padding: 14px 12px 16px 64px; display: flex; flex-direction: column; gap: 10px; }
.l4 .rail { flex: 0 0 auto; padding: 0 64px 0 4px; display: flex; align-items: center; }
.l4 .railp { gap: 6px; }
.l4 .pillv { padding: 3px !important; border-radius: 22px !important; gap: 0 !important; }
.l4 .tabv { width: 38px !important; height: 36px !important; border-radius: 18px !important; }
.l4 .tabv svg { width: 19px !important; height: 19px !important; }
.l4 .tabv .avatar.sm { width: 22px; height: 22px; font-size: 10px; }
.l4 .rbtn.sm { width: 42px; height: 42px; flex: 0 0 42px; }
.l4 .rbtn.sm svg.ic { width: 18px; height: 18px; }
.l4 .hd { display: flex; align-items: baseline; gap: 10px; }
