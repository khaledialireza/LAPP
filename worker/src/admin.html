<!doctype html>
<html lang="en"><head><!--LAPP:HEAD-->
<title>LAPP Admin</title>
<script src="/ui/shell.js?v={{V}}"></script>
<script src="/ui/drive.js?v={{V}}"></script>
<style>
/* same look as the studio (studio.html) */
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Vazirmatn,system-ui,sans-serif;min-height:100vh}
main{padding:22px 26px 60px;display:flex;flex-direction:column;gap:14px;min-width:0;z-index:1}

.card h3{font-size:14px;margin-bottom:10px}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flt .k-search{flex:1;min-width:220px}
.row{display:grid;grid-template-columns:44px 1.6fr 1fr 1fr 90px 110px;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:rgba(21,21,31,.8);cursor:pointer}
.row:hover{border-color:var(--ln2)}.row.sel{box-shadow:0 0 0 1px var(--vi);background:rgba(139,92,246,.1)}.row.off{opacity:.55}
.row.hd{background:none;border:0;padding:0 12px;color:var(--mu2);font-size:12px;cursor:default}
.u{min-width:0}.u b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.u small{color:var(--mu);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:12.5px}
.dr{background:var(--p1);border-inline-start:1px solid var(--ln2);padding:20px;display:flex;flex-direction:column;gap:12px;height:100vh;position:fixed;inset-inline-end:0;top:0;width:min(400px,100%);overflow:auto;z-index:50;box-shadow:-20px 0 60px rgba(0,0,0,.55)}
.dh{display:flex;gap:12px;align-items:center}.dh b{font-size:18px;display:block}
.x{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;background:var(--p3);color:var(--mu)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.foot{margin-top:auto;display:flex;gap:8px;padding-top:8px}


.grp{font-size:12px;font-weight:800;color:var(--mu);margin:8px 0 2px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:1100px){html:not(.desk) }
@container (max-width:900px){.row{grid-template-columns:40px 1fr auto}.row>:nth-child(n+4){display:none}.row.hd{display:none}}
@media (max-width:760px){html:not(.desk) .row{grid-template-columns:40px 1fr auto}html:not(.desk) .row>:nth-child(n+4){display:none}html:not(.desk) .row.hd{display:none}}
</style></head><body>
<main id="view"></main>

<dialog id="addDlg" class="k-dlg"><form method="dialog" id="addForm">
  <h3>Add user</h3>
  <div class="cols2"><div class="f"><label>Name</label><input class="in" name="name" maxlength="40"></div>
  <div class="f"><label>Username</label><input class="in" name="username" required pattern="[a-zA-Z0-9_.]{3,20}" maxlength="20"></div></div>
  <div class="f"><label>E-mail</label><input class="in" name="email" type="email" required></div>
  <div class="f"><label>Role</label><div class="seg fill" id="addRole"></div></div>
  <div class="opt box"><div>Send an invitation e-mail<small>They choose their own password from the link (valid 7 days)</small></div><button type="button" class="sw on" id="addInvite" aria-pressed="true"></button></div>
  <div class="k-acts"><button class="b" value="cancel" formnovalidate>Cancel</button><button class="b pr" value="ok">Create</button></div>
</form></dialog>

<dialog id="aiDlg" class="k-dlg wide"><form method="dialog" id="aiForm">
  <h3 id="aiTitle">Add an AI</h3>
  <div class="f"><label>Provider</label><l-select name="kind" id="aiKind"></l-select></div>
  <div class="cols2"><div class="f"><label>Name (as you'll see it)</label><input class="in" name="name" maxlength="60" placeholder="GPT for translations"></div>
  <div class="f"><label>Model</label><input class="in" name="model" id="aiModel" list="aiModels" required maxlength="120"><datalist id="aiModels"></datalist></div></div>
  <div class="f" id="aiUrlF"><label>Address of the server (…/v1)</label><input class="in" name="base_url" id="aiUrl" maxlength="300"></div>
  <div class="f" id="aiKeyF"><label id="aiKeyL">API key</label><input class="in" name="api_key" id="aiKey" type="password" autocomplete="off" maxlength="400"></div>
  <p class="mu" id="aiHint"></p>
  <div class="k-acts"><button class="b" value="cancel" formnovalidate>Cancel</button><button class="b pr" value="ok" id="aiOk">Add</button></div>
</form></dialog>

<dialog id="orgDlg" class="k-dlg"><form method="dialog" id="orgForm">
  <h3>New school</h3>
  <div class="f"><label>School name</label><input class="in" name="name" required placeholder="Sprachschule Berlin"></div>
  <div class="f"><label>Address · lapp.khaledi.eu/s/…</label><input class="in" name="slug" required pattern="[a-z0-9][a-z0-9-]{1,30}" placeholder="berlin"></div>
  <div class="cols2"><div class="f"><label>School admin's e-mail</label><input class="in" name="adminEmail" type="email" placeholder="director@school.de"></div><div class="f"><label>Their name</label><input class="in" name="adminName"></div></div>
  <div class="f"><label>Colour</label><input class="in" name="color" type="color" value="#8B5CF6" style="height:42px;padding:4px"></div>
  <p class="mu">The admin gets an invitation e-mail and adds the school's teachers, staff and students.</p>
  <div class="k-acts"><button class="b" value="cancel" formnovalidate>Cancel</button><button class="b pr" value="ok">Create school</button></div>
</form></dialog>

<script>
const { $, esc } = K;
const flag = c => c && /^[A-Z]{2}$/.test(c) ? String.fromCodePoint(...[...c].map(x => 127397 + x.charCodeAt(0))) + " " + c : "—";
const day = ms => K.date(ms) || "—";
const ago = ms => K.ago(ms);
const ROLE = { user: "Learner", designer: "Designer", manager: "Manager", admin: "Admin" }, ROLE_TONE = { admin: "g", manager: "vi", designer: "cy" };
const avatar = u => K.avatar(u, 36);
let ME = null;
const toast = (t, o) => Shell.toast(t, o);
const api = K.apiAt("/api");
const isAdmin = () => ME.role === "admin";
const plan = u => u.disabled ? `<span class="pl bad">Disabled</span>`
  : u.sub_status === "active" ? `<span class="pl g">Plus · ${u.sub_interval === "year" ? "yearly" : "monthly"}</span>`
  : u.sub_status === "trialing" ? `<span class="pl warn">Trial</span>`
  : u.plus_until > Date.now() ? `<span class="pl g">Plus · gift</span>`
  : u.role !== "user" ? `<span class="mu">—</span>` : u.country === "IR" ? `<span class="pl ok">Iran · free</span>` : `<span class="pl">Free</span>`;

/* ================= views ================= */
const V = {};
let STATS = null;
async function stats() { STATS = await api("GET", "/admin/stats"); Shell.badge("nU", STATS.users.toLocaleString("en")); return STATS; }

V.dash = async () => {
  const s = await stats();
  const max = Math.max(1, ...s.days.map(d => d.n)), byDay = new Map(s.days.map(d => [d.d, d.n])), today = Math.floor(Date.now() / 864e5);
  const bars = Array.from({ length: 30 }, (_, i) => byDay.get(today - 29 + i) || 0);
  return `<div class="top"><h1>Dashboard</h1></div>
  <div class="kp"><div><b>${s.users}</b><span>Users · ${s.verified} verified</span></div><div><b>${s.activeWeek}</b><span>Active this week</span></div><div><b>${s.newWeek}</b><span>New this week</span></div>
   <div><b>${s.plus}</b><span>Plus subscribers</span></div><div><b>${s.trial}</b><span>In trial</span></div><div><b>${s.iran}</b><span>Iran · free</span></div><div><b>${s.schools}</b><span>Schools · ${s.seats} people</span></div><div><b>${s.staff}</b><span>Team</span></div></div>
  <div class="split"><div class="card"><h3>Sign-ups · last 30 days</h3><div class="k-bars">${bars.map(n => `<i style="height:${n / max * 100}%" title="${n}"></i>`).join("")}</div></div>
   <div class="card"><h3>Countries</h3><div class="list">${s.countries.map(c => `<div class="li"><span>${flag(c.country)}</span><b>${c.n}</b></div>`).join("") || `<div class="empty">No users yet</div>`}</div></div></div>
  <div class="card"><h3>Newest users</h3><div class="list">${s.recent.map(u => `<div class="li"><span><b>@${esc(u.username)}</b> <span class="mu">${esc(u.email)}</span></span><span class="mu">${flag(u.country)} · ${ago(u.created_at)}</span></div>`).join("") || `<div class="empty">No users yet</div>`}</div></div>`;
};

/* ---- users: list + edit drawer ---- */
let U = { q: "", filter: "all", page: 0, sel: null, rows: [], edit: null };
V.users = async () => {
  const sch = U.filter === "schools", plusF = U.filter === "plus";
  const [r, orgs, cust] = await Promise.all([
    sch ? { users: [], more: false } : api("GET", `/admin/users?q=${encodeURIComponent(U.q)}&filter=${U.filter}&page=${U.page}`),
    (sch || (U.filter === "all" && !U.page)) && isAdmin() ? api("GET", "/admin/orgs").then(x => x.orgs) : [],
    plusF ? api("GET", "/admin/customers") : null, STATS ? null : stats()]);
  U.rows = r.users;
  const q = U.q.trim().toLowerCase(), os = orgs.filter(o => !q || (o.name + " " + o.slug).toLowerCase().includes(q));
  const s = STATS, F = [["all", "All"], ["free", "Free"], ["plus", "Plus"], ["schools", "Schools"], ["staff", "Team"], ["iran", "Iran"], ["unverified", "Unverified"], ["disabled", "Disabled"]];
  const orgRow = o => `<div class="row ${o.disabled ? "off" : ""}" data-org="${o.id}" title="A school account: its own people are managed by the school">
    <div class="av" style="background:${esc(o.color)};border-radius:11px">${esc(o.name.charAt(0))}</div><div class="u"><b>${esc(o.name)}</b><small>/s/${esc(o.slug)} · ${esc(o.admin_email || "no admin yet")}</small></div>
    <div><span class="pl vi">School</span></div><div><span class="pl g">${o.students} students</span></div><div class="mu">${o.teachers} teachers</div><div class="acts"><a class="b sm" href="/s/${esc(o.slug)}" target="_blank" rel="noopener">Open ↗</a></div></div>`;
  return `<div class="top"><h1>Users</h1><button class="b" id="export">⬇ Export</button>${isAdmin() ? `<button class="b" id="addSchool">🏫 New school</button>` : ""}<button class="b pr" id="add">＋ Add user</button></div>
  <div class="kp"><div><b>${s.users}</b><span>Your users</span></div><div><b>${s.plus + s.trial + s.grants}</b><span>Plus · paying or gift</span></div><div><b>${s.schools}</b><span>School accounts · ${s.seats} people</span></div><div><b>${s.staff}</b><span>Team</span></div></div>
  <div class="flt"><label class="k-search">${K.I("search", 15)}<input id="q" placeholder="Name, e-mail, username, school…" value="${esc(U.q)}"></label>${F.filter(([k]) => k !== "schools" || isAdmin()).map(([k, l]) => `<button class="chip ${U.filter === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
  ${plusF ? `<div class="card"><h3>💳 Subscriptions ${cust.stripe ? `<a class="b sm" style="float:inline-end" href="https://dashboard.stripe.com/" target="_blank" rel="noopener">Stripe ↗</a>` : `<span class="pl warn">Stripe is not connected yet</span>`}</h3><div class="list">
     ${cust.subscriptions.map(x => `<div class="li"><span><b>@${esc(x.username)}</b> <span class="mu">${esc(x.status)} · ${x.interval === "year" ? "yearly" : x.interval === "month" ? "monthly" : "—"}</span></span><span class="mu">${x.cancel_at_end ? "ends" : "renews"} ${day(x.period_end)}</span></div>`).join("") || `<div class="r mu">No subscriptions yet</div>`}
     ${cust.grants.map(g => `<div class="li"><span><b>🎁 @${esc(g.username)}</b> <span class="mu">gift</span></span><span class="mu">until ${day(g.plus_until)}</span></div>`).join("")}</div></div>` : ""}
  <div class="row hd"><span></span><span>${sch ? "School" : "User"}</span><span>Type</span><span>Plan</span><span>${sch ? "Teachers" : "Country"}</span><span>${sch ? "" : "Last seen"}</span></div>
  ${os.map(orgRow).join("")}
  ${U.rows.map(u => `<div class="row ${u.id === U.sel ? "sel" : ""} ${u.disabled ? "off" : ""}" data-u="${u.id}">${avatar(u)}
    <div class="u"><b>@${esc(u.username)}${u.name ? ` · ${esc(u.name)}` : ""}</b><small>${esc(u.email)}${u.verified ? "" : ` · <span style="color:var(--am)">unverified</span>`}</small></div>
    <div><span class="pl ${ROLE_TONE[u.role] || ""}">${ROLE[u.role]}</span></div><div>${plan(u)}</div><div>${flag(u.country)}</div><div class="mu">${ago(u.last_seen)}</div></div>`).join("")}
  ${!os.length && !U.rows.length ? `<div class="empty">Nobody here</div>` : ""}
  <div class="acts">${U.page ? `<button class="b" data-pg="-1">‹ Newer</button>` : ""}${r.more ? `<button class="b" data-pg="1">Older ›</button>` : ""}</div>
  <p class="mu">🔒 Students and teachers a school created themselves belong to that school and are not listed here: only its admins see them. You see the school as one account.</p>`;
};
function drawer() {
  let d = $("#drawer");
  const u = U.rows.find(x => x.id === U.sel);
  if (!u) { d && d.remove(); return; }
  if (!d) { d = document.createElement("div"); d.id = "drawer"; d.className = "dr"; document.body.append(d); }
  const E = U.edit;
  const self = u.id === ME.id, can = isAdmin() || u.role === "user", gift = u.plus_until > Date.now();
  const stripe = u.sub_status ? `${u.sub_status === "trialing" ? "Trial" : "Plus"} · ${u.sub_interval === "year" ? "yearly" : "monthly"} (Stripe)` : "";
  d.innerHTML = `<div class="dh">${avatar(u)}<div><b>@${esc(u.username)}</b><span class="mu">Joined ${day(u.created_at)} · ${flag(u.country)} · seen ${ago(u.last_seen)}</span></div><button class="x" id="close" aria-label="Close">✕</button></div>
    <div class="cols2"><div class="f"><label>Name</label><input class="in" data-e="name" value="${esc(E.name)}" maxlength="40" ${can ? "" : "disabled"}></div>
    <div class="f"><label>Username</label><input class="in" data-e="username" value="${esc(E.username)}" maxlength="20" ${can ? "" : "disabled"}></div></div>
    <div class="f"><label>E-mail ${u.verified ? `<span style="color:var(--gr)">✓ verified</span>` : `<span style="color:var(--am)">not verified</span>`}</label><input class="in" data-e="email" type="email" value="${esc(E.email)}" ${can ? "" : "disabled"}></div>
    <div class="f"><label>Role${isAdmin() && !self ? "" : " · only an admin can change it"}</label><div class="seg fill">${Object.entries(ROLE).map(([k, l]) => `<button type="button" data-role="${k}" class="${E.role === k ? "on" : ""}" ${isAdmin() && !self ? "" : "disabled"}>${l}</button>`).join("")}</div></div>
    <div class="opt box"><div>${stripe ? `💳 ${stripe}<small>${u.period_end ? "Until " + day(u.period_end) : ""}</small>` : gift ? `🎁 Plus gift<small>Until ${day(u.plus_until)}</small>` : `No Plus<small>${u.country === "IR" ? "Free full access from Iran" : "Free plan"}</small>`}</div>
      ${can ? `<span class="acts">${gift ? `<button class="b sm" data-act="ungift">Remove</button>` : ""}<button class="b sm" data-act="gift">${gift ? "Change" : "Gift Plus"}</button></span>` : ""}</div>
    <div class="opt box"><div>Account active<small>Off = signed out everywhere and can't sign in</small></div><button class="sw ${E.disabled ? "" : "on"}" id="active" ${can && !self ? "" : "disabled"}></button></div>
    ${can ? `<div class="acts"><button class="b" data-act="reset">📧 Send reset link</button>${u.verified ? "" : `<button class="b" data-act="verify">✓ Mark verified</button>`}<button class="b" data-act="progress">↻ Reset progress</button></div>` : `<p class="mu">Only an admin can change team accounts.</p>`}
    <div class="foot">${can ? `<button class="b pr" style="flex:1" id="save">Save changes</button>` : ""}${isAdmin() && !self ? `<button class="b d" id="del">🗑 Delete</button>` : ""}</div>`;
}
function select(id) {
  U.sel = id;
  const u = U.rows.find(x => x.id === id);
  U.edit = u ? { name: u.name || "", username: u.username, email: u.email, role: u.role, disabled: !!u.disabled } : null;
  document.querySelectorAll(".row[data-u]").forEach(r => r.classList.toggle("sel", Number(r.dataset.u) === id));
  drawer();
}
async function saveUser() {
  const u = U.rows.find(x => x.id === U.sel), E = U.edit, patch = {};
  if (E.name !== (u.name || "")) patch.name = E.name;
  if (E.username !== u.username) patch.username = E.username;
  if (E.email !== u.email) patch.email = E.email;
  if (E.role !== u.role) patch.role = E.role;
  if (E.disabled !== !!u.disabled) patch.disabled = E.disabled;
  if (!Object.keys(patch).length) return toast("Nothing changed");
  if (patch.disabled && !await Shell.confirm({ title: `Disable @${u.username}?`, text: "They are signed out everywhere and can't sign in until you turn the account on again.", ok: "Disable", danger: true })) return;
  await api("PATCH", `/admin/users/${u.id}`, patch);
  toast("Saved"); STATS = null; await show(); select(u.id);
}

/* ---- customers ---- */

/* ---- content & access: free or Plus per lesson, by course ---- */
let LESSONS = null, A = null, COURSES = [];
async function lessons() {
  if (LESSONS) return LESSONS;
  const idx = await (await fetch("/content/index.json")).json();
  COURSES = idx.courses;
  const all = idx.courses.flatMap(c => c.lessons.map(dir => ({ dir, course: c.code })));
  LESSONS = await Promise.all(all.map(async x => { const L = await (await fetch(`/content/lessons/${x.dir}/lesson.json`)).json(); return { ...x, title: L.title, level: L.level }; }));
  return LESSONS;
}
/* ---- content: the drive ---- */
V.content = async () => { await Drive.load(); return Drive.html(); };

/* ---- AI: which models the studio may use ---- */
const AI_ICON = { workers: "🏠", openai: "🟢", gemini: "🔷", anthropic: "🟠", compatible: "🔌" };
let AIS = null, AI_EDIT = null;
V.ai = async () => {
  if (!isAdmin()) return `<div class="top"><h1>AI</h1></div><div class="card empty">Only an admin manages the AI.</div>`;
  AIS = await api("GET", "/admin/ai");
  const { providers: P, setting: st, kinds: K, tasks: T } = AIS;
  const opt = (v, empty) => `${empty ? `<option value="0" ${+v ? "" : "selected"}>${empty}</option>` : ""}${P.filter(x => x.enabled).map(x => `<option value="${x.id}" ${+v === x.id ? "selected" : ""}>${AI_ICON[x.kind]} ${esc(x.name)} · ${esc(x.model)}</option>`).join("")}`;
  const keyText = x => K[x.kind].key ? (x.hasKey ? `🔑 ••••${esc(x.keyEnd)}` : `<span style="color:var(--rd)">🔑 no key</span>`)
    : x.kind === "workers" ? (AIS.builtin ? "no key needed" : `<span style="color:var(--rd)">not available on this server</span>`) : x.hasKey ? `🔑 ••••${esc(x.keyEnd)}` : "no key";
  return `<div class="top"><h1>AI</h1><button class="b pr" id="aiAdd">＋ Add an AI</button></div>
  <p class="mu">The studio's AI writes, translates, rewrites and checks lessons. <b>LAPP AI</b> is our own: an open-source model on our Cloudflare account — no key and no outside AI company. Add GPT, Gemini, Claude or a model on your own server whenever you want, and pick which one does what.</p>
  <div class="split"><div class="card"><h3>🤖 AIs</h3><div class="list">
    ${P.map(x => `<div class="li" style="align-items:flex-start;${x.enabled ? "" : "opacity:.5"}"><span style="flex:1;min-width:0"><b>${AI_ICON[x.kind]} ${esc(x.name)}</b> <span class="mu">${esc(K[x.kind].name)}</span><br>
      <span class="mu" style="word-break:break-all">${esc(x.model)}${x.base_url ? " · " + esc(x.base_url) : ""}</span><br>
      <span class="mu">${keyText(x)} · ${x.uses} uses${x.used_at ? " · last " + ago(x.used_at) : ""}</span>
      <span class="mu" id="aiRes${x.id}" style="display:block"></span></span>
      <span class="acts" style="flex-wrap:wrap;justify-content:flex-end"><button class="b sm" data-ai-test="${x.id}">Test</button><button class="b sm" data-ai-edit="${x.id}">Edit</button>
      <button class="sw ${x.enabled ? "on" : ""}" data-ai-on="${x.id}" title="On / off"></button>${x.id !== 1 ? `<button class="b sm d" data-ai-del="${x.id}">✕</button>` : ""}</span></div>`).join("")}
  </div></div>
  <div class="card"><h3>⚙️ Which AI does what</h3><div class="list">
    <div class="li"><span><b>Default</b><br><span class="mu">used for everything that says “same as default”</span></span><l-select id="aiDef" style="width:260px" aria-label="Default AI">${opt(st.default)}</l-select></div>
    ${Object.entries(T).map(([k, label]) => `<div class="li"><span>${esc(label)}</span><l-select data-ai-task="${k}" style="width:260px" aria-label="${esc(label)}">${opt(st.tasks[k] || 0, "Same as default")}</l-select></div>`).join("")}
  </div><p class="mu" style="margin-top:10px">If a chosen AI is switched off or removed, LAPP AI takes over.</p></div></div>`;
};
const AI_HINT = {
  workers: "Runs on our Cloudflare account. Any model from the Workers AI catalogue (@cf/…).",
  openai: "Key from platform.openai.com → API keys.",
  gemini: "Key from aistudio.google.com → Get API key.",
  anthropic: "Key from console.anthropic.com → API keys.",
  compatible: "Any server with the OpenAI chat API: your own (Ollama, vLLM, LM Studio), DeepSeek, Mistral, Groq, OpenRouter… Ollama's address is http://<server>:11434/v1."
};
function aiDialog(x) {
  AI_EDIT = x || null;
  const KINDS = AIS.kinds, f = $("#aiForm");
  f.reset();
  $("#aiTitle").textContent = x ? `Edit ${x.name}` : "Add an AI";
  $("#aiOk").textContent = x ? "Save" : "Add";
  const kind = $("#aiKind");
  kind.options = Object.entries(KINDS).filter(([k]) => x || k !== "workers").map(([k, v]) => ({ value: k, label: v.name, icon: AI_ICON[k] }));
  kind.value = x ? x.kind : "openai";
  const fill = () => {
    const k = kind.value, v = KINDS[k];
    $("#aiModels").innerHTML = v.models.map(m => `<option value="${esc(m)}">`).join("");
    $("#aiUrlF").hidden = k === "workers";
    $("#aiUrl").placeholder = v.url || "https://…/v1";
    $("#aiKeyF").hidden = k === "workers";
    $("#aiKeyL").textContent = v.key ? "API key" : "API key (if the server needs one)";
    $("#aiKey").placeholder = x && x.hasKey ? `•••• ${x.keyEnd} — leave empty to keep it` : k === "gemini" ? "AIza…" : k === "anthropic" ? "sk-ant-…" : "sk-…";
    $("#aiHint").textContent = AI_HINT[k];
    if (!x) $("#aiModel").value = v.models[0];
  };
  kind.onchange = fill;
  fill();
  if (x) { f.elements.name.value = x.name; $("#aiModel").value = x.model; $("#aiUrl").value = x.base_url; }
  $("#aiDlg").showModal();
}
document.addEventListener("click", async e => {
  try {
    if (e.target.closest("#aiAdd")) return aiDialog();
    const ed = e.target.closest("[data-ai-edit]"); if (ed) return aiDialog(AIS.providers.find(x => x.id === +ed.dataset.aiEdit));
    const on = e.target.closest("[data-ai-on]"); if (on) { await api("PATCH", `/admin/ai/${on.dataset.aiOn}`, { enabled: !on.classList.contains("on") }); toast("Saved"); return show(); }
    const del = e.target.closest("[data-ai-del]");
    if (del) { const x = AIS.providers.find(p => p.id === +del.dataset.aiDel); if (!await Shell.confirm({ title: `Remove ${x ? x.name : "this AI"}?`, text: "Its key is deleted. Tasks that used it go back to the default AI.", ok: "Remove", danger: true })) return; await api("DELETE", `/admin/ai/${del.dataset.aiDel}`); toast("Removed"); return show(); }
    const ts = e.target.closest("[data-ai-test]");
    if (ts) {
      const out = $(`#aiRes${ts.dataset.aiTest}`); out.textContent = "Testing…"; ts.disabled = true;
      const r = await api("POST", `/admin/ai/${ts.dataset.aiTest}/test`);
      ts.disabled = false;
      out.innerHTML = r.ok ? `<span style="color:var(--gr)">✓ works · ${(r.ms / 1000).toFixed(1)} s</span> · ${esc(Object.values(r.answer || {}).join(" · ").slice(0, 160))}` : `<span style="color:var(--rd)">✗ ${esc(r.error)}</span>`;
    }
  } catch (x) { toast(x.message); }
});
document.addEventListener("change", async e => {
  if (!e.target.matches || !e.target.matches("#aiDef, [data-ai-task]")) return;
  const tasks = Object.fromEntries([...document.querySelectorAll("[data-ai-task]")].map(s => [s.dataset.aiTask, +s.value]));
  try { await api("PUT", "/admin/ai/setting", { default: +$("#aiDef").value, tasks }); toast("Saved"); } catch (x) { toast(x.message); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "aiForm") return;
  if (e.submitter && e.submitter.value === "cancel") return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.target));
  try {
    if (AI_EDIT) await api("PATCH", `/admin/ai/${AI_EDIT.id}`, { name: v.name, model: v.model, ...(AI_EDIT.kind !== "workers" ? { base_url: v.base_url } : {}), api_key: v.api_key });
    else await api("POST", "/admin/ai", { kind: $("#aiKind").value, name: v.name, model: v.model, base_url: v.base_url, api_key: v.api_key });
    $("#aiDlg").close(); toast("Saved"); show();
  } catch (x) { toast(x.message); }
});

/* ---- schools (organizations) ---- */
document.addEventListener("click", async e => {
  try {
    if (e.target.closest("#addSchool")) return $("#orgDlg").showModal();
    const tg = e.target.closest("[data-org-toggle]");
    if (tg) { await api("PATCH", `/admin/orgs/${tg.dataset.orgToggle}`, { disabled: tg.dataset.d === "1" }); toast("Saved"); return show(); }
    const del = e.target.closest("[data-org-del]");
    if (del) {
      if (!await Shell.confirm({ title: `Delete the school ${del.dataset.name}?`, text: "Its classes, lessons, homework and payments are removed. Its people keep their LAPP accounts.", ok: "Delete the school", danger: true, type: del.dataset.name })) return;
      await api("DELETE", `/admin/orgs/${del.dataset.orgDel}`); toast("School deleted — its people keep their accounts"); return show();
    }
  } catch (x) { toast(x.message); }
});

V.access = async () => {
  const [{ access }, ls] = await Promise.all([api("GET", "/admin/settings"), lessons()]);
  A = access;
  const sw = (on, attrs) => `<button class="sw ${on ? "on" : ""}" ${attrs} ${isAdmin() ? "" : "disabled"}></button>`;
  return `<div class="top"><h1>Content & access</h1>${isAdmin() ? "" : `<span class="mu">Only an admin can change these.</span>`}</div>
  <div class="split"><div class="card"><h3>📚 Free or Plus — per lesson</h3><p class="mu" style="margin:-4px 0 6px">On = free for everyone. Off = Plus only (the lesson shows a lock and its audio is refused).</p>
   ${COURSES.map(c => `<div class="grp">${esc(c.name)}</div><div class="list">${ls.filter(L => L.course === c.code).map(L => `<div class="li"><span><b>${esc(L.title)}</b> <span class="mu">${esc(L.level)}</span></span>${sw(!A.locked.includes(L.dir), `data-lock="${esc(L.dir)}"`)}</div>`).join("") || `<div class="r mu">No lessons yet — make them in the studio</div>`}</div>`).join("")}</div>
   <div class="card"><h3>⚙️ Rules</h3><div class="list">
    <div class="li"><span><b>Full access, free, from Iran</b><br><span class="mu">By connection country (Cloudflare); on a VPN, the VPN's country counts.</span></span>${sw(A.iranFree, `data-k="iranFree"`)}</div>
    <div class="li"><span><b>Free trial</b><br><span class="mu">Days before the first payment, once per person.</span></span><input class="in" type="number" min="0" max="30" value="${A.trialDays}" id="trialDays" style="width:76px" ${isAdmin() ? "" : "disabled"}></div>
   </div></div></div>`;
};
async function saveAccess(patch) {
  try { const r = await api("PUT", "/admin/settings", { access: { ...A, ...patch } }); A = r.access; toast("Saved"); show(); } catch (x) { toast(x.message); }
}

/* ================= start: the page router (ui/shell.js) ================= */
function show() { Shell.refresh(); }
// a new lesson in the LAPP library: the shared form, then the studio opens in a window
const newLesson = () => K.newLesson({ create: v => api("POST", "/studio/lessons", v), after: l => { Drive.reload().catch(() => {}); K.openStudio(l.id); } });
const NAV = [
  { route: "dash", label: "Dashboard", icon: "📊", group: "Manage", key: "d" },
  { route: "users", label: "Users", icon: "👥", group: "Manage", badge: "nU", key: "u" },
  { route: "content", label: "Lesson library", icon: "📚", group: "Manage", key: "c" },
  { route: "access", label: "Built-in lessons & access", icon: "📚", hidden: true },
  { route: "ai", label: "AI", icon: "🤖", group: "System", key: "i" }
];
addEventListener("panel:lang", () => show());

let qT;
document.addEventListener("input", e => {
  if (e.target.id === "q") { clearTimeout(qT); qT = setTimeout(async () => { U.q = e.target.value; U.page = 0; Shell.refresh("users"); setTimeout(() => { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 350); }, 300); }
  if (e.target.dataset.e) U.edit[e.target.dataset.e] = e.target.value.trim();
  if (e.target.id === "delName") $("#delGo").disabled = e.target.value.trim().toLowerCase() !== (U.rows.find(x => x.id === U.sel) || {}).username;
});
document.addEventListener("change", e => { if (e.target.id === "trialDays") saveAccess({ trialDays: Number(e.target.value) }); });

document.addEventListener("click", async e => {
  const t = e.target;
  const f = t.closest("[data-f]"); if (f) { U.filter = f.dataset.f; U.page = 0; U.sel = null; return show(); }
  const pg = t.closest("[data-pg]"); if (pg) { U.page += Number(pg.dataset.pg); return show(); }
  const row = t.closest(".row[data-u]"); if (row) return select(Number(row.dataset.u));
  const org = t.closest(".row[data-org]"); if (org && !t.closest("a")) return schoolMenu(org);
  if (t.closest("#close")) return select(null);
  const rl = t.closest("[data-role]"); if (rl && !rl.disabled && rl.closest("#drawer")) { U.edit.role = rl.dataset.role; return drawer(); }
  if (t.closest("#active") && !t.closest("#active").disabled) { U.edit.disabled = !U.edit.disabled; return drawer(); }
  const lk = t.closest("[data-lock]"); if (lk && !lk.disabled) { const d = lk.dataset.lock; return saveAccess({ locked: A.locked.includes(d) ? A.locked.filter(x => x !== d) : [...A.locked, d] }); }
  const k = t.closest(".sw[data-k]"); if (k && !k.disabled) return saveAccess({ [k.dataset.k]: !A[k.dataset.k] });
  if (t.closest("#export")) return exportCsv();
  if (t.closest("#add")) return openAdd();
  try {
    if (t.closest("#save")) return await saveUser();
    if (t.closest("#del")) return openDel();
    const a = t.closest("[data-act]"); if (!a) return;
    const u = U.rows.find(x => x.id === U.sel); if (!u) return;
    if (a.dataset.act === "gift") { const d = await Shell.ask({ title: `Give @${u.username} Plus`, label: "For how many days?", value: "30", type: "number", ok: "Give Plus", validate: v => +v > 0 && +v <= 3650 ? "" : "Between 1 and 3650 days." }); if (!d) return; await api("PATCH", `/admin/users/${u.id}`, { plusDays: Number(d) }); toast("Plus given"); }
    if (a.dataset.act === "ungift") { await api("PATCH", `/admin/users/${u.id}`, { plusDays: 0 }); toast("Gift removed"); }
    if (a.dataset.act === "verify") { await api("PATCH", `/admin/users/${u.id}`, { verified: true }); toast("Marked verified"); }
    if (a.dataset.act === "reset") { const r = await api("POST", `/admin/users/${u.id}/reset`); toast(r.sent ? "Reset link sent" : "No mail service — the link is in the Worker log"); return; }
    if (a.dataset.act === "progress") { if (!await Shell.confirm({ title: `Clear the progress of @${u.username}?`, text: "Lessons done, streaks and scores are removed. This can't be undone.", ok: "Clear progress", danger: true })) return; await api("DELETE", `/admin/users/${u.id}/progress`); toast("Progress cleared"); return; }
    STATS = null; await show(); select(u.id);
  } catch (x) { toast(x.message); }
});

async function schoolMenu(el) {
  const { orgs } = await api("GET", "/admin/orgs"), o = orgs.find(x => x.id === +el.dataset.org); if (!o) return;
  Shell.menu(el, [{ head: o.name },
    { icon: "↗", label: "Open its panel", run: () => window.open(`/s/${o.slug}`, "_blank") },
    { icon: o.disabled ? "▶" : "⏸", label: o.disabled ? "Turn the school on" : "Turn the school off", run: async () => { await api("PATCH", `/admin/orgs/${o.id}`, { disabled: !o.disabled }); toast("Saved"); show(); } },
    "-", { icon: "🗑", label: "Delete the school…", danger: true, run: async () => {
      if (!await Shell.confirm({ title: `Delete the school ${o.slug}?`, text: "Its classes, lessons, homework and payments are removed. Its people keep their LAPP accounts.", ok: "Delete the school", danger: true, type: o.slug })) return;
      await api("DELETE", `/admin/orgs/${o.id}`); toast("School deleted"); STATS = null; show(); } }], { search: false });
}

/* ---- add user ---- */
let addRole = "user";
function openAdd() {
  addRole = "user";
  const paint = () => $("#addRole").innerHTML = Object.entries(ROLE).map(([k, l]) => `<button type="button" data-ar="${k}" class="${addRole === k ? "on" : ""}" ${k === "user" || isAdmin() ? "" : "disabled"}>${l}</button>`).join("");
  paint();
  $("#addRole").onclick = e => { const b = e.target.closest("[data-ar]"); if (b && !b.disabled) { addRole = b.dataset.ar; paint(); } };
  $("#addInvite").onclick = () => $("#addInvite").classList.toggle("on");
  $("#addForm").reset(); $("#addInvite").classList.add("on");
  $("#addDlg").showModal();
}
$("#addDlg").addEventListener("close", async () => {
  if ($("#addDlg").returnValue !== "ok") return;
  const f = Object.fromEntries(new FormData($("#addForm")));
  try {
    const r = await api("POST", "/admin/users", { ...f, role: addRole, invite: $("#addInvite").classList.contains("on") });
    toast(r.sent ? "User added · invitation sent" : "User added");
    STATS = null; U.q = ""; U.filter = "all"; U.page = 0; Shell.open("users"); Shell.refresh("users"); setTimeout(() => select(r.id), 400);
  } catch (x) { toast(x.message); }
});

$("#orgDlg").addEventListener("close", async () => {
  if ($("#orgDlg").returnValue !== "ok") return;
  const f = Object.fromEntries(new FormData($("#orgForm")));
  try { const r = await api("POST", "/admin/orgs", f); toast(r.admin ? (r.admin.sent ? "School created · invitation sent" : "School created") : "School created"); $("#orgForm").reset(); Shell.open("schools"); Shell.refresh("schools"); } catch (x) { toast(x.message); }
});

/* ---- delete user: type the username to confirm ---- */
async function openDel() {
  const u = U.rows.find(x => x.id === U.sel);
  if (!await K.confirm({ title: "Delete account?", text: `@${u.username} (${u.email}) and all their progress are removed for good.`, ok: "Delete for good", danger: true, type: u.username })) return;
  try { await api("DELETE", `/admin/users/${U.sel}`); toast("Account deleted"); U.sel = null; STATS = null; await show(); } catch (x) { toast(x.message, { kind: "err" }); }
}

/* ---- export the current list ---- */
async function exportCsv() {
  const rows = [], q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  for (let page = 0; page < 200; page++) {
    const r = await api("GET", `/admin/users?q=${encodeURIComponent(U.q)}&filter=${U.filter}&page=${page}`);
    rows.push(...r.users); if (!r.more) break;
  }
  const csv = ["id,username,name,email,role,verified,disabled,country,plan,joined,last_seen", ...rows.map(u => [u.id, u.username, u.name, u.email, u.role, u.verified, u.disabled, u.country, u.sub_status || (u.plus_until > Date.now() ? "gift" : ""), new Date(u.created_at).toISOString(), u.last_seen ? new Date(u.last_seen).toISOString() : ""].map(q).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `lapp-users-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

(async () => {
  const m = await api("GET", "/me");
  if (!m.user) { location.href = "/?login=1&next=/admin"; return; }
  ME = m.user;
  Drive.setup({
    api: (p, m = "GET", b) => api(m, "/studio" + p, b), lapp: true,
    refresh: () => Shell.refresh("content"),
    extraRoot: `<div class="dv-acts"><button class="b sm" onclick="Shell.open('access')">📚 Built-in lessons · Iran · free trial</button></div>`
  });
  Shell.init({
    main: $("#view"), name: "LAPP Admin", home: "dash", nav: NAV,
    render: async r => { const v = r.split("/")[0]; return await (V[v] || V.dash)(); },
    after: r => { if (r === "users") drawer(); },
    onShow: r => { if (r !== "users" && U.sel) { U.sel = null; drawer(); } },
    commands: () => [
      { icon: "＋", label: "Add a user", run: () => { Shell.open("users"); openAdd(); } },
      { icon: "🎬", label: "New lesson", run: newLesson },
      ...(isAdmin() ? [{ icon: "🏫", label: "New school", run: () => $("#orgDlg").showModal() }, { icon: "🤖", label: "Add an AI", run: () => { Shell.open("ai"); setTimeout(() => $("#aiAdd")?.click(), 400); } }] : []),
      { icon: "⬇", label: "Export the user list", run: exportCsv }]
  });
  stats().catch(() => {});
})();
</script>
