<!doctype html>
<html data-desk lang="en"><head><!--LAPP:HEAD-->
<title>Customer Center · LAPP</title>
<style>
/* Customer Center: everything about the spaces outside ours. Only our own team has it; it is not in the store.
   Before a space approves, we see only its name and ID. Rules look at behaviour, never at anyone's content. */
body{background:var(--bg);color:var(--tx);font:13.5px/1.5 Inter,Vazirmatn,system-ui,sans-serif;display:grid;grid-template-columns:200px minmax(0,1fr);height:100vh;overflow:hidden}
#nav{border-inline-end:1px solid var(--ln);background:var(--p1);padding:12px 8px;overflow:auto}
#nav h6{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu2);margin:12px 10px 6px}#nav h6:first-child{margin-top:2px}
#nav .ct{margin-inline-start:auto;font-size:11px;color:var(--mu2)}#nav .bdg{margin-inline-start:auto;background:var(--rd);color:#fff;border-radius:99px;font-size:10.5px;font-weight:800;padding:0 7px}
#main{overflow:auto;display:flex;flex-direction:column;min-width:0}
.hd{padding:14px 18px 10px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hd h2{font-size:17px;margin-inline-end:auto}
.wrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.ask{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:12px;align-items:end;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--p2)}
.ask .f{display:flex;flex-direction:column;gap:5px;min-width:0}.ask label{font-size:11.5px;color:var(--mu2);font-weight:600}
.hit{height:38px;display:flex;align-items:center;gap:8px;font-weight:600}.hit.no{color:var(--mu2)}
.via{display:flex;gap:4px;height:38px;align-items:center}
.chip{border:1px solid var(--ln);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--mu);background:none;cursor:pointer}.chip.on{background:var(--p4);color:var(--tx);border-color:transparent}
.item{display:grid;grid-template-columns:34px minmax(0,1fr) 100px auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--ln);border-radius:12px}
.item.cust{grid-template-columns:34px minmax(0,1fr) 90px 100px auto}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:#6366F1}.av.org{border-radius:10px;background:#1D4ED8}
.item .t{display:flex;flex-direction:column;min-width:0}.item b small{color:var(--mu2);font-weight:500;margin-inline-start:6px}.item .t>small{color:var(--mu2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--gr))}
.when{font-size:12px;color:var(--mu2);white-space:nowrap;text-align:end}
.ih{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln);background:linear-gradient(90deg,color-mix(in srgb,var(--gr) 10%,transparent),transparent)}
.ih .t{display:flex;flex-direction:column}.ih p{font-size:12px;color:var(--mu)}.ih .sp{flex:1}
.timer{font-size:12px;font-weight:700;color:var(--gr);background:color-mix(in srgb,var(--gr) 14%,transparent);border-radius:99px;padding:4px 10px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--ln)}.tabs button{padding:10px;font-size:12.5px;font-weight:600;color:var(--mu2);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--tx);border-color:var(--gr)}
.log{display:grid;grid-template-columns:120px 90px minmax(0,1fr) 150px;gap:10px;align-items:baseline;padding:8px 18px;border-bottom:1px solid var(--ln);font-size:12.5px}
.log time{color:var(--mu2);font-size:11.5px;font-variant-numeric:tabular-nums}.lv{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;text-align:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:16px 18px}
.card{border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--p2);display:flex;flex-direction:column;gap:6px}.card small{color:var(--mu2);font-size:12px}.card .big{font-size:20px;font-weight:700}
.flag{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--ln);border-radius:12px}
.flag .t{display:flex;flex-direction:column;min-width:0}.flag small{color:var(--mu2);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) 190px auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);border-radius:12px}
.rule .t{display:flex;flex-direction:column}.rule small{color:var(--mu2);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}.rt{width:100%;border-collapse:collapse;min-width:1040px}.rt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu2);text-align:start;padding:9px 10px;border-bottom:1px solid var(--ln);font-weight:700}
.rt td{padding:6px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}.rt tr:last-child td{border-bottom:0}.rt .in{padding:6px 8px;font-size:12.5px}.rt td:nth-child(2) .in{min-width:240px}.rt select.in{min-width:150px}.rt input[type=number]{width:80px}.rt .n{color:var(--mu2);font-variant-numeric:tabular-nums;text-align:center}
.nr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px dashed var(--p4);border-radius:12px;color:var(--mu)}.nr input{width:80px}
.none{display:grid;place-items:center;height:160px;color:var(--mu2)}
@media (max-width:900px){body{grid-template-columns:minmax(0,1fr)}#nav{display:none}.ask{grid-template-columns:1fr 1fr}.item{grid-template-columns:34px minmax(0,1fr) auto}.item .when{display:none}.log{grid-template-columns:90px 70px minmax(0,1fr)}.log .src{display:none}.rule{grid-template-columns:auto minmax(0,1fr)}}
</style></head><body>
<nav id="nav" class="k-nav" aria-label="Customer Center"></nav>
<main id="main"></main>
<script>
"use strict";
const { $, esc: E, I } = K;
const api = (m, p, b) => K.api(m, "/care" + p, b);
const S = { part: "customers", cust: [], ckind: "user", cq: "", cmore: false, ctotal: 0, cpage: 0, reqs: [], flags: [], rules: [], open: null, inside: null, tab: "log", find: null, via: ["app", "email"], fstat: "open", me: null };
const SIG = { wrongpw: "Wrong passwords", countries: "Countries signed in from", signins: "Sign-ins", devices: "Different devices" };
const ACT = { show: "Show to us", signout: "Sign out everywhere", suspend: "Suspend" };
const COL = { waiting: "var(--am)", approved: "var(--gr)", declined: "var(--rd)", ended: "var(--mu2)", cancelled: "var(--mu2)" };
const left = t => { const m = Math.max(0, Math.round((t - Date.now()) / 6e4)); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min left` : `${m} min left`; };
const when = t => t ? new Date(t).toLocaleString(K.loc(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

async function load(part) {
  if (part) S.part = part;
  const [r, f, ru, me] = await Promise.all([api("GET", "/requests"), api("GET", "/flags?status=" + S.fstat), api("GET", "/rules"), S.me ? null : K.api("GET", "/me"), loadCust()]);
  S.reqs = r.requests; S.flags = f.flags; S.rules = ru.rules; if (me) S.me = me.user;
  draw();
}
function draw() {
  const open = S.reqs.filter(r => r.status === "approved").length, fl = S.flags.length;
  $("#nav").innerHTML = `<h6>Customers</h6>` + [["customers", "Customers", "users"]].map(nav).join("") + `<h6>Support</h6>` + [["requests", "Requests", "mail"], ["access", "Open access", "lock", open]].map(nav).join("")
    + `<h6>Safety</h6>` + [["flags", "Flags", "alert", fl, 1], ["rules", "Rules", "settings"]].map(nav).join("");
  ({ customers, requests, access, flags, rules })[S.part]();
}
const nav = ([k, l, ic, n, red]) => `<button class="${S.part === k ? "on" : ""}" data-part="${k}">${I(ic, 16)}<span>${E(l)}</span>${n ? `<span class="${red && S.fstat === "open" ? "bdg" : "ct"}">${n}</span>` : ""}</button>`;
const face = w => `<span class="av ${w.kind === "org" ? "org" : ""}">${E((w.name || "?").charAt(0).toUpperCase())}</span>`;

/* ---------- customers: every account and organisation outside our team — who they are, never what is inside ---------- */
async function loadCust() { let r = await api("GET", `/customers?kind=${S.ckind}&q=${encodeURIComponent(S.cq)}&page=${S.cpage}`);
  if (!S.ckSet && S.ckind === "user" && !r.total) { S.ckind = "org"; r = await api("GET", `/customers?kind=org&page=0`); }   // no people yet: show the organisations
  S.ckSet = true; S.cust = r.customers; S.cmore = r.more; S.ctotal = r.total; }
function customers() {
  const org = S.ckind === "org", admin = S.me && S.me.role === "admin";
  $("#main").innerHTML = `<div class="hd"><h2>Customers</h2>${[["user", "People"], ["org", "Organisations"]].map(([k, l]) => `<button class="chip ${S.ckind === k ? "on" : ""}" data-ck="${k}">${l}</button>`).join("")}${org && admin ? `<button class="b pr" data-neworg>${I("plus", 15)} New organisation</button>` : ""}</div>
    <div class="wrap"><label class="srch" style="display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:0 11px;color:var(--mu2)">${I("search", 15)}<input id="cq" class="in" style="border:0;background:none;padding:9px 0" placeholder="${org ? "Name, address or ID" : "Name, username, e-mail or ID"}" value="${E(S.cq)}" autocomplete="off"></label>
    ${S.cust.map(c => `<div class="item cust">${face({ kind: c.kind, name: c.name || c.username })}<span class="t"><b>${E(c.name || "@" + c.username)}<small class="mono">${E(c.pub)}</small></b><small>${org ? `/s/${E(c.slug)} · ${c.members} ${c.members === 1 ? "member" : "members"}${c.admin_email ? " · " + E(c.admin_email) : ""}` : `@${E(c.username)}${c.email ? " · " + E(c.email) : ""}`}</small></span>
      <span class="st" style="--c:${c.disabled ? "var(--rd)" : "var(--gr)"}">${c.disabled ? "Suspended" : "Active"}</span><span class="when">${E(K.date(c.created_at))}</span>
      <span class="acts"><button class="b" data-ask="${E(c.pub)}">Request access</button>${admin ? `<button class="b ${c.disabled ? "" : "d"}" data-cs="${c.kind}:${c.id}:${c.disabled ? 0 : 1}">${c.disabled ? "Lift" : "Suspend"}</button>` : ""}</span></div>`).join("") || `<div class="none">${I("users", 30)}</div>`}
    <div style="display:flex;align-items:center;gap:8px;color:var(--mu2);font-size:12px"><span>${S.ctotal} ${org ? "organisations" : "people"}</span><span style="flex:1"></span>${S.cpage ? `<button class="b" data-cpg="-1">‹</button>` : ""}${S.cmore ? `<button class="b" data-cpg="1">›</button>` : ""}</div></div>`;
  let t; $("#cq").oninput = e => { clearTimeout(t); t = setTimeout(async () => { S.cq = e.target.value; S.cpage = 0; await loadCust(); customers(); const i = $("#cq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
}
async function newOrg() {
  const ok = await K.form("New organisation", [{ name: "name", label: "Name", required: true }, { name: "slug", label: "Address · /s/…", required: true, ph: "berlin" }, { name: "adminEmail", label: "Its admin's e-mail", type: "email" }, { name: "adminName", label: "Their name" }],
    async v => { await K.api("POST", "/admin/orgs", { ...v, slug: String(v.slug || "").toLowerCase() }); }, "Create");
  if (ok) { K.toast("Organisation created", { kind: "ok" }); await loadCust(); customers(); }
}

/* ---------- requests: ask a space for access, by its ID ---------- */
function requests() {
  const f = S.find;
  $("#main").innerHTML = `<div class="hd"><h2>Requests</h2></div><div class="wrap">
    <form class="ask" id="ask">
      <div class="f"><label for="pid">ID</label><input class="in mono" id="pid" maxlength="12" autocomplete="off" value="${E(f ? f.q : "")}"></div>
      <div class="f"><label>Name</label><div class="hit ${f && f.who ? "" : "no"}">${f && f.who ? face(f.who) + E(f.who.name) : f && f.err ? E(f.err) : "—"}</div></div>
      <div class="f"><label for="why">Reason</label><input class="in" id="why" maxlength="200" autocomplete="off"></div>
      <div class="f"><label>Ask them by</label><div class="via">${[["app", "In the app"], ["email", "E-mail"]].map(([k, l]) => `<button type="button" class="chip ${S.via.includes(k) ? "on" : ""}" data-via="${k}">${l}</button>`).join("")}</div></div>
      <button class="b pr" ${f && f.who ? "" : "disabled"}>Send</button></form>
    ${S.reqs.map(r => `<div class="item">${face(r.who || {})}<span class="t"><b>${E(r.who ? r.who.name : "—")}<small class="mono">${E(r.who ? r.who.pub : "")}</small></b><small>${E(r.reason || "—")} · ${E(r.by)}</small></span>
      <span class="st" style="--c:${COL[r.status]}">${E(r.status[0].toUpperCase() + r.status.slice(1))}</span><span class="when">${r.status === "approved" ? left(r.expires) : when(r.at)}</span>
      ${r.status === "approved" ? `<button class="b pr" data-open="${r.id}">Open</button>` : r.status === "waiting" ? `<button class="b" data-cancel="${r.id}">Cancel</button>` : `<span></span>`}</div>`).join("") || `<div class="none">${I("mail", 30)}</div>`}
  </div>`;
  const pid = $("#pid"); let t;
  pid.oninput = () => { clearTimeout(t); const v = pid.value.trim(); if (v.replace(/[^A-Za-z0-9]/g, "").length < 10) { if (S.find) { S.find = null; requests(); $("#pid").value = v; $("#pid").focus(); } return; }
    t = setTimeout(async () => { try { S.find = { q: v, who: (await api("GET", "/find?id=" + encodeURIComponent(v))).who }; } catch (x) { S.find = { q: v, err: x.message }; } const why = $("#why").value; requests(); $("#why").value = why; $("#pid").focus(); }, 250); };
  $("#ask").onsubmit = async e => { e.preventDefault(); if (!S.find || !S.find.who) return;
    try { const r = await api("POST", "/requests", { id: S.find.who.pub, reason: $("#why").value.trim(), via: S.via }); if (r.devToken) console.info("[dev] answer link", `/?care=${r.devToken}`); S.find = null; K.toast("Request sent", { kind: "ok" }); await load(); } catch (x) { K.toast(x.message, { kind: "err" }); } };
}

/* ---------- open access: inside an account that approved ---------- */
function access() {
  const L = S.reqs.filter(r => r.status === "approved");
  if (!S.open || !L.some(r => r.id === S.open)) S.open = L[0] ? L[0].id : null;
  if (!S.open) { $("#main").innerHTML = `<div class="hd"><h2>Open access</h2></div><div class="none">${I("lock", 30)}</div>`; return; }
  const r = L.find(x => x.id === S.open), d = S.inside && S.inside.id === r.id ? S.inside : null;
  $("#main").innerHTML = `<div class="ih">${face(r.who)}<span class="t"><b>${E(r.who.name)}</b><p><span class="mono">${E(r.who.pub)}</span> · ${E(r.reason || "")}</p></span><span class="sp"></span>
      ${L.length > 1 ? `<select class="in" id="pick" style="width:auto">${L.map(x => `<option value="${x.id}" ${x.id === r.id ? "selected" : ""}>${E(x.who.name)}</option>`).join("")}</select>` : ""}
      <span class="timer">${left(r.expires)}</span><button class="b" data-end="${r.id}">End access</button></div>
    <div class="tabs">${[["log", "Log"], ["account", "Account"]].map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div><div id="in"></div>`;
  $("#pick") && ($("#pick").onchange = e => { S.open = +e.target.value; S.inside = null; access(); });
  if (!d) { $("#in").innerHTML = `<div class="none">…</div>`; api("GET", "/open/" + r.id).then(x => { S.inside = { ...x, id: r.id }; access(); }).catch(x => { $("#in").innerHTML = `<div class="none">${E(x.message)}</div>`; }); return; }
  const KIND = { signin: ["Sign-in", "var(--cy)"], signout: ["Sign-out", "var(--mu)"], wrongpw: ["Wrong password", "var(--am)"], unlock: ["Unlock", "var(--cy)"], password: ["Password", "var(--vi)"], account: ["Account", "var(--vi)"], linked: ["Linked", "var(--cy)"], unlinked: ["Unlinked", "var(--mu)"], role: ["Role", "var(--vi)"], org: ["Organisation", "var(--vi)"], support: ["Support", "var(--gr)"], store: ["Apps", "var(--mu)"], suspended: ["Suspended", "var(--rd)"], lifted: ["Lifted", "var(--gr)"] };
  if (S.tab === "log") $("#in").innerHTML = d.log.map(l => { const [k, c] = KIND[l.kind] || [l.kind, "var(--mu)"]; return `<div class="log"><time>${E(when(l.at))}</time><span class="lv" style="--c:${c}">${E(k)}</span><span>${E([l.detail, l.device, l.country].filter(Boolean).join(" · "))}</span><span class="src" style="color:var(--mu2)">${E(r.who.kind === "org" ? l.who : "")}</span></div>`; }).join("") || `<div class="none">${I("history", 30)}</div>`;
  else { const a = d.account || {};
    $("#in").innerHTML = `<div class="cards">${r.who.kind === "org" ? `<div class="card"><small>Members</small><span class="big">${a.members || 0}</span></div>` : `
      <div class="card"><small>Devices signed in</small><span class="big">${(a.sessions || []).length}</span><small>${(a.sessions || []).slice(0, 4).map(s => E(s.device) + " · " + E(K.ago(s.at))).join("<br>")}</small><button class="b" data-out="${r.id}" style="align-self:start">Sign out everywhere</button></div>
      <div class="card"><small>E-mail</small><span class="big">${a.verified ? "Confirmed" : "Not confirmed"}</span></div>
      <div class="card"><small>Account</small><span class="big">${a.disabled ? "Suspended" : "Active"}</span><small>since ${E(K.date(a.created_at))} · seen ${E(K.ago(a.last_seen))}</small></div>`}</div>`; }
}

/* ---------- flags: who broke which rule (name and ID only) ---------- */
function flags() {
  $("#main").innerHTML = `<div class="hd"><h2>Flags</h2>${[["open", "Open"], ["closed", "Closed"]].map(([k, l]) => `<button class="chip ${S.fstat === k ? "on" : ""}" data-fst="${k}">${l}</button>`).join("")}</div><div class="wrap">
    ${S.flags.map(f => `<div class="flag"><span class="t"><b>${E(f.rule)}</b><small>${E(f.who ? f.who.name : "—")} · <span class="mono">${E(f.who ? f.who.pub : "")}</span> · ${E(f.detail)} · ${E(f.done)}</small></span><span class="when">${E(when(f.at))}</span>
      <span class="acts">${f.who && f.who.suspended ? `<button class="b" data-fl="${f.id}:lift">Lift</button>` : `<button class="b d" data-fl="${f.id}:suspend">Suspend</button>`}${S.fstat === "open" ? `<button class="b" data-fl="${f.id}:close">Close</button>` : ""}</span></div>`).join("") || `<div class="none">${I("check", 30)}</div>`}</div>`;
}

/* ---------- rules: one table — add, change or delete a rule in place ---------- */
const MINS = [[10, "10 minutes"], [60, "1 hour"], [360, "6 hours"], [1440, "1 day"], [10080, "1 week"]];
function rules() {
  const admin = S.me && S.me.role === "admin", dis = admin ? "" : "disabled";
  const sel = (key, id, val, list) => `<select class="in" data-rf="${id}:${key}" ${dis}>${list.map(([k, l]) => `<option value="${k}" ${String(val) === String(k) ? "selected" : ""}>${E(l)}</option>`).join("")}${list.some(([k]) => String(k) === String(val)) ? "" : `<option value="${E(val)}" selected>${E(val)}</option>`}</select>`;
  const row = r => `<tr data-rid="${r.id}"><td><button class="sw ${r.on ? "on" : ""}" data-ron="${r.id}" role="switch" aria-checked="${r.on}" aria-label="On" ${dis}></button></td>
    <td><input class="in" data-rf="${r.id}:name" value="${E(r.name)}" maxlength="80" ${dis}></td><td>${sel("signal", r.id, r.signal, Object.entries(SIG))}</td>
    <td><input class="in" type="number" min="1" data-rf="${r.id}:amount" value="${r.amount}" ${dis}></td><td>${sel("minutes", r.id, r.minutes, MINS)}</td>
    <td>${sel("action", r.id, r.action, Object.entries(ACT))}</td><td class="n">${r.week}</td><td>${admin ? `<button class="b" data-rdel="${r.id}" aria-label="Delete">${I("trash", 15)}</button>` : ""}</td></tr>`;
  $("#main").innerHTML = `<div class="hd"><h2>Rules</h2>${admin ? `<button class="b pr" data-radd>${I("plus", 15)} Add rule</button>` : ""}</div><div class="wrap"><div class="tw"><table class="rt">
    <thead><tr><th>On</th><th>Name</th><th>Watch</th><th>Reaches</th><th>Within</th><th>Then</th><th>This week</th><th></th></tr></thead>
    <tbody>${S.rules.map(row).join("") || `<tr><td colspan="8" class="none">${I("settings", 26)}</td></tr>`}</tbody></table></div></div>`;
}
const ruleSave = async (id, key, val) => { try { await api("PATCH", "/rules/" + id, { [key]: key === "amount" || key === "minutes" ? +val : val }); K.toast("Saved", { kind: "ok" }); const r = (await api("GET", "/rules")).rules; S.rules = r; } catch (x) { K.toast(x.message, { kind: "err" }); rules(); } };

/* ---------- wiring ---------- */
const run = async (f, msg) => { try { await f(); if (msg) K.toast(msg, { kind: "ok" }); await load(); } catch (x) { K.toast(x.message, { kind: "err" }); } };
document.addEventListener("click", async e => {
  const t = e.target, d = k => { const x = t.closest(`[data-${k}]`); return x && x.dataset[k]; };
  let v;
  if ((v = d("part"))) { S.part = v; return draw(); }
  if ((v = d("ck"))) { S.ckind = v; S.cpage = 0; S.cq = ""; await loadCust(); return customers(); }
  if ((v = d("cpg"))) { S.cpage = Math.max(0, S.cpage + +v); await loadCust(); return customers(); }
  if (t.closest("[data-neworg]")) return newOrg();
  if ((v = d("ask"))) { S.part = "requests"; S.find = { q: v, who: (await api("GET", "/find?id=" + v)).who }; return draw(); }
  if ((v = d("cs"))) { const [k, id, off] = v.split(":"); if (off === "1" && !await K.confirm({ title: k === "org" ? "Suspend this organisation?" : "Suspend this account?", ok: "Suspend", danger: true })) return; return run(() => api("PATCH", `/customers/${k}/${id}`, { disabled: off === "1" }), off === "1" ? "Suspended" : "Lifted"); }
  if ((v = d("via"))) { S.via = S.via.includes(v) ? S.via.filter(x => x !== v) : [...S.via, v]; t.closest("[data-via]").classList.toggle("on"); return; }
  if ((v = d("open"))) { S.open = +v; S.inside = null; S.part = "access"; return draw(); }
  if ((v = d("cancel"))) return run(() => api("DELETE", "/requests/" + v), "Cancelled");
  if ((v = d("end"))) { if (!await K.confirm({ title: "End access now?", ok: "End access" })) return; S.inside = null; return run(() => api("DELETE", "/requests/" + v), "Access ended"); }
  if ((v = d("tab"))) { S.tab = v; return access(); }
  if ((v = d("out"))) { if (!await K.confirm({ title: "Sign them out of every device?", ok: "Sign out", danger: true })) return; S.inside = null; return run(() => api("POST", `/open/${v}/signout`), "Signed out everywhere"); }
  if ((v = d("fst"))) { S.fstat = v; return load(); }
  if ((v = d("fl"))) { const [id, a] = v.split(":"); if (a === "suspend" && !await K.confirm({ title: "Suspend this account?", ok: "Suspend", danger: true })) return; return run(() => api("POST", "/flags/" + id, { do: a }), { suspend: "Suspended", lift: "Lifted", close: "Closed" }[a]); }
  if ((v = d("ron"))) { const r = S.rules.find(x => x.id === +v); return run(() => api("PATCH", "/rules/" + v, { on: !r.on })); }
  if (t.closest("[data-radd]")) return run(() => api("POST", "/rules", { name: "New rule", signal: "wrongpw", amount: 10, minutes: 10, action: "show" }), "Rule added");
  if ((v = d("rdel"))) { if (!await K.confirm({ title: "Delete this rule?", ok: "Delete", danger: true })) return; return run(() => api("DELETE", "/rules/" + v), "Deleted"); }
});
document.addEventListener("change", e => { const v = e.target.dataset && e.target.dataset.rf; if (!v) return; const [id, key] = v.split(":"); ruleSave(id, key, e.target.value); });
setInterval(() => { if (S.part === "access" && $(".timer")) access(); }, 60e3);
load().catch(x => { $("#main").innerHTML = `<div class="none">${E(x.message)}</div>`; });
</script>
</body></html>
