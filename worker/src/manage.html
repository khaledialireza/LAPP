<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAPP · Manage</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">

<style>
/* The work desktop: everyone who isn't only a learner works here.
   Every page (LAPP admin, a school, a lesson's studio, a file) is a window of its own: move, resize, snap, minimise.
   The command center (one column, in the middle, movable) holds search, apps, lessons, the AI, notifications,
   background work, the open windows and the settings. The desktop holds widgets, shortcuts and files. Keys are the person's own. */
:root{--bg:#07070B;--p1:#0F0F16;--p2:#15151F;--p3:#1C1C29;--p4:#26263C;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#F4F4F8;--mu:rgba(235,235,245,.6);--mu2:rgba(235,235,245,.38);
--pk:#FF3D7F;--vi:#8B5CF6;--cy:#22D3EE;--gr:#34D399;--am:#FBBF24;--rd:#F87171;--g:linear-gradient(135deg,#FF3D7F,#8B5CF6 55%,#22D3EE);color-scheme:dark}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{color:var(--tx);font:14px/1.5 Inter,Vazirmatn,system-ui,sans-serif;position:relative;
  background:radial-gradient(1100px 600px at 90% -10%,rgba(255,61,127,.2),transparent 60%),radial-gradient(900px 600px at 0% 110%,rgba(34,211,238,.16),transparent 60%),radial-gradient(800px 500px at 40% 50%,rgba(139,92,246,.16),transparent 70%),#0A0A12}
body[data-wall=dawn]{background:radial-gradient(1100px 600px at 80% 0%,rgba(251,191,36,.24),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(255,61,127,.2),transparent 60%),#120A0C}
body[data-wall=sea]{background:radial-gradient(1100px 600px at 80% 0%,rgba(34,211,238,.24),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(52,211,153,.2),transparent 60%),#06111A}
body[data-wall=plain]{background:#0B0B12}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.kbd{direction:ltr;unicode-bidi:isolate;font:600 10.5px Inter,system-ui;border:1px solid var(--ln2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--mu);white-space:nowrap}
.b{height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--ln2);background:var(--p2);font-weight:700;font-size:12.5px;white-space:nowrap}.b:hover{background:var(--p3)}.b.pr{background:var(--g);border:0}
.mu{color:var(--mu)}.sm{font-size:12px}
/* the desktop */
#desk{position:absolute;inset:0 0 56px 0}
.ico{position:absolute;width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:12px;font-size:11.5px;text-align:center;color:#fff;text-shadow:0 1px 4px #000;user-select:none;touch-action:none}
.ico:hover{background:rgba(255,255,255,.07)}.ico.sel{background:rgba(139,92,246,.3);outline:1px solid rgba(139,92,246,.7)}
.ico .g{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);position:relative;overflow:hidden}
.ico .g img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.ico .g em{position:absolute;bottom:1px;inset-inline-end:2px;font-style:normal;font-size:9px}
.ico span{line-height:1.25;max-height:2.5em;overflow:hidden;overflow-wrap:anywhere}
.ico.up .g{opacity:.5}
.wdg{position:absolute;z-index:1;background:rgba(18,18,28,.64);backdrop-filter:blur(18px);border:1px solid var(--ln2);border-radius:18px;padding:10px 12px;font-size:12.5px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.wdg .wh{display:flex;align-items:center;gap:6px;margin:-2px -4px 6px;font:700 10.5px Inter,system-ui;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);user-select:none;touch-action:none;cursor:grab}
.wdg .wh .grip{color:var(--mu2);letter-spacing:-2px}
.wdg .wh button{width:22px;height:22px;border-radius:6px;color:var(--mu2);opacity:0}.wdg .wh button:first-of-type{margin-inline-start:auto}.wdg:hover .wh button,.wdg:focus-within .wh button{opacity:1}
.wdg .big{font-size:26px;font-weight:800;line-height:1.1}
.wdg .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.wdg textarea{width:100%;min-height:84px;background:transparent;border:0;outline:none;resize:vertical}
.drop{position:absolute;inset:10px 10px 66px;z-index:200;border:2px dashed var(--cy);border-radius:18px;background:rgba(34,211,238,.08);display:grid;place-items:center;color:var(--cy);font-weight:800;font-size:16px;pointer-events:none}
/* windows */
#wins{position:absolute;inset:0 0 56px 0;pointer-events:none}
#wins>*{pointer-events:auto}
.wnd{position:absolute;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;border:1px solid rgba(255,255,255,.14);box-shadow:0 26px 70px rgba(0,0,0,.6);min-width:320px;min-height:200px}
.wnd.act{box-shadow:0 34px 90px rgba(0,0,0,.72),0 0 0 1px var(--c,rgba(139,92,246,.6))}
.wnd.min{display:none}
.wnd.anim{transition:left .16s,top .16s,width .16s,height .16s}
.wnd.full{border-radius:0}
.wbar{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding-inline-start:12px;background:linear-gradient(#171723,#12121C);border-bottom:1px solid var(--ln);border-radius:12px 12px 0 0;user-select:none;touch-action:none;position:relative}
.wnd.full .wbar{border-radius:0}
.wbar::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:var(--c,#8B5CF6);opacity:.6;border-radius:12px 12px 0 0}
.wnd:not(.act) .wbar{opacity:.8}
.wbar .tt{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar .pl{font-size:10.5px;color:var(--mu2);border:1px solid var(--ln2);border-radius:99px;padding:0 7px;white-space:nowrap}
.wbar .sp{flex:1}
.wctl{display:flex;height:100%;flex:none}
.wctl button{width:40px;height:100%;color:var(--mu);font-size:13px}
.wctl button:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.wctl button.cl:hover{background:#E5484D;color:#fff}.wctl button.cl{border-start-end-radius:12px}
.wctl button.ai{color:#C4B5FD}
.wfr{flex:1;min-height:0;position:relative;border-radius:0 0 12px 12px;overflow:hidden}
.wfr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
body.dragging iframe{pointer-events:none}
.rz{position:absolute;z-index:3}
.rz.n,.rz.s{inset-inline:8px;height:7px;cursor:ns-resize}.rz.n{top:-3px}.rz.s{bottom:-3px}
.rz.e,.rz.w{top:8px;bottom:8px;width:7px;cursor:ew-resize}.rz.e{right:-3px}.rz.w{left:-3px}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:12px;height:12px}.rz.ne{top:-3px;right:-3px;cursor:nesw-resize}.rz.sw{bottom:-3px;left:-3px;cursor:nesw-resize}.rz.nw{top:-3px;left:-3px;cursor:nwse-resize}.rz.se{bottom:-3px;right:-3px;cursor:nwse-resize}
.ghost{position:absolute;z-index:1;border-radius:14px;background:rgba(139,92,246,.18);border:2px solid rgba(139,92,246,.7);pointer-events:none;transition:all .1s}
.snapfly{position:absolute;z-index:500;background:#1D1D2C;border:1px solid var(--ln2);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(4,64px);gap:8px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.snapfly .lay{height:44px;display:grid;gap:3px;padding:3px;border-radius:8px;background:var(--p3)}
.snapfly .lay button{background:rgba(255,255,255,.14);border-radius:4px}.snapfly .lay button:hover{background:var(--vi)}
/* taskbar */
#tb{position:absolute;inset:auto 0 0 0;height:56px;z-index:300;display:flex;align-items:center;gap:6px;padding:0 10px;padding-bottom:env(safe-area-inset-bottom,0);background:rgba(13,13,20,.92);backdrop-filter:blur(18px);border-top:1px solid var(--ln2)}
#tb::before{content:"";position:absolute;inset:-1px 0 auto;height:1px;background:var(--g);opacity:.55}
.lb{width:44px;height:40px;border-radius:13px;background:var(--g);display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none;box-shadow:0 8px 22px rgba(139,92,246,.35)}
.lb.on{box-shadow:inset 0 0 0 2px #fff,0 8px 22px rgba(139,92,246,.45)}
#tasks{flex:1;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tg{display:flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--ln);flex:none}

.tg .gl i{width:7px;height:7px;border-radius:50%;flex:none}
.ti{height:34px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:9px;font-size:12.5px;color:var(--mu);max-width:190px;position:relative;white-space:nowrap}
.ti:hover{background:var(--p3);color:var(--tx)}.ti.on{background:var(--p4);color:var(--tx)}
.ti::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:var(--mu2)}
.ti.on::after{width:18px;margin-left:-9px;background:var(--c,#8B5CF6)}.ti.min{opacity:.6}
.ti .t{overflow:hidden;text-overflow:ellipsis}
.tray{display:flex;align-items:center;gap:2px;flex:none}
.tr{height:40px;min-width:40px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;color:var(--mu);position:relative}
.tr:hover{background:var(--p3);color:var(--tx)}
.tr .bd{position:absolute;top:3px;inset-inline-end:3px;min-width:16px;height:16px;border-radius:99px;background:var(--pk);color:#fff;font:800 10px/16px Inter,system-ui;padding:0 4px}
.tr.ai{background:linear-gradient(var(--p2),var(--p2)) padding-box,var(--g) border-box;border:1.5px solid transparent;color:var(--tx)}
.spark{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--p4);border-top-color:var(--cy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;position:relative;font-size:13px}
.clk{font-size:11.5px;color:var(--mu);line-height:1.2;text-align:end;font-variant-numeric:tabular-nums}
.prev{position:absolute;bottom:62px;z-index:400;width:230px;background:#1D1D2C;border:1px solid var(--ln2);border-radius:12px;padding:9px 11px;box-shadow:0 20px 50px rgba(0,0,0,.6);font-size:12.5px;pointer-events:none}
.prev small{display:block;color:var(--mu2)}
/* the command center */
#cc{position:absolute;z-index:600;left:50%;top:7%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));max-height:calc(100% - 90px);display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:rgba(19,19,30,.97);backdrop-filter:blur(26px);box-shadow:0 0 0 1.5px rgba(139,92,246,.55),0 40px 110px rgba(0,0,0,.8);animation:pop .16s ease-out}
#cc.moved{transform:none}
@keyframes pop{from{opacity:0;margin-top:10px}to{opacity:1;margin-top:0}}
.cch{display:flex;align-items:center;justify-content:center;height:16px;cursor:grab;touch-action:none;flex:none}
.cch i{width:46px;height:4px;border-radius:2px;background:var(--ln2)}.cch:hover i{background:var(--vi)}
.ccs{display:flex;align-items:center;gap:10px;margin:0 14px 8px;padding:10px 14px;border-radius:16px;background:var(--p3);border:1px solid var(--ln2)}
.ccs .o{width:28px;height:28px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.ccs input{flex:1;background:none;border:0;outline:none;font:500 16px Inter,Vazirmatn,system-ui;min-width:0}
.cct{display:flex;gap:4px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.cct button{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mu);border:1px solid var(--ln);white-space:nowrap;display:flex;gap:6px;align-items:center}
.cct button.on{color:var(--tx);border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.18)}
.cct button em{font-style:normal;background:var(--pk);color:#fff;border-radius:99px;padding:0 5px;font-size:10px}
.ccb{flex:1;overflow:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;min-height:120px}
.ccg h5{margin:0 0 6px;font:700 10.5px Inter,system-ui;letter-spacing:.5px;text-transform:uppercase;color:var(--mu2);display:flex;align-items:center;gap:8px}
.ccg h5 button{margin-inline-start:auto;text-transform:none;letter-spacing:0;font-weight:600;color:#C4B5FD;font-size:11.5px}
.rw{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;width:100%;text-align:start;font-size:13px}
.rw:hover,.rw.sel{background:rgba(139,92,246,.18)}
.rw .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;background:var(--p3)}
.rw b{display:block;font-weight:600}.rw small{display:block;color:var(--mu2);font-size:11.5px}
.rw .k{margin-inline-start:auto;font-size:11px;color:var(--mu2);white-space:nowrap}
.rw .acts{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;font-size:12px;text-align:center}
.tile:hover{background:var(--p3)}
.tile .g{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px}
.tile small{color:var(--mu2);font-size:10.5px;line-height:1.2}
.tool{padding:3px 9px;border-radius:99px;border:1px solid var(--ln2);font-size:11.5px;color:var(--mu)}.tool:hover{color:var(--tx);border-color:rgba(139,92,246,.7)}
.aiq{border-radius:16px;padding:11px 13px;background:linear-gradient(135deg,rgba(255,61,127,.09),rgba(139,92,246,.12));border:1px solid rgba(139,92,246,.4);font-size:13.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.aiq.err{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4)}
.aiq .who2{font:700 11px Inter,system-ui;color:#C4B5FD;margin-bottom:3px;white-space:normal}
.aiq .plan{display:flex;flex-direction:column;gap:5px;margin-top:8px;white-space:normal}
.aiq .plan div{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 9px;font-size:12.5px}
.aiq .btns{display:flex;gap:6px;margin-top:9px;white-space:normal}
.me2{align-self:flex-end;background:rgba(139,92,246,.3);padding:8px 12px;border-radius:14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mu);margin-inline-end:3px;animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.2}}
.bar{height:5px;border-radius:3px;background:var(--p1);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.ccf{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--ln);font-size:11.5px;color:var(--mu2);flex:none;flex-wrap:wrap}
.ccf button{color:#C4B5FD}
.empty{padding:14px;color:var(--mu2);font-size:13px;text-align:center}
/* dialogs, menus, toasts */
.sheet{position:absolute;z-index:700;left:50%;top:10%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));max-height:80%;overflow:auto;background:rgba(19,19,30,.98);border-radius:20px;border:1px solid var(--ln2);box-shadow:0 40px 110px rgba(0,0,0,.8);padding:16px;animation:pop .16s ease-out}
.sheet h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.sheet h4 button{margin-inline-start:auto;color:var(--mu);width:28px;height:28px;border-radius:8px}
.galg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.galg button{padding:12px;border-radius:14px;background:var(--p2);border:1px solid var(--ln);text-align:start;font-size:12px;display:flex;flex-direction:column;gap:4px}
.galg button:hover{border-color:rgba(139,92,246,.7)}.galg b{font-size:13px}
.kbr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--p2);font-size:12.5px;margin-bottom:4px}
.kbr.rec{outline:2px solid var(--cy)}.kbr.clash{outline:2px solid var(--rd)}
.kcap{direction:ltr;unicode-bidi:isolate;font:600 11.5px ui-monospace,monospace;padding:3px 8px;border-radius:7px;background:var(--p3);border:1px solid var(--ln2);border-bottom-width:2px;min-width:90px;text-align:center}
.in{width:100%;background:var(--p3);border:1px solid var(--ln2);border-radius:10px;padding:9px 11px;outline:none}
.cm{position:fixed;z-index:800;min-width:220px;background:#1D1D2C;border:1px solid var(--ln2);border-radius:12px;padding:5px;box-shadow:0 24px 60px rgba(0,0,0,.75);font-size:13px}
.cm button{display:flex;gap:9px;align-items:center;width:100%;padding:6px 9px;border-radius:7px;text-align:start}.cm button:hover,.cm button:focus-visible{background:rgba(139,92,246,.25)}.cm .k{margin-inline-start:auto;color:var(--mu2);font-size:11px;padding-inline-start:12px}.cm hr{border:0;border-top:1px solid var(--ln);margin:4px 2px}.cm .dz{color:var(--rd)}
.toasts{position:fixed;bottom:68px;inset-inline-end:12px;z-index:900;display:flex;flex-direction:column-reverse;gap:8px;width:min(360px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:#1D1D2C;border:1px solid var(--ln2);border-radius:12px;padding:9px 12px;font-size:13px;box-shadow:0 18px 40px rgba(0,0,0,.6);animation:pop .16s ease-out}
.toast .i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:800}
.toast .a{margin-inline-start:auto;color:#C4B5FD;font-weight:700;white-space:nowrap}

  .wnd{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}.wnd:not(.act){display:none}.rz,.wctl [data-wc=max]{display:none}
  .ico{display:none}
  #desk{overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px}.wdg{position:static!important;width:auto!important}
  #cc,.sheet{top:8px!important;left:8px!important;right:8px;width:auto;transform:none;max-height:calc(100% - 76px)}
  .tr .lbl{display:none}
}
</style></head><body>
<div id="desk" aria-label="Desktop"></div>
<div id="wins"><div class="ghost" id="ghost" hidden></div></div>

  </div>
</nav>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
