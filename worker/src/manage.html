<!doctype html>
<html lang="en" class="desk-host"><head><!--LAPP:HEAD-->
<title>{{BRAND}}</title>
<link rel="stylesheet" href="/ui/desk/desk.css?v={{V}}">
</head><body>
<div class="k-boot" id="boot" role="status" aria-label="{{BRAND}} is starting"><div class="c"><span class="logo"><img src="/ui/kx5.svg?v={{V}}" alt="" width="64" height="64"></span><span class="k-load"><i id="bootBar"></i></span></div></div>
<!-- The work desktop. Built from modules in /ui/desk/ (core · apps · windows · taskbar · command · desktop · main):
     every window has the same standard frame, and a change there changes every window. -->
<div id="desk" aria-label="Desktop"></div>
<div id="wins"><div class="ghost" id="ghost" hidden></div></div>
<nav id="tb" aria-label="Taskbar">
  <button class="lb" id="lb" title="Command center" aria-label="Command center"><img src="/ui/kx5.svg?v={{V}}" alt="" width="30" height="30"></button>
  <button class="wsb" id="wsb" hidden title="Workspaces"></button>
  <div id="dock" role="toolbar" aria-label="Apps and windows"></div>
  <div class="tray">
    <button class="tr" data-tr="running" id="trRun" title="Working in the background"></button>
    <button class="tr" data-tr="alerts" id="trBell" title="Notifications"></button>
    <button class="tr" data-tr="me" title="Accounts"><span class="avs" id="av"></span></button>
    <button class="tr" data-tr="clock" title="Calendar"><span class="clk" id="clk"></span></button>
  </div>
</nav>
<script src="/ui/desk/core.js?v={{V}}"></script>
<script src="/ui/desk/apps.js?v={{V}}"></script>
<script src="/ui/desk/windows.js?v={{V}}"></script>
<script src="/ui/desk/taskbar.js?v={{V}}"></script>
<script src="/ui/desk/command.js?v={{V}}"></script>
<script src="/ui/desk/ccboard.js?v={{V}}"></script>
<script src="/ui/desk/desktop.js?v={{V}}"></script>
<script src="/ui/desk/system.js?v={{V}}"></script>
<script src="/ui/desk/lock.js?v={{V}}"></script>
<script src="/ui/desk/main.js?v={{V}}"></script>
</body></html>
