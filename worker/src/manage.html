<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAPP · Manage</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/desk/desk.css?v=3">
<script src="/ui/panel-i18n.js?v=9"></script>
<script src="/ui/cursor.js?v=2"></script>
<script src="/ui/icons.js?v=1"></script>
<script src="/ui/theme.js?v=2"></script>
</head><body>
<!-- The work desktop. Built from modules in /ui/desk/ (core · apps · windows · taskbar · command · desktop · main):
     every window has the same standard frame, and a change there changes every window. -->
<div id="desk" aria-label="Desktop"></div>
<div id="wins"><div class="ghost" id="ghost" hidden></div></div>
<nav id="tb" aria-label="Taskbar">
  <button class="lb" id="lb" title="Command center">L</button>
  <button class="wsb" id="wsb" hidden title="Workspaces"></button>
  <div id="dock" role="toolbar" aria-label="Apps and windows"></div>
  <div class="tray">
    <button class="tr ai" data-tr="ai" title="Ask the AI"><span class="spark">✦</span><span class="lbl">Ask AI</span></button>
    <button class="tr" data-tr="running" id="trRun" title="Working in the background"></button>
    <button class="tr" data-tr="alerts" id="trBell" title="Notifications"></button>
    <button class="tr" data-tr="me" title="You and settings"><span class="av" id="av"></span><span class="clk" id="clk"></span></button>
  </div>
</nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/ui/desk/core.js?v=1"></script>
<script src="/ui/desk/apps.js?v=2"></script>
<script src="/ui/desk/windows.js?v=3"></script>
<script src="/ui/desk/taskbar.js?v=2"></script>
<script src="/ui/desk/command.js?v=2"></script>
<script src="/ui/desk/desktop.js?v=1"></script>
<script src="/ui/desk/system.js?v=4"></script>
<script src="/ui/desk/lock.js?v=1"></script>
<script src="/ui/desk/main.js?v=4"></script>
</body></html>
