// "are you sure?": our dialog in the panel, two clicks elsewhere
async function sure(btn, title, text, again) {
  if (window.Shell && Shell.active) { if ($("#dlg").open) $("#dlg").close(); return Shell.confirm({ title, text, ok: "Delete", danger: true }); }
  if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.textContent = again; return false; }
  return true;
}
async function api(method, path, body, raw) {
  const r = await fetch(`/api/org/${SLUG}${path}`, { method, credentials: "same-origin",
    headers: { ...(raw ? raw.headers : body ? { "Content-Type": "application/json" } : {}), ...(method !== "GET" ? { "X-LAPP": "1" } : {}) },
    body: raw ? raw.body : body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = `/?login=1&next=/s/${SLUG}`; throw new Error("signed out"); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------------- a small form dialog: fields → values ---------------- */
function form(title, fields, submit, okLabel = "Save") {
  const d = $("#dlg"), f = $("#dlgForm");
  d.classList.remove("wide");
  f.innerHTML = `<h3>${esc(title)}</h3>` + fields.map(x => {
    const id = "f_" + x.name;
    if (x.type === "html") return x.html;
    if (x.type === "select" || x.type === "multi") return `<div class="f"><label for="${id}">${esc(x.label)}</label><l-select id="${id}" name="${x.name}" ${x.type === "multi" ? "multiple" : ""} ${x.search ? "search" : ""} placeholder="${esc(x.ph || (x.type === "multi" ? "Choose…" : "Choose one"))}" ${x.required ? "required" : ""}></l-select></div>`;
    if (x.type === "date" || x.type === "datetime-local") return `<div class="f"><label for="${id}">${esc(x.label)}</label><l-date id="${id}" name="${x.name}" type="${x.type === "date" ? "date" : "datetime"}" value="${esc(x.value || "")}" ${x.required ? "required" : ""}></l-date></div>`;
    if (x.type === "checks") return `<div class="f"><label>${esc(x.label)}</label><div class="checks">${x.options.map(([v, l]) => `<label><input type="checkbox" name="${x.name}" value="${esc(v)}" ${(x.value || []).map(String).includes(String(v)) ? "checked" : ""}> ${esc(l)}</label>`).join("") || `<span class="mu">Nothing to choose yet</span>`}</div></div>`;
    if (x.type === "textarea") return `<div class="f"><label for="${id}">${esc(x.label)}</label><textarea class="in" id="${id}" name="${x.name}" placeholder="${esc(x.ph || "")}">${esc(x.value || "")}</textarea></div>`;
    return `<div class="f"><label for="${id}">${esc(x.label)}</label><input class="in" id="${id}" name="${x.name}" type="${x.type || "text"}" value="${esc(x.value ?? "")}" placeholder="${esc(x.ph || "")}" ${x.required ? "required" : ""} ${x.attrs || ""}></div>`;
  }).join("") + `<div class="f err mu" id="dlgErr" style="color:var(--rd)"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" value="cancel" formnovalidate>Cancel</button><button class="b pr" value="ok">${esc(okLabel)}</button></div>`;
  // the controls get their options (with pictures, fonts, second lines) after they exist
  for (const x of fields) if (x.type === "select" || x.type === "multi") {
    const el = f.querySelector(`#f_${x.name}`);
    el.options = x.options.map(o => Array.isArray(o) ? { value: String(o[0]), label: String(o[1]), ...(o[2] || {}) } : o);
    el.value = x.type === "multi" ? (x.value || []).map(String) : (x.value ?? (x.options[0] ? (Array.isArray(x.options[0]) ? x.options[0][0] : x.options[0].value) : ""));
  }
  f.onsubmit = async e => {
    if (e.submitter && e.submitter.value === "cancel") return;
    e.preventDefault();
    const v = {}; const fd = new FormData(f);
    for (const x of fields) if (x.name) v[x.name] = x.type === "checks" || x.type === "multi" ? fd.getAll(x.name) : (fd.get(x.name) ?? "");
    try { await submit(v, f); d.close(); } catch (err) { $("#dlgErr").textContent = err.message; }
  };
  d.showModal();
}

}

let recBlob = null;
document.addEventListener("submit", async e => {
  if (e.target.id !== "hwForm") return;
  e.preventDefault();
  const id = location.hash.split("/")[1], fd = new FormData(e.target), answers = {};
  for (const [k, v] of fd) answers[k.startsWith("q") ? k.slice(1) : k] = v;
  try {
    let fileId;
    if (recBlob) fileId = (await api("POST", "/files", null, { headers: { "Content-Type": recBlob.type || "audio/webm", "X-File-Name": "recording.webm" }, body: recBlob })).id;
    const r = await api("POST", `/assignments/${id}/submit`, { answers, fileId });
    recBlob = null; toast(r.score != null ? `Handed in · ${r.score}%` : "Handed in"); show();
  } catch (x) { toast(x.message); }
});
let rec = null;
document.addEventListener("click", async e => {
  if (!e.target.closest("#rec")) return;
  const btn = $("#rec");
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = ev => chunks.push(ev.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); recBlob = new Blob(chunks, { type: rec.mimeType }); const a = $("#recAudio"); a.src = URL.createObjectURL(recBlob); a.hidden = false; btn.textContent = "🎤 Record again"; };
    rec.start(); btn.textContent = "⏹ Stop"; setTimeout(() => rec && rec.state === "recording" && rec.stop(), 120000);
  } catch { toast("The microphone isn't available"); }
});

// a password a person can read out and type: no 0/O or 1/l/I
function newPassword() {
  const A = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint32Array(10));

const qRow = (q = {}) => `<tr><td class="qn"></td><td><input class="in" data-q="q" value="${esc(q.q || "")}" placeholder="Wann gibt es Frühstück?" aria-label="Question"></td>
  <td><input class="in" data-q="a" value="${esc(q.answer || "")}" placeholder="Von 7 bis 10 Uhr" aria-label="Right answer"></td>

  <td><button type="button" class="b sm" data-qdel aria-label="Remove question">✕</button></td></tr>`;
const quizTable = () => `<div class="f" id="qWrap"><label>Questions</label>
  <div class="tbl qtbl"><table><thead><tr><th>#</th><th>Question</th><th>Right answer</th><th>Wrong answers <span class="mu">(optional · comma)</span></th><th></th></tr></thead>
  <tbody id="qBody">${qRow()}${qRow()}${qRow()}</tbody></table></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="b sm" id="qAdd">＋ Add a question</button>
  <span class="mu">With wrong answers students pick one; without, they type the answer.</span></div></div>`;
function quizRows() {
  return [...$$("#qBody tr")].map(tr => {
    const g = k => tr.querySelector(`[data-q="${k}"]`).value.trim();
    const q = g("q"), answer = g("a"), wrong = g("w").split(/[,;]/).map(x => x.trim()).filter(Boolean);
    return { q, answer, options: wrong.length ? [answer, ...wrong].sort(() => Math.random() - .5) : [] };
  }).filter(r => r.q || r.answer);
}

  form(`${f.title} · ${f.student_name || f.student_username}`, [{ type: "html", html: `${f.note ? `<p class="mu">${esc(f.note)}</p>` : ""}<div>${f.installments.map(i => `<div class="r"><span>${fmtDate(i.due_on)}</span><span>${money(i.paid)} / ${money(i.amount)}</span><span class="mu">${i.paid_on ? `${fmtDate(i.paid_on)} · ${esc(i.method)}` : i.reminded_at ? "reminded " + ago(i.reminded_at) : ""}</span></div>`).join("")}</div>
    <button type="button" class="b d" data-go="delfee" data-f="${f.id}" style="align-self:flex-start">Delete this fee</button>` }], async () => {}, "Close");
};
ACT.delfee = async btn => { if (!await sure(btn, "Delete this payment?", "It disappears from the student's fees and from the totals.", "Click again to delete")) return; await api("DELETE", `/fees/${btn.dataset.f}`); $("#dlg").close(); show(); };
ACT["export-fees"] = async () => {
  const { fees } = await api("GET", "/fees"), q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const rows = fees.flatMap(f => f.installments.map(i => [f.student_name || f.student_username, f.student_email, f.title, f.class_name || "", i.due_on, (i.amount / 100).toFixed(2), (i.paid / 100).toFixed(2), i.paid_on, i.method].map(q).join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["student,email,fee,class,due,amount,paid,paid_on,method\n" + rows.join("\n")], { type: "text/csv" })); a.download = `${SLUG}-payments.csv`; a.click();
};

/* ================= live class ================= */
let LV = null;
V.live = async id => {
  const info = await api("GET", `/live/${id}`);
  if (!info.canTeach && !info.live) return `<a class="crumb" href="#home">← Back</a><div class="card empty">This class hasn't started yet. This page opens it as soon as your teacher starts.</div>`;
  const T = info.canTeach;
  AFTER = () => liveStart(id, info);
  return `<div class="lv"><div class="lv-top"><span class="live-dot">● LIVE</span><b>${esc(info.class.name)}</b><span class="mu" id="lvCount"></span><span style="margin-inline-start:auto;display:flex;gap:6px">
    ${T ? `<button class="b sm" id="lvHands">✋ 0</button><button class="b sm d" id="lvEnd">End class</button>` : `<button class="b sm" id="lvLeave">Leave</button>`}</span></div>
  <div class="stage"><div class="boardwrap" id="bw"><canvas class="board" id="board"></canvas><div class="overlay" id="ov" hidden></div><div class="poll" id="poll" hidden></div><div class="pg"><span id="pgn">1 / 1</span></div></div></div>
  <div class="lv-side"><div><b style="font-size:12.5px">In class</b><div class="ppl" id="ppl"></div></div><div id="hands"></div>
    <b style="font-size:12.5px">Chat</b><div class="chat" id="chat"></div><form id="chatForm" style="display:flex;gap:6px"><input class="in" id="chatIn" placeholder="Message…" autocomplete="off" maxlength="500"><button class="b sm">Send</button></form></div>
  <div class="lv-tools">${T ? `
    <button class="tl on" data-tool="pen" title="Pen">✏️</button><button class="tl" data-tool="text" title="Text">T</button>
    ${["#111111", "#2563EB", "#DC2626", "#059669", "#F59E0B"].map((c, i) => `<button class="sw ${i ? "" : "on"}" data-color="${c}" style="background:${c}" title="Colour"></button>`).join("")}
    <button class="tl" data-tool="undo" title="Undo">↶</button><button class="tl" data-tool="clear" title="Clear page">🧽</button>
    <button class="tl" data-tool="prev" title="Previous page">‹</button><button class="tl" data-tool="next" title="Next page">›</button><button class="tl" data-tool="add" title="New page">＋</button>
    <button class="tl" data-tool="show" title="Show material">📎 Show</button><button class="tl" data-tool="poll" title="Quick question">❓ Ask</button>`
    : `<button class="tl" id="lvHand">✋ Raise hand</button>`}</div></div>`;
};
function liveStart(id, info) {
  document.body.classList.add("live");
  const T = info.canTeach, cv = $("#board"), ctx = cv.getContext("2d");
  const L = LV = { ws: null, state: null, color: "#111111", tool: "pen", drawing: null, myVote: null, hand: false, people: [], closed: false };
  const fit = () => { const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; draw(); };
  const page = () => L.state && L.state.pages[L.state.page];
  function stroke(s) { const W = cv.width, Hh = cv.height; ctx.strokeStyle = s.c; ctx.lineWidth = s.w * W / 1000; ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath(); for (let i = 0; i < s.pts.length; i += 2) { const x = s.pts[i] * W, y = s.pts[i + 1] * Hh; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const p = page(); if (!p) return;
    p.strokes.forEach(stroke);
    for (const t of p.texts) { ctx.fillStyle = t.c; ctx.font = `600 ${t.s * cv.width / 1000}px Inter, system-ui, sans-serif`; ctx.fillText(t.text, t.x * cv.width, t.y * cv.height); }
    if (L.drawing) stroke(L.drawing);
    $("#pgn").textContent = `${L.state.page + 1} / ${L.state.pages.length}`;
  }
  function showOv() {
    const s = L.state.show, ov = $("#ov");
    ov.hidden = !s; if (!s) return;
    const fileUrl = s.url;
    ov.innerHTML = `${T ? `<button class="x" id="ovX">Close for everyone</button>` : ""}<h4>${esc(s.title)}</h4>` + (
      s.kind === "text" ? `<p>${esc(s.body)}</p>` :
      s.kind === "link" ? `<p>${esc(s.body || "")}</p><a class="b" style="background:#111;color:#fff;align-self:flex-start" href="${esc(s.url)}" target="_blank" rel="noopener">Open ${esc(s.url.replace(/^https:\/\//, "").slice(0, 50))} ↗</a>` :
      s.kind === "file" && /^image\//.test(s.type) ? `<img src="${esc(fileUrl)}" alt="">` :
      s.kind === "file" && /^audio\//.test(s.type) ? `<audio controls src="${esc(fileUrl)}" style="width:100%"></audio>` :
      s.kind === "file" ? `<iframe src="${esc(fileUrl)}" title="${esc(s.title)}"></iframe>` :
      s.kind === "lesson" ? `<audio controls src="/content/lessons/${esc(s.url)}/audio.mp3" style="width:100%"></audio><div id="ovLesson" class="mu" style="color:#444">Loading…</div>` : "");
    if (s.kind === "lesson") fetch(`/content/lessons/${s.url}/lesson.json`).then(r => r.json()).then(l => { const el = $("#ovLesson"); if (el) el.innerHTML = l.transcript.slice(0, 80).map(x => `<div style="padding:3px 0;color:#222;font-size:16px">${esc(x.replace(/\*\*/g, ""))}</div>`).join(""); }).catch(() => {});
    const x = $("#ovX"); if (x) x.onclick = () => send({ t: "show", show: null });
  }
  function showPoll() {
    const P = L.state.poll, el = $("#poll"); el.hidden = !P; if (!P) return;
    el.innerHTML = `<b>${esc(P.q)}</b>${P.options.map((o, i) => `<button data-vote="${i}" class="${L.myVote === i ? "mine" : ""}" ${P.open && !T ? "" : "disabled"}><span>${String.fromCharCode(65 + i)}) ${esc(o)}</span><b>${T || !P.open || L.myVote != null ? P.counts[i] : ""}</b></button>`).join("")}
      <span style="font-size:12px;color:#666">${P.total} answered${P.open ? "" : " · closed"}</span>${T ? `<div style="display:flex;gap:6px">${P.open ? `<button data-poll="close" style="justify-content:center">Close</button>` : ""}<button data-poll="remove" style="justify-content:center">Remove</button></div>` : ""}`;
  }
  function people() { $("#ppl").innerHTML = L.people.map(p => `<span class="${p.teacher ? "t" : ""}">${esc(p.name)}</span>`).join(""); const n = L.people.filter(p => !p.teacher).length; $("#lvCount").textContent = `${n} ${n === 1 ? "student" : "students"}`; }
  function hands() {
    const H = L.state.hands || [];
    $("#hands").innerHTML = H.map(h => `<div class="hand">✋ ${esc(h.name)}${T ? `<button class="b sm" data-lower="${h.id}">Lower</button>` : ""}</div>`).join("");
    if (T) $("#lvHands").textContent = `✋ ${H.length}`;
    if (!T) { L.hand = H.some(h => h.id === S.me.id); $("#lvHand").classList.toggle("on", L.hand); $("#lvHand").textContent = L.hand ? "✋ Lower hand" : "✋ Raise hand"; }
  }
  function chat(m) { const el = $("#chat"); el.insertAdjacentHTML("beforeend", `<div class="${m.teacher ? "t" : ""}"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`); el.scrollTop = el.scrollHeight; }
  function send(m) { if (L.ws && L.ws.readyState === 1) L.ws.send(JSON.stringify(m)); }
  function connect() {
    const ws = L.ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/org/${SLUG}/live/${id}`);
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.t === "state") { L.state = m.state; $("#chat").innerHTML = ""; (m.state.chat || []).forEach(chat); draw(); showOv(); showPoll(); hands(); }
      else if (m.t === "people") { L.people = m.people; people(); }
      else if (m.t === "stroke") { if (m.page === L.state.page) { page().strokes.push(m.s); draw(); } else L.state.pages[m.page].strokes.push(m.s); }
      else if (m.t === "page-data") { L.state.pages[m.n] = m.data; draw(); }
      else if (m.t === "page") { L.state.page = m.n; while (L.state.pages.length < m.count) L.state.pages.push({ strokes: [], texts: [] }); L.state.pages[m.n] = m.data; draw(); }
      else if (m.t === "show") { L.state.show = m.show; showOv(); }
      else if (m.t === "poll") { if (!m.poll || (L.state.poll && m.poll.q !== L.state.poll.q)) L.myVote = null; L.state.poll = m.poll; showPoll(); }
      else if (m.t === "hands") { L.state.hands = m.hands; hands(); }
      else if (m.t === "chat") chat(m.msg);
      else if (m.t === "ended") { L.closed = true; toast("The class has ended"); setTimeout(() => { location.hash = T ? `class/${info.class.id}` : "home"; }, 800); }
    };
    ws.onclose = () => { if (!L.closed && LV === L) setTimeout(connect, 1500); };
  }
  // drawing (teacher)
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  if (T) {
    cv.onpointerdown = e => {
      if (L.tool === "text") { const [x, y] = pos(e); askText(x, y); return; }
      cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); L.drawing = { c: L.color, w: 3, pts: [x, y] };
    };
    cv.onpointermove = e => { if (!L.drawing) return; const [x, y] = pos(e); L.drawing.pts.push(Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000); draw(); };
    cv.onpointerup = () => { if (!L.drawing) return; const s = L.drawing; L.drawing = null; if (s.pts.length >= 4) { page().strokes.push(s); send({ t: "stroke", s }); } draw(); };
  }
  function askText(x, y) {
    form("Write on the board", [{ name: "text", label: "Text", required: true }, { name: "size", label: "Size", type: "select", options: [["22", "Small", { font: "Inter" }], ["32", "Medium", { font: "Inter" }], ["48", "Large", { font: "Inter" }]], value: "32" }],
      async v => send({ t: "text", x, y, text: v.text, c: L.color, s: Number(v.size) }), "Write");
  }
  $(".lv-tools").onclick = async e => {
    const c = e.target.closest("[data-color]"); if (c) { L.color = c.dataset.color; $$("[data-color]").forEach(x => x.classList.toggle("on", x === c)); return; }
    const b = e.target.closest("[data-tool]"); if (!b) return;
    const t = b.dataset.tool;
    if (t === "pen" || t === "text") { L.tool = t; $$("[data-tool=pen],[data-tool=text]").forEach(x => x.classList.toggle("on", x === b)); }
    if (t === "undo") send({ t: "undo" });
    if (t === "clear") send({ t: "clear" });
    if (t === "prev") send({ t: "page", n: L.state.page - 1 });
    if (t === "next") send(L.state.page < L.state.pages.length - 1 ? { t: "page", n: L.state.page + 1 } : { t: "page", add: true });
    if (t === "add") send({ t: "page", add: true });
    if (t === "poll") form("Quick question", [{ name: "q", label: "Question", required: true }, { name: "opts", label: "Answers — one per line", type: "textarea", value: "Yes\nNo" }],
      async v => send({ t: "poll", poll: { q: v.q, options: v.opts.split(/\r?\n/).map(s => s.trim()).filter(Boolean) } }), "Ask");
    if (t === "show") {
      const { materials } = await api("GET", `/materials?class=${info.class.id}`);
      form("Show on the board", [{ name: "m", label: "Material", type: "select", search: true, options: materials.map(m => [m.id, m.title, { icon: ICON[m.kind], sub: m.kind === "file" ? m.file_name : m.kind }]) }], async v => {
        const m = materials.find(x => String(x.id) === v.m); if (!m) throw new Error("Add material to the class first");
        send({ t: "show", show: { kind: m.kind, title: m.title, body: m.body, type: m.file_type || "", url: m.kind === "file" ? `/api/org/${SLUG}/files/${m.file_id}` : m.url } });
      }, "Show");
      if (!materials.length) $("#dlgErr").textContent = "This class has no material yet — add it on the class page.";
    }
  };
  $("#poll").onclick = e => { const v = e.target.closest("[data-vote]"); if (v && !v.disabled) { L.myVote = Number(v.dataset.vote); send({ t: "vote", i: L.myVote }); } const p = e.target.closest("[data-poll]"); if (p) send(p.dataset.poll === "close" ? { t: "poll-close" } : { t: "poll", poll: null }); };
  $("#hands").onclick = e => { const b = e.target.closest("[data-lower]"); if (b) send({ t: "hand", id: Number(b.dataset.lower), up: false }); };
  $("#chatForm").onsubmit = e => { e.preventDefault(); const v = $("#chatIn").value.trim(); if (v) { send({ t: "chat", text: v }); $("#chatIn").value = ""; } };
  if (T) $("#lvEnd").onclick = async () => { if ($("#lvEnd").dataset.sure !== "1") { $("#lvEnd").dataset.sure = "1"; $("#lvEnd").textContent = "Click again to end"; return; } send({ t: "end" }); await api("PATCH", `/events/${id}`, { status: "done" }); };
  else { $("#lvHand").onclick = () => send({ t: "hand", up: !L.hand }); $("#lvLeave").onclick = () => { L.closed = true; L.ws.close(); location.hash = "home"; }; }
  addEventListener("resize", fit); new ResizeObserver(fit).observe($("#bw")); fit();
  connect();
}
function leaveLive() { if (LV) { LV.closed = true; try { LV.ws.close(); } catch {} LV = null; } document.body.classList.remove("live"); }

/* ================= router ================= */
// only the newest render lands on the page (a slow answer must not overwrite a newer view)
let SEQ = 0, AFTER = null;
async function show() {
  if (!S.role) return;
  if (window.Shell && Shell.active) return Shell.refresh();
  const [v, arg] = (location.hash.slice(1) || "").split("/");
  const view = V[v] ? v : NAV[S.role][0][0];
  leaveLive();
  $$(".nv[data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === view || (view === "class" && a.dataset.v === "classes") || (view === "hw" && a.dataset.v === "homework")));
  const my = ++SEQ; AFTER = null;
  let html;
  try { html = await V[view](arg); } catch (e) { html = `<div class="card">⚠️ ${esc(e.message)}</div>`; }
  if (my !== SEQ) return;
  $("#view").innerHTML = html;
  if (AFTER) { const f = AFTER; AFTER = null; f(); }
}
addEventListener("hashchange", show);
// a new language: draw the page again (dates and numbers), but never drop a running live class
addEventListener("panel:lang", () => { if (!document.body.classList.contains("live")) show(); });
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); if (g && ACT[g.dataset.go]) { e.preventDefault(); try { await ACT[g.dataset.go](g); } catch (x) { toast(x.message); } return; }
  const ct = e.target.closest("[data-ct]"); if (ct) { CT = ct.dataset.ct; return show(); }
  const pf = e.target.closest("[data-pf]"); if (pf) { PF = pf.dataset.pf; return show(); }
  const ff = e.target.closest("[data-ff]"); if (ff) { FF = ff.dataset.ff; return show(); }
  const wk = e.target.closest("[data-week]"); if (wk) { WEEK = wk.dataset.week === "0" ? 0 : WEEK + Number(wk.dataset.week); return show(); }
});
async function boot(again) {
  try {
    const r = await api("GET", "");
    S = { ...S, ...r };
    document.documentElement.style.setProperty("--org", S.org.color);
    document.title = `${S.org.name} · LAPP`;
    side(); show();
  } catch (e) {
    $("#side").innerHTML = `<div class="lg"><i>L</i><span>LAPP</span></div>`;
    $("#view").innerHTML = `<div class="card" style="max-width:520px"><h3>Can't open this school</h3><p class="mu">${esc(e.message)}</p><a class="b" href="/" style="margin-top:12px">Go to the LAPP app</a></div>`;
  }
}
boot();
// a student's page notices when the class goes live
setInterval(() => { if (S.role === "student" && !document.hidden && ["home", ""].includes(location.hash.slice(1).split("/")[0])) show(); }, 60000);
</script>
