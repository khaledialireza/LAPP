<!doctype html>
<html data-desk lang="en"><head><!--LAPP:HEAD-->
<title>Settings · LAPP</title>
<style>
/* Settings: you, the look of the whole system (theme, accent, wallpaper, pointer), the desktop, keys, notifications. */
body{background:var(--bg);color:var(--tx);font:13.5px/1.5 Inter,Vazirmatn,system-ui,sans-serif;display:grid;grid-template-columns:210px 1fr;height:100vh;overflow:hidden}
#nav{border-inline-end:1px solid var(--ln);background:var(--p1);padding:12px 8px;overflow:auto}
main{overflow:auto;padding:20px 26px 40px}
.top{display:none}
h2{font-size:18px;margin-bottom:4px}.sub{color:var(--mu);margin-bottom:16px}
.card{margin-bottom:14px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 0}
.th{border-radius:12px;border:2px solid var(--ln);padding:8px;text-align:start;display:flex;flex-direction:column;gap:6px}.th.on{border-color:var(--vi)}
.th .pv{height:70px;border-radius:8px;position:relative;overflow:hidden}.th .pv i{position:absolute;inset:12px 30px 12px 12px;border-radius:6px}.th .pv em{position:absolute;bottom:6px;left:6px;right:6px;height:8px;border-radius:4px}
.dots{display:flex;gap:8px;flex-wrap:wrap}.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;color:#fff}.dot.on{border-color:var(--tx)}
</style><script src="/ui/ai-settings.js?v={{V}}" defer></script></head><body>
<nav id="nav" class="k-nav" aria-label="Settings"></nav>
<main id="main"><div class="top" data-chrome><h1>Settings</h1></div></main>
<script>
"use strict";
const { $, $$, esc: E, I, LS, MAC } = K, keyName = K.keyLabel;
const tell = (key, value) => LAPPFrame.up({ t: "settings", key, value });   // the desktop applies it to every window and saves it
const PARTS = [["you", "user", "You"], ["look", "palette", "Look & theme"], ["desk", "desktop", "Desktop"], ["cc", "grid", "Command center"], ["keys", "keyboard", "Keyboard"], ["notes", "bell", "Notifications"], ["ai", "ai", "AI"], ["about", "info", "About"]];
const THEMES = window.LAPPThemes || {};
let ME = null, part = location.hash.slice(1) || "you";
async function load() { ME = (await K.api("GET", "/me")).user; draw(); }
function draw() {
  // the first item is the person: their name and their face, not a word
  $("#nav").innerHTML = PARTS.filter(p => p[0] !== "ai" || (ME && ME.role === "admin")).map(([k, ic, l]) => `<button class="${part === k ? "on" : ""}" data-p="${k}">${k === "you" && ME ? K.avatar(ME, 20) : I(ic)}<span>${E(k === "you" && ME ? ME.name || "@" + ME.username : l)}</span></button>`).join("");
  const th = LS.get("lapp.theme", {}), T = th.theme || "aurora", A = th.accent || "#8B5CF6";
  const sw = (id, on) => `<button class="sw ${on ? "on" : ""}" data-sw="${id}" role="switch" aria-checked="${!!on}"></button>`;
  let h = "";
  if (part === "you") h = `<h2>${E(ME.name || "@" + ME.username)}</h2><div class="sub">Your account. Name and email are changed on your profile.</div><div class="card rows"><div class="opt"><div style="display:flex;gap:14px;align-items:center">${K.avatar(ME, 52)}<div><b>${E(ME.name || "@" + ME.username)}</b><small>${E(ME.email || "")} · ${E(ME.role)}</small></div></div><a class="b" href="/profile" target="_blank" rel="noopener">Profile ↗</a></div>
    ${ME.pub ? `<div class="opt"><div><b>Your ID</b></div><span style="display:flex;gap:8px;align-items:center"><code style="font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.08em">${E(ME.pub)}</code><button class="b" id="copyId">${I("copy", 15)} Copy</button></span></div>` : ""}
    <div class="opt"><div><b>Photo</b><small>shown on the taskbar, the lock screen and to your team</small></div><div style="display:flex;gap:8px"><button class="b" id="photo">${I("image", 14)} ${ME.avatar ? "Change" : "Add a photo"}</button>${ME.avatar ? `<button class="b" id="nophoto">Remove</button>` : ""}<input type="file" id="photoIn" accept="image/*" hidden></div></div>
    <div class="opt"><div><b>Lock the screen</b><small>${E(keyName("Ctrl+Alt+L"))} · your windows stay as they are</small></div><button class="b" data-tell="lock">${I("lock", 14)} Lock now</button></div>
    <div class="opt"><div><b>Language</b><small>the whole system follows it</small></div><button class="b" id="lang">${I("globe", 14)} ${(window.PanelI18N ? PanelI18N.lang : "en").toUpperCase()}</button></div></div>
    <h3 style="margin:18px 0 8px;font-size:14px">Log</h3><div class="card rows" id="myLog"><div class="opt"><small>…</small></div></div>`;
  if (part === "look") h = `<h2>Look & theme</h2><div class="sub">Changes the desktop and every window at once.</div>
    <div class="card rows"><div class="opt" style="display:block"><b>Theme</b><div class="themes">${Object.entries(THEMES).map(([k, t]) => `<button class="th ${T === k ? "on" : ""}" data-theme="${k}"><span class="pv" style="background:${t.vars["--bg"]}"><i style="background:${t.vars["--p2"]};border:1px solid ${t.vars["--ln2"]}"></i><em style="background:${A}"></em></span><b>${E(t.name)}</b></button>`).join("")}</div></div>
    <div class="opt"><div><b>Accent colour</b><small>buttons, the active window, highlights</small></div><div class="dots">${["#8B5CF6", "#FF3D7F", "#22D3EE", "#34D399", "#F59E0B", "#60A5FA"].map(c => `<button class="dot ${A === c ? "on" : ""}" data-accent="${c}" style="background:${c}" aria-label="${c}">${A === c ? I("check", 14) : ""}</button>`).join("")}</div></div>
    <div class="opt"><div><b>Wallpaper</b><small>behind the windows</small></div><div class="seg">${[["", "Aurora"], ["dawn", "Dawn"], ["sea", "Sea"], ["plain", "Plain"]].map(([k, l]) => `<button data-wall="${k}" class="${(th.wall || "") === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="opt"><div><b>LAPP mouse pointer</b><small>our own arrow and hand</small></div>${sw("cursor", LS.get("lapp.cursor", "") !== "system")}</div>
    <div class="opt"><div><b>Rounded corners</b></div><div class="seg">${[["8", "Small"], ["12", "Medium"], ["16", "Large"]].map(([k, l]) => `<button data-radius="${k}" class="${String(th.radius || 12) === k ? "on" : ""}">${l}</button>`).join("")}</div></div></div>`;
  if (part === "desk") h = `<h2>Desktop</h2><div class="sub">How your windows and the taskbar behave.</div><div class="card rows">
    <div class="opt"><div><b>Group windows on the taskbar</b><small>automatic lets the AI pick the best grouping</small></div><div class="seg">${[["auto", "Automatic"], ["app", "By app"], ["task", "By task"]].map(([k, l]) => `<button data-group="${k}" class="${(th.groupBy || "auto") === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="opt"><div><b>Widgets</b><small>today, needs you, notes, numbers…</small></div><button class="b" data-tell="widget">${I("puzzle", 14)} Add a widget</button></div>
    <div class="opt"><div><b>Reopen my windows when I come back</b></div>${sw("restore", th.restore !== false)}</div>
    <div class="opt"><div><b>Lock after a quiet time</b><small>asks for your password again</small></div><div class="seg">${[[0, "Never"], [5, "5 min"], [15, "15 min"], [30, "30 min"], [60, "1 h"]].map(([k, l]) => `<button data-lockafter="${k}" class="${(+th.lockAfter || 0) === k ? "on" : ""}">${l}</button>`).join("")}</div></div></div>`;
  if (part === "keys") h = `<h2>Keyboard</h2><div class="sub">Every shortcut can be changed. They work in every window.</div><div class="card rows"><div class="opt"><div><b>Keyboard shortcuts</b><small>${E(keyName(MAC ? "Cmd+K" : "Ctrl+K"))} command center · ${E(keyName(MAC ? "Cmd+J" : "Ctrl+J"))} AI · ${E(keyName("Alt+T"))} windows · ${E(keyName("Alt+Q"))} workspace …</small></div><button class="b pr" data-tell="keys">${I("keyboard", 14)} Change shortcuts</button></div></div>`;
  if (part === "notes") h = `<h2>Notifications</h2><div class="sub">What may pop up while you work.</div><div class="card rows">
    <div class="opt"><div><b>Pop-ups (toasts)</b><small>notifications still collect under the bell</small></div>${sw("toasts", th.toasts !== false)}</div>
    <div class="opt"><div><b>Audio finished / stopped</b></div>${sw("jobnotes", th.jobnotes !== false)}</div></div>`;
  if (part === "cc") { const C = { ai: true, learn: true, tiles: "calm", open: "center", ...(LS.get("lapp.cc", {}) || {}) }, seg = (k, cur, o) => `<div class="seg">${o.map(([v, l]) => `<button data-ccseg="${k}:${v}" class="${cur === v ? "on" : ""}">${E(l)}</button>`).join("")}</div>`;
    h = `<h2>Command center</h2><div class="card rows">
    <div class="opt"><div><b>Shortcut</b></div><button class="b" data-tell="keys">${I("keyboard", 14)} ${E(keyName(MAC ? "Cmd+K" : "Ctrl+K"))}</button></div>
    <div class="opt"><div><b>Opens</b></div>${seg("open", C.open, [["center", "Centre"], ["full", "Full screen"]])}</div>
    <div class="opt"><div><b>Arranged by the AI</b></div>${sw("cc-ai", C.ai)}</div>
    <div class="opt"><div><b>Learns from “less like this”</b></div>${sw("cc-learn", C.learn)}</div>
    <div class="opt"><div><b>Tiles</b></div>${seg("tiles", C.tiles, [["calm", "Calm"], ["colour", "Colour"]])}</div>
    <div class="opt"><div><b>Cut · Copy · Paste row in every right-click</b></div>${sw("ctxSys", th.ctxSys !== false)}</div>
    <div class="opt"><div><b>Line bar</b></div>${sw("ribbon", !LS.get("lapp.ribbon.off", false))}</div></div>`; }
  if (part === "ai") h = `<h2>AI</h2><div id="aiBox"></div>`;
  if (part === "about") h = `<h2>About</h2><div class="card rows"><div class="opt"><div><b>LAPP work desktop</b><small>Icons: Lucide (ISC licence)</small></div></div></div>`;
  $("#main").innerHTML = `<div class="top" data-chrome><h1>Settings</h1></div>` + h;
  if (part === "ai" && window.AISettings) AISettings.mount($("#aiBox"));
  if (part === "you") K.api("GET", "/me/log").then(r => { const KIND = { signin: "Signed in", signout: "Signed out", wrongpw: "Wrong password", unlock: "Screen unlocked", password: "Password", account: "Account changed", linked: "Linked account", unlinked: "Linked account removed", role: "Role changed", org: "Organisation", support: "Support", store: "Apps", suspended: "Suspended", lifted: "Suspension lifted" };
    const box = $("#myLog"); if (!box) return;
    box.innerHTML = r.log.map(l => `<div class="opt"><div><b>${E(KIND[l.kind] || l.kind)}</b><small>${E([l.detail, l.device, l.country].filter(Boolean).join(" · "))}</small></div><small>${E(new Date(l.at).toLocaleString(K.loc(), { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }))}</small></div>`).join("") || `<div class="opt"><small>—</small></div>`; }).catch(() => {});
  LAPPFrame.sync();
}
if (window.LAPPFrame) LAPPFrame.menus = () => [{ label: "Go", items: PARTS.map(([k, ic, l]) => ({ label: k === "you" && ME ? ME.name || "@" + ME.username : l, icon: ic, on: part === k, run: () => { part = k; draw(); } })) }];
document.addEventListener("click", e => {
  if (e.target.closest("#copyId")) return K.copy(ME.pub);
  const t = e.target;
  const cs = t.closest("[data-ccseg]"); if (cs) { const [k, v] = cs.dataset.ccseg.split(":"); LS.set("lapp.cc", { ...(LS.get("lapp.cc", {}) || {}), [k]: v }); tell("cc", { [k]: v }); return draw(); }
  const p = t.closest("[data-p]"); if (p) { part = p.dataset.p; history.replaceState(null, "", "#" + part); return draw(); }
  const th = t.closest("button[data-theme]"); if (th) return tell("theme", th.dataset.theme);
  const ac = t.closest("[data-accent]"); if (ac) return tell("accent", ac.dataset.accent);
  const wa = t.closest("[data-wall]"); if (wa) return tell("wall", wa.dataset.wall);
  const ra = t.closest("[data-radius]"); if (ra) return tell("radius", +ra.dataset.radius);
  const la = t.closest("[data-lockafter]"); if (la) return tell("lockAfter", +la.dataset.lockafter);
  if (t.closest("#photo")) return $("#photoIn").click();
  if (t.closest("#nophoto")) return savePhoto("");
  const gr = t.closest("[data-group]"); if (gr) return tell("groupBy", gr.dataset.group);
  const tl = t.closest("[data-tell]"); if (tl) return tell(tl.dataset.tell, true);
  const sw = t.closest("[data-sw]"); if (sw) { const k = sw.dataset.sw, v = !sw.classList.contains("on");
    if (/^cc-/.test(k)) LS.set("lapp.cc", { ...(LS.get("lapp.cc", {}) || {}), [k.slice(3)]: v });
    if (k === "ribbon") LS.set("lapp.ribbon.off", !v);
    tell(k, v); if (/^cc-|^ribbon$/.test(k)) draw(); return; }
  if (t.closest("#lang") && window.PanelI18N) PanelI18N.menu(t.closest("#lang"));
});
// the photo is made small here (128 px, webp) before it is saved
document.addEventListener("change", async e => {
  if (e.target.id !== "photoIn" || !e.target.files[0]) return;
  const f = e.target.files[0]; e.target.value = "";
  if (!/^image\//.test(f.type)) return;
  const img = await createImageBitmap(f).catch(() => null); if (!img) return;
  const c = document.createElement("canvas"); c.width = c.height = 128; const s = Math.min(img.width, img.height), x = c.getContext("2d");
  x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
  let d = c.toDataURL("image/webp", .85); if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", .85);
  savePhoto(d);
});
async function savePhoto(d) {
  try { ME = (await K.api("PATCH", "/me", { avatar: d })).user; draw(); tell("avatar", true); }
  catch (x) { K.toast(x.message || "Not saved", { kind: "err" }); }
}
K.onLook(() => setTimeout(draw, 30));
load();
</script>
</body></html>
