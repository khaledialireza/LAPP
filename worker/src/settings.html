<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · LAPP</title>
<meta name="robots" content="noindex">
<script>
if (!(new URLSearchParams(location.search).has("embed") && window.parent !== window)) location.replace("/manage#open=" + encodeURIComponent(location.pathname + location.search + location.hash));
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
<script src="/ui/panel-i18n.js?v=9"></script>
<script src="/ui/cursor.js?v=2"></script>
<script src="/ui/icons.js?v=1"></script>
<script src="/ui/theme.js?v=2"></script>
<script src="/ui/frame.js?v=4"></script>
<style>
/* Settings: you, the look of the whole system (theme, accent, wallpaper, pointer), the desktop, keys, notifications. */
:root{--bg:#07070B;--p1:#0F0F16;--p2:#15151F;--p3:#1C1C29;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#F4F4F8;--mu:rgba(235,235,245,.6);--mu2:rgba(235,235,245,.38);--vi:#8B5CF6;--g:linear-gradient(135deg,#FF3D7F,#8B5CF6 55%,#22D3EE);color-scheme:dark}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:13.5px/1.5 Inter,Vazirmatn,system-ui,sans-serif;display:grid;grid-template-columns:210px 1fr;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.ic{flex:none}
nav{border-inline-end:1px solid var(--ln);background:var(--p1);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav button{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;text-align:start;color:var(--mu)}nav button:hover{background:var(--p3);color:var(--tx)}nav button.on{background:color-mix(in srgb,var(--vi) 22%,transparent);color:var(--tx)}
main{overflow:auto;padding:20px 26px 40px}
.top{display:none}
h2{font-size:18px;margin-bottom:4px}.sub{color:var(--mu);margin-bottom:16px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:6px 16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--ln)}.row:first-child{border:0}
.row b{display:block;font-weight:600}.row small{color:var(--mu2)}
.seg{display:inline-flex;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:2px;flex-wrap:wrap}.seg button{padding:5px 11px;border-radius:8px;color:var(--mu)}.seg button.on{background:var(--p3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 0}
.th{border-radius:12px;border:2px solid var(--ln);padding:8px;text-align:start;display:flex;flex-direction:column;gap:6px}.th.on{border-color:var(--vi)}
.th .pv{height:70px;border-radius:8px;position:relative;overflow:hidden}.th .pv i{position:absolute;inset:12px 30px 12px 12px;border-radius:6px}.th .pv em{position:absolute;bottom:6px;left:6px;right:6px;height:8px;border-radius:4px}
.dots{display:flex;gap:8px;flex-wrap:wrap}.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;color:#fff}.dot.on{border-color:var(--tx)}
.b{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--ln2);background:var(--p2);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}.b.pr{background:var(--g);border:0;color:#fff}
.sw{width:40px;height:22px;border-radius:99px;background:var(--p3);border:1px solid var(--ln2);position:relative;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:.15s}.sw.on{background:var(--vi)}.sw.on::after{left:20px;background:#fff}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff}
</style></head><body>
<nav id="nav"></nav>
<main id="main"><div class="top" data-chrome><h1>Settings</h1></div></main>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const I = (n, s = 16) => window.Icon ? Icon(n, s) : "";
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } } };
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const K = c => MAC ? c.replace(/Cmd\+/g, "⌘").replace(/Ctrl\+/g, "⌃").replace(/Alt\+/g, "⌥").replace(/Shift\+/g, "⇧") : c;
const tell = (key, value) => LAPPFrame.up({ t: "settings", key, value });   // the desktop applies it to every window and saves it
const PARTS = [["you", "user", "You"], ["look", "palette", "Look & theme"], ["desk", "desktop", "Desktop"], ["studio", "video", "Studio"], ["keys", "keyboard", "Keyboard"], ["notes", "bell", "Notifications"], ["about", "info", "About"]];
const THEMES = window.LAPPThemes || {};
let ME = null, part = location.hash.slice(1) || "you";
async function load() { const r = await fetch("/api/me", { credentials: "same-origin" }).then(x => x.json()); ME = r.user; draw(); }
function draw() {
  $("#nav").innerHTML = PARTS.map(([k, ic, l]) => `<button class="${part === k ? "on" : ""}" data-p="${k}">${I(ic)}<span>${E(l)}</span></button>`).join("");
  const th = LS.get("lapp.theme", {}), T = th.theme || "aurora", A = th.accent || "#8B5CF6";
  const sw = (id, on) => `<button class="sw ${on ? "on" : ""}" data-sw="${id}" role="switch" aria-checked="${!!on}"></button>`;
  let h = "";
  if (part === "you") h = `<h2>You</h2><div class="sub">Your account. Name and email are changed on your profile.</div><div class="card"><div class="row"><div style="display:flex;gap:14px;align-items:center">${ME.avatar ? `<span class="av" style="background:url('${E(ME.avatar)}') center/cover"></span>` : `<span class="av" style="background:var(--g)">${E((ME.name || ME.username).charAt(0).toUpperCase())}</span>`}<div><b>${E(ME.name || "@" + ME.username)}</b><small>${E(ME.email || "")} · ${E(ME.role)}</small></div></div><a class="b" href="/profile" target="_blank" rel="noopener">Profile ↗</a></div>
    <div class="row"><div><b>Photo</b><small>shown on the taskbar, the lock screen and to your team</small></div><div style="display:flex;gap:8px"><button class="b" id="photo">${I("image", 14)} ${ME.avatar ? "Change" : "Add a photo"}</button>${ME.avatar ? `<button class="b" id="nophoto">Remove</button>` : ""}<input type="file" id="photoIn" accept="image/*" hidden></div></div>
    <div class="row"><div><b>Lock the screen</b><small>${E(K("Ctrl+Alt+L"))} · your windows stay as they are</small></div><button class="b" data-tell="lock">${I("lock", 14)} Lock now</button></div>
    <div class="row"><div><b>Language</b><small>the whole system follows it</small></div><button class="b" id="lang">${I("globe", 14)} ${(window.PanelI18N ? PanelI18N.lang : "en").toUpperCase()}</button></div></div>`;
  if (part === "look") h = `<h2>Look & theme</h2><div class="sub">Changes the desktop and every window at once.</div>
    <div class="card"><div class="row" style="display:block"><b>Theme</b><div class="themes">${Object.entries(THEMES).map(([k, t]) => `<button class="th ${T === k ? "on" : ""}" data-theme="${k}"><span class="pv" style="background:${t.vars["--bg"]}"><i style="background:${t.vars["--p2"]};border:1px solid ${t.vars["--ln2"]}"></i><em style="background:${A}"></em></span><b>${E(t.name)}</b></button>`).join("")}</div></div>
    <div class="row"><div><b>Accent colour</b><small>buttons, the active window, highlights</small></div><div class="dots">${["#8B5CF6", "#FF3D7F", "#22D3EE", "#34D399", "#F59E0B", "#60A5FA"].map(c => `<button class="dot ${A === c ? "on" : ""}" data-accent="${c}" style="background:${c}" aria-label="${c}">${A === c ? I("check", 14) : ""}</button>`).join("")}</div></div>
    <div class="row"><div><b>Wallpaper</b><small>behind the windows</small></div><div class="seg">${[["", "Aurora"], ["dawn", "Dawn"], ["sea", "Sea"], ["plain", "Plain"]].map(([k, l]) => `<button data-wall="${k}" class="${(th.wall || "") === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="row"><div><b>LAPP mouse pointer</b><small>our own arrow and hand</small></div>${sw("cursor", LS.get("lapp.cursor", "") !== "system")}</div>
    <div class="row"><div><b>Rounded corners</b></div><div class="seg">${[["8", "Small"], ["12", "Medium"], ["16", "Large"]].map(([k, l]) => `<button data-radius="${k}" class="${String(th.radius || 12) === k ? "on" : ""}">${l}</button>`).join("")}</div></div></div>`;
  if (part === "desk") h = `<h2>Desktop</h2><div class="sub">How your windows and the taskbar behave.</div><div class="card">
    <div class="row"><div><b>Group windows on the taskbar</b><small>automatic lets the AI pick the best grouping</small></div><div class="seg">${[["auto", "Automatic"], ["app", "By app"], ["task", "By task"]].map(([k, l]) => `<button data-group="${k}" class="${(th.groupBy || "auto") === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="row"><div><b>Widgets</b><small>today, needs you, notes, numbers…</small></div><button class="b" data-tell="widget">${I("puzzle", 14)} Add a widget</button></div>
    <div class="row"><div><b>Reopen my windows when I come back</b></div>${sw("restore", th.restore !== false)}</div>
    <div class="row"><div><b>Lock after a quiet time</b><small>asks for your password again</small></div><div class="seg">${[[0, "Never"], [5, "5 min"], [15, "15 min"], [30, "30 min"], [60, "1 h"]].map(([k, l]) => `<button data-lockafter="${k}" class="${(+th.lockAfter || 0) === k ? "on" : ""}">${l}</button>`).join("")}</div></div></div>`;
  if (part === "studio") { const M = th.trMode || "a", Lg = th.trLang || "";
    const pv = k => k === "a" ? `<div style="font-size:12px;line-height:1.5"><b>Eine Fahrkarte, bitte.</b><div style="color:var(--mu)"><span style="font-size:9px;border:1px solid var(--ln2);border-radius:5px;padding:0 4px">EN</span> A ticket, please.</div></div>`
      : k === "b" ? `<div style="font-size:12px;line-height:1.5"><b>Eine Fahrkarte, bitte.</b><div style="color:var(--mu)">EN A ticket, please.</div><div style="color:var(--mu2)">▾ FA · RU · UK</div></div>`
      : `<div style="font-size:12px;line-height:1.5;display:grid;grid-template-columns:1fr 1fr;gap:8px"><b>Eine Fahrkarte, bitte.</b><span style="color:var(--mu);border-inline-start:1px solid var(--ln2);padding-inline-start:8px">A ticket, please.</span></div>`;
    h = `<h2>Studio</h2><div class="sub">How the script looks while you write.</div><div class="card"><div class="row" style="display:block"><b>Translations under the lines</b><div class="themes">${[["a", "A · one line + tag"], ["b", "B · all four, folded"], ["c", "C · side by side"]].map(([k, l]) => `<button class="th ${M === k ? "on" : ""}" data-trmode="${k}"><span class="pv" style="background:var(--p2);padding:10px;height:auto;min-height:70px">${pv(k)}</span><b>${E(l)}</b></button>`).join("")}</div></div>
    <div class="row"><div><b>Language shown first</b><small>click the tag on a line to switch at any time</small></div><div class="seg">${[["", "My language"], ["en", "EN"], ["fa", "FA"], ["ru", "RU"], ["uk", "UK"]].map(([k, l]) => `<button data-trlang="${k}" class="${Lg === k ? "on" : ""}">${l}</button>`).join("")}</div></div></div>`; }
  if (part === "keys") h = `<h2>Keyboard</h2><div class="sub">Every shortcut can be changed. They work in every window.</div><div class="card"><div class="row"><div><b>Keyboard shortcuts</b><small>${E(K(MAC ? "Cmd+K" : "Ctrl+K"))} command center · ${E(K(MAC ? "Cmd+J" : "Ctrl+J"))} AI · ${E(K("Alt+T"))} windows · ${E(K("Alt+Q"))} workspace …</small></div><button class="b pr" data-tell="keys">${I("keyboard", 14)} Change shortcuts</button></div></div>`;
  if (part === "notes") h = `<h2>Notifications</h2><div class="sub">What may pop up while you work.</div><div class="card">
    <div class="row"><div><b>Pop-ups (toasts)</b><small>notifications still collect under the bell</small></div>${sw("toasts", th.toasts !== false)}</div>
    <div class="row"><div><b>Audio finished / stopped</b></div>${sw("jobnotes", th.jobnotes !== false)}</div></div>`;
  if (part === "about") h = `<h2>About</h2><div class="card"><div class="row"><div><b>LAPP work desktop</b><small>Icons: Lucide (ISC licence)</small></div></div></div>`;
  $("#main").innerHTML = `<div class="top" data-chrome><h1>Settings</h1></div>` + h;
  LAPPFrame.sync();
}
if (window.LAPPFrame) LAPPFrame.menus = () => [{ label: "Go", items: PARTS.map(([k, ic, l]) => ({ label: l, icon: ic, on: part === k, run: () => { part = k; draw(); } })) }];
document.addEventListener("click", e => {
  const t = e.target;
  const p = t.closest("[data-p]"); if (p) { part = p.dataset.p; history.replaceState(null, "", "#" + part); return draw(); }
  const th = t.closest("button[data-theme]"); if (th) return tell("theme", th.dataset.theme);
  const ac = t.closest("[data-accent]"); if (ac) return tell("accent", ac.dataset.accent);
  const wa = t.closest("[data-wall]"); if (wa) return tell("wall", wa.dataset.wall);
  const ra = t.closest("[data-radius]"); if (ra) return tell("radius", +ra.dataset.radius);
  const la = t.closest("[data-lockafter]"); if (la) return tell("lockAfter", +la.dataset.lockafter);
  if (t.closest("#photo")) return $("#photoIn").click();
  if (t.closest("#nophoto")) return savePhoto("");
  const tm = t.closest("[data-trmode]"); if (tm) return tell("trMode", tm.dataset.trmode);
  const tlg = t.closest("[data-trlang]"); if (tlg) { try { localStorage.removeItem("lapp.studio.tr"); } catch {} return tell("trLang", tlg.dataset.trlang); }
  const gr = t.closest("[data-group]"); if (gr) return tell("groupBy", gr.dataset.group);
  const tl = t.closest("[data-tell]"); if (tl) return tell(tl.dataset.tell, true);
  const sw = t.closest("[data-sw]"); if (sw) return tell(sw.dataset.sw, !sw.classList.contains("on"));
  if (t.closest("#lang") && window.PanelI18N) PanelI18N.menu(t.closest("#lang"));
});
// the photo is made small here (128 px, webp) before it is saved
document.addEventListener("change", async e => {
  if (e.target.id !== "photoIn" || !e.target.files[0]) return;
  const f = e.target.files[0]; e.target.value = "";
  if (!/^image\//.test(f.type)) return;
  const img = await createImageBitmap(f).catch(() => null); if (!img) return;
  const c = document.createElement("canvas"); c.width = c.height = 128; const s = Math.min(img.width, img.height), x = c.getContext("2d");
  x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
  let d = c.toDataURL("image/webp", .85); if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", .85);
  savePhoto(d);
});
async function savePhoto(d) {
  const r = await fetch("/api/me", { method: "PATCH", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-LAPP": "1" }, body: JSON.stringify({ avatar: d }) });
  const j = await r.json().catch(() => ({})); if (!r.ok) return alert(j.error || "not saved");
  ME = j.user; draw(); tell("avatar", true);
}
addEventListener("storage", e => { if (e.key === "lapp.theme" || e.key === "lapp.cursor") draw(); });
addEventListener("message", e => { if (e.origin === location.origin && e.data && e.data.lapp && e.data.t === "theme") setTimeout(draw, 30); });
load();
</script>
</body></html>
