<!doctype html>
<html data-desk lang="en"><head><!--LAPP:HEAD-->
<title>LAPP Studio</title>
<style>
/* LAPP Studio: ⌘ command centre · ✎ live script · 〰 voice desk · 🎭 universe · 📈 insights */
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13.5px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
html.in-win #top .k-crumbs{display:none}
body::before{content:"";position:fixed;inset:-35% -10% auto auto;width:760px;height:760px;background:radial-gradient(closest-side,rgba(139,92,246,.15),transparent);pointer-events:none}
body::after{content:"";position:fixed;inset:auto auto -45% -5%;width:700px;height:700px;background:radial-gradient(closest-side,rgba(255,61,127,.10),transparent);pointer-events:none}
.de{font-family:Inter,system-ui,sans-serif;direction:ltr;text-align:left;unicode-bidi:isolate}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;z-index:1}
.top{min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.top .sp{flex:1}
button.chip:hover{color:var(--tx);border-color:var(--ln2)}
.view{flex:1;min-height:0;overflow:auto;padding:16px}
.pn{background:rgba(21,21,31,.72);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:16px;padding:14px;min-width:0}
.pn h3{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pn h3 .r{margin-inline-start:auto}
.ai{background:linear-gradient(var(--p2),var(--p2)) padding-box,var(--g) border-box;border:1px solid transparent}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.sm{font-size:12px}
textarea.in{resize:vertical;min-height:70px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* ===== ⌘ command centre ===== */
.cc{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.ask{grid-column:1/-1;padding:18px 20px}
.ask .q{display:flex;gap:12px;align-items:center}
.ask .q input{flex:1;background:none;border:0;outline:none;font-size:17px;color:var(--tx);min-width:0}
.ask .opts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ask .opts l-select{width:150px}
.sug{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.pc{background:var(--p3);border:1px solid var(--ln);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:5px}
.pc.off{opacity:.45}.pc b{font-size:13.5px}.pc .t{font-size:12px;color:var(--mu)}
.pc .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.map{display:grid;grid-template-columns:110px repeat(6,1fr);gap:5px;font-size:11.5px}
.map .h{color:var(--mu2);text-align:center;font:600 11px Inter}
.map .rl{color:var(--mu);display:flex;align-items:center}
.cell{height:34px;border-radius:8px;display:grid;place-items:center;font:700 11px Inter;position:relative}
button.cell:hover{outline:2px solid rgba(255,255,255,.35)}
.c0{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.12);color:var(--mu2)}
.c1{background:rgba(139,92,246,.22)}.c2{background:rgba(139,92,246,.45)}.c3{background:rgba(139,92,246,.75)}
.kp.three{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.feed{display:flex;flex-direction:column;gap:9px}
.fi{display:flex;gap:10px;align-items:center;background:var(--p3);border:1px solid var(--ln);border-radius:12px;padding:10px}
.fi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:14px}
.fi b{font-size:13px;display:block}.fi .t{font-size:12px;color:var(--mu)}.fi .btn{margin-inline-start:auto;flex:none}
.lsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lc{background:var(--p3);border:1px solid var(--ln);border-radius:14px;padding:12px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.lc:hover{border-color:var(--ln2);transform:translateY(-1px)}
.lc .t1{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mu)}
.lc b{font-size:15px}
.st-draft{background:rgba(255,255,255,.08);color:var(--mu)}.st-review{background:rgba(251,191,36,.16);color:var(--am)}.st-published{background:rgba(52,211,153,.16);color:var(--gr)}

/* ===== ✎ live script ===== */
.ed{display:grid;grid-template-columns:220px 1fr 300px;gap:14px;height:100%;min-height:0}
.ed>.pn{overflow:auto}
.outl .sc{padding:9px 10px;border-radius:10px;margin-bottom:6px;border:1px solid transparent;cursor:pointer;display:block;width:100%;text-align:start}
.outl .sc:hover{background:var(--p3)}.outl .sc.on{background:var(--p3);border-color:var(--ln2)}
.outl .sc b{display:block;font-size:12.5px}.outl .sc span{font-size:11px;color:var(--mu)}
.beat{display:flex;gap:2px;margin-top:6px}.beat i{height:4px;flex:1;border-radius:2px;background:var(--p1)}
.doc{padding:18px 22px;position:relative}
.sch{font-size:12px;font-weight:700;color:var(--mu);margin:16px 0 4px;display:flex;gap:8px;align-items:center}.sch:first-child{margin-top:0}
.sch [contenteditable]{outline:none;border-bottom:1px dashed transparent}.sch [contenteditable]:focus{border-color:var(--vi)}
.dl{display:grid;grid-template-columns:22px 118px 1fr 26px;gap:10px;padding:9px 6px;border-bottom:1px solid var(--ln);align-items:start;border-radius:8px;position:relative}
.dl:hover,.dl.sel{background:rgba(255,255,255,.025)}
.dl .no{font:600 11px Inter;color:var(--mu2);padding-top:5px}
.who{font:700 11px Inter;letter-spacing:.5px;text-transform:uppercase;padding-top:5px;display:flex;align-items:center;gap:6px;text-align:start;min-width:0}
.who i{width:8px;height:8px;border-radius:50%;flex:none}.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt .d{font:500 16.5px/1.5 Inter;outline:none;border-radius:4px;min-height:1.5em;direction:ltr;text-align:left}
.txt .d:focus,.txt .f:focus{background:rgba(139,92,246,.1)}
.txt .f{font-size:13.5px;color:var(--mu);margin-top:3px;outline:none;min-height:1.3em;border-radius:4px}
.txt .f:empty::before{content:"＋ translation";color:var(--mu2);font-style:italic}
.txt .over{color:var(--am);font-size:11px;margin-top:2px}
/* translations: A one line with a language tag · B all four, folded · C side by side */
.trl{display:flex;align-items:flex-start;gap:6px;margin-top:3px}.trl .f{margin-top:0;flex:1}
.ttag{flex:none;font:700 9.5px Inter;letter-spacing:.4px;padding:2px 6px;border-radius:6px;border:1px solid var(--ln2);color:var(--mu);background:var(--p2);margin-top:2px;cursor:pointer}.ttag:hover{color:var(--tx);border-color:var(--vi)}
.trmore{font-size:11px;color:var(--mu2);margin-top:3px;cursor:pointer;background:none;border:0;padding:0}.trmore:hover{color:var(--tx)}
.dl.trc .txt{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dl.trc .txt .trl{margin-top:0;border-inline-start:1px solid var(--ln);padding-inline-start:12px}.dl.trc .txt .over,.dl.trc .txt .slot{grid-column:1/-1}
.ok-b{width:24px;height:24px;border-radius:7px;border:1px solid var(--ln2);display:grid;place-items:center;font-size:12px;color:var(--mu2);margin-top:3px}
.ok-b.on{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:var(--gr)}
.hw{text-decoration:underline wavy rgba(251,191,36,.9);text-underline-offset:4px}
.nw{background:rgba(34,211,238,.14);border-radius:4px;padding:0 2px;color:#A5F3FC}
.sugg{margin-top:6px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.35);border-radius:10px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.sugg .op{display:flex;gap:10px;align-items:center;padding:4px;border-radius:8px}.sugg .op:hover{background:rgba(139,92,246,.12)}
.sugg .d2{font:500 14px Inter;direction:ltr;text-align:left}
.sugg .op .btn{margin-inline-start:auto}
.wl{font:500 15px Inter;color:var(--tx);padding:3px 0;animation:fi .4s}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
.score{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font:800 20px Inter}
.ck{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--ln)}
.ck .v{margin-inline-start:auto;font:700 12px Inter}
.cef{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:6px 0 10px;background:var(--p3)}
.cef span{display:grid;place-items:center;font:700 10px Inter;min-width:0;overflow:hidden}
.phr{display:flex;flex-direction:column;gap:6px}
.phr div{background:var(--p3);border-radius:9px;padding:6px 9px;font-size:12.5px}
.phr .x{font-size:11.5px;color:var(--mu)}

/* ===== 〰 voice desk ===== */
.vd{display:grid;grid-template-columns:1fr 290px;grid-template-rows:1fr auto;gap:14px;height:100%;min-height:0}
.daw{padding:0;display:flex;flex-direction:column;overflow:hidden}
.ruler{height:30px;border-bottom:1px solid var(--ln);position:relative;font:600 10px Inter;color:var(--mu2);direction:ltr;flex:none}
.ruler span{position:absolute;bottom:4px;transform:translateX(-50%)}
.tracks{flex:1;direction:ltr;position:relative;overflow:auto}
.trk{display:grid;grid-template-columns:170px 1fr;height:92px;border-bottom:1px solid var(--ln)}
.th{padding:12px;display:flex;gap:10px;align-items:center;border-right:1px solid var(--ln);background:rgba(255,255,255,.015);min-width:0}
.th .fc{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;font-weight:800}
.th b{font:700 12.5px Inter;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.th span{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lane{position:relative;overflow:hidden}
.clip{position:absolute;top:14px;height:64px;border-radius:10px;padding:5px 7px;overflow:hidden;font:600 11px Inter;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#fff;min-width:6px}
.clip.sel{box-shadow:0 0 0 2px #fff,0 0 22px rgba(255,255,255,.35)}
.clip.est{opacity:.55;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px)!important}
.clip .wf{display:flex;align-items:center;gap:1.5px;height:28px}.clip .wf i{flex:1;border-radius:1px;background:rgba(255,255,255,.75)}
.clip .emo{position:absolute;top:5px;right:6px;font-size:10px;background:rgba(0,0,0,.35);border-radius:5px;padding:0 5px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--cy);box-shadow:0 0 14px var(--cy);pointer-events:none;z-index:3}
.ph::before{content:"";position:absolute;top:-2px;left:-6px;border:7px solid transparent;border-top-color:var(--cy)}
.words{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;margin-top:8px}
.words span{font:600 12px Inter;padding:4px 8px;border-radius:7px;background:var(--p3);border:1px solid var(--ln)}
.slider{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:10px;font-size:12px;margin:10px 0}
.slider input{width:100%;accent-color:var(--vi)}.slider b{font:700 12px Inter;text-align:end}
.transport{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.tp{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:15px;flex:none}
.tp:disabled{opacity:.3}
.job{display:flex;align-items:center;gap:8px}

/* ===== 🎭 universe ===== */
.uv{display:grid;grid-template-columns:1fr 1.35fr;gap:14px;align-items:start}

.cc2{background:var(--p3);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:start}
button.cc2:hover{border-color:var(--ln2)}
.cc2 .hd{display:flex;gap:10px;align-items:center}
.port{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.cc2 b{font:700 14px Inter}.cc2 .t{font-size:11.5px;color:var(--mu)}
.traits{display:flex;gap:5px;flex-wrap:wrap}.traits span{font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06)}
.cc2.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mu);min-height:140px}

.fr{border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:var(--p3)}
.img{height:130px;position:relative;display:flex;align-items:flex-end;padding:8px}
.img .lb{font:700 10px Inter;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px}
.img .sub{position:absolute;left:8px;right:8px;bottom:32px;text-align:center;font:700 12.5px Inter;text-shadow:0 1px 6px #000;direction:ltr}
.img .who2{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:2px;font-size:18px}
.fr .cap{padding:8px 10px;font-size:11.5px;color:var(--mu)}
.picks{display:flex;gap:6px;flex-wrap:wrap}

/* ===== 📈 insights ===== */
.ins{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
.hl{display:grid;grid-template-columns:26px 1fr 46px auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);font:500 13px Inter}
.hl .m{font:700 12px Inter;text-align:end}.hl.bad .m{color:var(--rd)}.hl.mid .m{color:var(--am)}.hl.ok .m{color:var(--gr)}

@media (max-width:1100px){html:not(.desk) .ed{grid-template-columns:1fr}html:not(.desk) .ed>.pn.outl{display:none}html:not(.desk) .cc,html:not(.desk) .uv,html:not(.desk) .ins{grid-template-columns:1fr}html:not(.desk) .vd{grid-template-columns:1fr}}
@media (max-width:700px){html:not(.desk) .map{grid-template-columns:80px repeat(6,1fr)}html:not(.desk) .row3{grid-template-columns:1fr}}
</style></head><body>
<div class="main">
  <div class="top" id="top"></div>
  <div class="view" id="view"><div class="empty">Loading…</div></div>
</div>
<audio id="player" preload="none"></audio>
<script>
const { $, $$, esc, opts } = K, EMBED = K.embed, up = m => LAPPFrame.up(m);
const ORG = new URLSearchParams(location.search).get("org") || "";
const TRL = ["en", "fa", "ru", "uk"];
const COLORS = ["#38BDF8", "#FF3D7F", "#8B5CF6", "#F59E0B", "#10B981", "#EF4444", "#22D3EE", "#A3E635"];
const S = { scope: null, lessons: [], L: null, dirty: false, saving: null, tr: "en", sel: -1, chars: null, dicts: {}, ov: null };

/* ---------- small helpers ---------- */
const toast = (m, o) => K.toast(m, o);
// the studio's API: /api/studio, for the school (?org=) the window was opened for
const studioApi = K.apiAt("/api/studio");
const api = (m, p, b, raw) => studioApi(m, p + (ORG ? (p.includes("?") ? "&" : "?") + "org=" + encodeURIComponent(ORG) : ""), b, raw);
const rows = L => (L || S.L).data.scenes.flatMap(s => s.lines);
const speakerColor = who => { const c = S.L && S.L.data.cast[who]; if (c && c.color) return c.color; const names = Object.keys(S.L ? S.L.data.cast : {}); return COLORS[Math.max(0, names.indexOf(who)) % COLORS.length]; };
const words = K.words;
const fmtT = K.clock;
// the shared choices (K.opt), only those this scope may use
const levelOpts = () => K.opt.levels().filter(o => S.scope.levels.includes(o.value));
const courseOpts = () => K.opt.courses().filter(o => S.scope.courses[o.value]);
const typeOpts = K.opt.types;
const topicOpts = () => K.opt.topics().filter(o => S.scope.topics.includes(o.value));
const voiceName = v => (v || "").replace(/^piper:/, "").replace(/^[a-z]{2}_[A-Z]{2}-/, "").replace(/-(x_low|low|medium|high)$/, "").replace(/^./, c => c.toUpperCase());

// the browser's own voice, for a quick listen before the real audio is made
const say = (text, course, rate = 1) => K.speak(text, { lang: course, rate });

// the words LAPP's dictionary knows (anything else is new for learners)
async function dictOf(course) {
  if (S.dicts[course]) return S.dicts[course];
  const d = await K.dict(course);
  return (S.dicts[course] = new Set([...d.forms.keys(), ...d.names]));
}
function known(w, forms) {
  if (!forms || !forms.size) return true;
  const lw = w.toLowerCase();
  if (forms.has(lw) || /^\d/.test(lw)) return true;
  if (["en", "em", "er", "es", "e", "n", "s", "t", "st", "te"].some(e => lw.endsWith(e) && forms.has(lw.slice(0, -e.length)))) return true;
  return [lw + "n", lw.slice(0, -1) + "en", lw.slice(0, -2) + "en", lw.slice(0, -1) + "n", lw.slice(0, -2) + "n", lw.slice(0, -3) + "en"].some(c => forms.has(c));
}

/* ---------- top bar ---------- */
function bar(crumb, right = "") { $("#top").innerHTML = `<nav class="k-crumbs">${crumb}</nav><span class="sp"></span>${right}`; }
function scopeCrumb() { return S.scope.kind === "school" ? `<a href="/s/${esc(ORG)}">🏫 ${esc(S.scope.name)}</a> ›` : `<a href="#home">LAPP library</a> ›`; }
function lessonCrumb(part) {
  const L = S.L;
  return `${scopeCrumb()} ${L.series ? `<span>${esc(L.series)}</span> ›` : ""} <b class="de">${K.flag(L.course) || ""} ${esc(L.title)}</b> ${K.lessonState(L.status)}${part ? ` › <span>${part}</span>` : ""}`;
}

/* ---------- router ---------- */
let SEQ = 0;
// the window's menus (title bar): the studio's parts, for the open lesson
if (window.LAPPFrame) LAPPFrame.menus = () => {
  const v = (location.hash.slice(1) || "home").split("/")[0], id = S.L ? "/" + S.L.id : "";
  const go = (k, l, ic, needs) => ({ label: l, icon: ic, on: v === k, disabled: needs && !S.L, run: () => { location.hash = k + (needs ? id : ""); } });
  return [{ label: "Go", items: [go("home", "Studio home", "⌘"), go("script", "Script", "✎", 1), go("lesson", "Lesson settings", "⚙", 1), go("voice", "Voice desk", "〰", 1), go("insights", "Insights", "📈"), go("universe", "Characters", "🎭")] },
    { label: "View", items: [{ label: "Reload", icon: "⟳", run: () => show() }, { label: "Ribbon", icon: "layers", on: K.ribbon.on, run: () => K.ribbon.set(!K.ribbon.on) },
      // the studio's own settings live in the studio (it is an app from the store, not part of the system's Settings)
      { label: "Translations", icon: "translate", sub: [["a", "Under the line"], ["b", "Under the line · others folded"], ["c", "Side by side"]].map(([k, l]) => ({ label: l, on: trMode() === k, run: () => { K.LS.set("lapp.theme", { ...(K.LS.get("lapp.theme", {}) || {}), trMode: k }); show(); } })) },
      { label: "Translation shown first", icon: "globe", sub: TRL.map(l => ({ label: l.toUpperCase(), on: S.tr === l, run: () => { S.tr = l; K.LS.set("lapp.studio.tr", l); show(); } })) }] }];
};
async function show() {
  const seq = ++SEQ;
  const [v, id] = (location.hash.slice(1) || "home").split("/");
  stopPlayer(); K.ribbon.hide();
  try {
    if (id && (!S.L || S.L.id !== Number(id))) await openLesson(Number(id));
    if (seq !== SEQ) return;
    if ((v === "script" || v === "voice" || v === "lesson") && !S.L) { location.hash = "home"; toast("Open a lesson first"); return; }
    await (V[v] || V.home)();
    const part = { home: "Studio", script: "Script", voice: "Voice desk", universe: "Characters", insights: "Insights", lesson: "Lesson" }[v] || "Studio";
    up({ t: "title", title: S.L && v !== "home" && v !== "universe" ? `${part} · ${S.L.title}` : part, icon: { home: "⌘", script: "✎", voice: "〰", universe: "🎭", insights: "📈", lesson: "⚙" }[v] || "🎬", url: location.pathname + location.search.replace(/[?&]embed=1/, "").replace(/^&/, "?") + location.hash, lesson: S.L ? { id: S.L.id, title: S.L.title } : null });
  } catch (e) { $("#view").innerHTML = `<div class="empty"><b>⚠️ ${esc(e.message)}</b></div>`; }
}
async function openLesson(id) {
  await flush();
  const L = await api("GET", `/lessons/${id}`);
  S.L = L; S.sel = -1;
  S.tr = (() => { const v = K.LS.get("lapp.studio.tr") || (K.LS.get("lapp.theme", {}) || {}).trLang; if (TRL.includes(v)) return v; return TRL.includes(window.PanelI18N && PanelI18N.lang) ? PanelI18N.lang : "en"; })();
  dictOf(L.course).then(() => { if (/^#script/.test(location.hash) && $("#doc") && !$(".txt .d:focus")) renderDoc(); });
}
const V = {};
const ACT = {};

/* ================= ⌘ command centre ================= */
V.home = async () => {
  const ov = S.ov = await api("GET", "/overview");
  S.lessons = ov.lessons;

/* ---------- streaming the AI writer ---------- */
async function writeStream(id, onLines, onStatus) {
  const q = ORG ? "?org=" + encodeURIComponent(ORG) : "";
  const r = await fetch(`/api/studio/lessons/${id}/write${q}`, { method: "POST", headers: { "X-LAPP": "1" } });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.status); }
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = "", out = null;
  for (;;) {
    const { value, done } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (!line) continue;
      const m = JSON.parse(line);
      // the lines that are complete so far, read out of the JSON as it grows
      if (m.t === "text") { const des = [...m.text.matchAll(/\{[^{}]*"de"\s*:[^{}]*\}/g)].map(x => { try { const o = JSON.parse(x[0]); return o.who && o.de ? [o.who, o.de] : null; } catch { return null; } }).filter(Boolean); onLines && onLines(des.length, des); }
      else if (m.t === "lines") { const all = m.data.scenes.flatMap(sc => sc.lines).map(x => [x.who, x.de]); onLines && onLines(all.length, all, true); }
      else if (m.t === "status") onStatus && onStatus(m.text);
      else if (m.t === "done") out = m;
      else if (m.t === "error") throw new Error(m.error);
    }
  }
  if (!out) throw new Error("the writer stopped early — try again");
  return out;
}

/* ---------- saving: a moment after the last change ---------- */
// every line has its own id (a new or copied line gets one), so its takes in the voice desk stay with it
function lineIds(d) { const seen = new Set(); for (const s of d.scenes || []) for (const ln of s.lines || []) { if (!ln.id || seen.has(ln.id)) ln.id = Math.random().toString(36).slice(2, 8); seen.add(ln.id); } return d; }
let saveT;
function changed() { S.dirty = true; S.L.audio = S.L.audioRev ? "old" : "none"; const s = $("#saved"); if (s) s.textContent = "…"; clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
async function flush() {
  clearTimeout(saveT);
  if (S.saving) await S.saving;
  if (!S.dirty || !S.L) return;
  S.dirty = false;
  const L = S.L;
  lineIds(L.data);
  S.saving = api("PUT", `/lessons/${L.id}`, { rev: L.rev, data: L.data }).then(r => { L.rev = r.rev; if (L.status === "draft" && L.data.scenes.length) L.status = "review"; const s = $("#saved"); if (s) s.textContent = "Saved ✓"; })
    .catch(e => { S.dirty = true; toast(e.code === "rev" ? "Someone else changed this lesson — reload the page" : "Not saved: " + e.message); })
    .finally(() => { S.saving = null; });
  return S.saving;
}

    changed(); await flush(); V.universe();
  }, "Save");
  opts($("#bc"), S.chars.map(c => ({ value: String(c.id), label: c.name, icon: c.emoji, sub: c.bio })), (L.data.characters || []).map(String));
};
ACT.charNew = () => charForm({});
document.addEventListener("click", e => { const c = e.target.closest("[data-char]"); if (c) charForm(S.chars.find(x => x.id === Number(c.dataset.char))); });
function charForm(c) {
  const courses = Object.keys(S.scope.courses);
  form(c.id ? c.name : "New character", `<div class="cols2"><div><label>Name</label><input class="in" name="name" value="${esc(c.name || "")}" required maxlength="40"></div><div><label>Age</label><input class="in" name="age" type="number" min="0" max="120" value="${c.age || ""}"></div></div>
    <label>Who are they?</label><input class="in" name="bio" value="${esc(c.bio || "")}" maxlength="400" placeholder="graphic designer from Hamburg, a bit chaotic">
    <label>Traits (comma)</label><input class="in" name="traits" value="${esc((c.traits || []).join(", "))}" placeholder="curious, funny, loves coffee">
    <div class="cols3"><div><label>Emoji</label><input class="in" name="emoji" value="${esc(c.emoji || "🙂")}" maxlength="8"></div><div><label>Colour</label><input class="in" name="color" type="color" value="${esc(c.color || "#8B5CF6")}" style="height:40px;padding:4px"></div><div><label>Voice</label><l-select name="gender" id="cg"></l-select></div></div>
    ${courses.map(k => `<label>${K.flag(k)} ${esc(S.scope.courses[k].name)} voice</label><div style="display:flex;gap:6px"><l-select name="v_${k}" id="cv_${k}" style="flex:1"></l-select><button type="button" class="btn sm" data-tryvoice="${k}">🔊</button></div>`).join("")}
    ${c.id ? `<div class="acts" style="justify-content:flex-start"><button type="button" class="btn danger" id="cdel">🗑 Delete</button></div>` : ""}`, async f => {
    const body = { name: f.name, age: f.age, bio: f.bio, traits: f.traits.split(",").map(x => x.trim()).filter(Boolean), emoji: f.emoji, color: f.color, gender: f.gender, voices: Object.fromEntries(courses.map(k => [k, f["v_" + k]]).filter(x => x[1])) };
    if (c.id) await api("PUT", `/characters/${c.id}`, body); else await api("POST", "/characters", body);
    V.universe();
  }, c.id ? "Save" : "Create");
  opts($("#cg"), [{ value: "f", label: "female" }, { value: "m", label: "male" }], c.gender || "f");
  for (const k of courses) opts($(`#cv_${k}`), [{ value: "", label: "chosen per lesson" }, ...S.scope.courses[k].voices.map(v => ({ value: v.id, label: voiceName(v.id), sub: v.g === "f" ? "female" : "male" }))], (c.voices || {})[k] || "");
  $$("[data-tryvoice]").forEach(b => b.onclick = () => { const nm = $("dialog.k-dlg [name=name]").value || "neu"; say({ de: `Hallo! Ich bin ${nm}.`, nl: `Hallo! Ik ben ${nm}.`, pl: `Cześć! Jestem ${nm}.` }[b.dataset.tryvoice], b.dataset.tryvoice); });
  if ($("#cdel")) $("#cdel").onclick = async () => { if (!await K.confirm({ title: `Delete ${c.name}?`, ok: "Delete", danger: true })) return; await api("DELETE", `/characters/${c.id}`); closeForm(); V.universe(); };
}

/* ================= 📈 insights ================= */
V.insights = async () => {
  if (!S.lessons.length) S.lessons = (await api("GET", "/lessons")).lessons;
  const pub = S.lessons.filter(l => l.status === "published");
  let L = S.L && S.L.status === "published" ? S.L : null;
  if (!L && pub[0]) { await openLesson(pub[0].id); L = S.L; }
  bar(`${scopeCrumb()} <b>Insights</b>`, `${pub.length ? `<l-select id="insL" style="width:240px"></l-select>` : ""}${[7, 30, 90].map(d => `<button class="chip ${(S.days || 30) === d ? "on" : ""}" data-days="${d}">${d} days</button>`).join("")}`);
  if (!L) { $("#view").innerHTML = `<div class="empty"><b>Nothing published yet</b>Insights start when learners use a published lesson: which sentences are hard to say, and where they stop listening.</div>`; return; }
  opts($("#insL"), pub.map(l => ({ value: String(l.id), label: l.title, icon: K.flag(l.course), sub: `${l.level} · ${l.type}` })), String(L.id)).addEventListener("change", e => { location.hash = `insights/${e.target.value}`; });
  const ins = await api("GET", `/lessons/${L.id}/insights?days=${S.days || 30}`);
  const all = rows(L), said = ins.say.slice().sort((a, b) => a.avg - b.avg);
  const top = ins.reach[0] || 0, pct = ins.reach.map(n => top ? Math.round(n / top * 100) : 0);
  let drop = -1, dropBy = 0; for (let i = 1; i < pct.length; i++) if (pct[i - 1] - pct[i] > dropBy) { dropBy = pct[i - 1] - pct[i]; drop = i; }
  $("#view").innerHTML = `<div class="kp three" style="max-width:640px"><div><b>${ins.opens}</b><span>times opened</span></div><div><b>${ins.learners}</b><span>signed-in learners</span></div><div><b>${ins.say.reduce((a, x) => a + x.n, 0)}</b><span>sentences spoken</span></div></div>
    <div class="ins">
    <div class="pn"><h3>Hard to say <span class="r mu2">right %</span></h3>
      ${said.length ? said.slice(0, 10).map(x => { const r = all[x.line]; return r ? `<div class="hl ${x.avg < 50 ? "bad" : x.avg < 75 ? "mid" : "ok"}"><span class="mu2">${x.line + 1}</span><span class="de">${esc(r.de)}</span><span class="m">${x.avg}%</span>${x.avg < 75 && S.scope.ai ? `<a class="btn sm" href="#script/${L.id}" data-line="${x.line}" title="Rewrite">✦</a>` : "<span></span>"}</div>` : ""; }).join("") : `<div class="mu sm">No spoken sentences yet.</div>`}
    </div>
    <div class="pn"><h3>Where learners stop</h3>
      ${top ? `<div class="k-bars">${pct.map((v, i) => `<i style="height:${Math.max(2, v)}%" class="${i === drop && dropBy >= 10 ? "drop" : ""}" title="line ${i + 1}: ${v}%"></i>`).join("")}</div>
      <div class="mu sm" style="margin-top:8px">${drop > 0 && dropBy >= 10 ? `${dropBy}% stop around line ${drop + 1}: “<span class="de">${esc((all[drop] || {}).de || "")}</span>”` : "No big drop — learners stay to the end."}</div>
      ${drop > 0 && dropBy >= 10 && S.scope.ai ? `<div class="fi" style="margin-top:10px"><span class="ic" style="background:rgba(139,92,246,.18)">✦</span><div><b>Make line ${drop + 1} easier to follow</b><div class="t">shorter or simpler lines keep learners listening</div></div><a class="btn sm" href="#script/${L.id}" data-line="${drop}">Rewrite</a></div>` : ""}`
        : `<div class="mu sm">No listening data yet.</div>`}
    </div>
    <div class="pn"><h3>How it works</h3><div class="mu sm">The app reports, without any text or audio, which line a learner reached and how well each spoken sentence matched. Rewrite a hard line in the script, make the audio again and publish — the numbers show whether it helped.</div></div>
    </div>`;
};
document.addEventListener("click", e => { const d = e.target.closest("[data-days]"); if (d) { S.days = Number(d.dataset.days); V.insights(); } });

/* ---------- the form dialog: the shared one (K.form) ---------- */
const form = (title, html, submit, okLabel = "Save") => K.form(title, html, submit, okLabel);
const closeForm = () => K.closeDialogs();

/* ---------- start ---------- */
(async () => {
  if (!EMBED) return;
  document.body.classList.add("embed");
  try { const r = await api("GET", "/scope"); S.scope = { ...r, ...r.scope }; }
  catch (e) { $("#view").innerHTML = `<div class="empty"><b>${esc(e.message)}</b><a class="btn" href="/">Back to LAPP</a></div>`; return; }
  addEventListener("panel:lang", () => show());
  api("GET", "/characters").then(r => { S.chars = r.characters; }).catch(() => {});
  addEventListener("hashchange", show);
  show();
})();
</script>
