<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>LAPP Studio</title>
<script src="/ui/lapp-ui.js?v=3"></script>
<script src="/ui/panel-i18n.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ui-surface:#15151F;--ui-surface-2:#1C1C29;--ui-line:rgba(255,255,255,.14);--ui-text:#F4F4F8;--ui-muted:rgba(235,235,245,.55);--ui-accent:#8B5CF6;--bg:#07070B;--p1:#0F0F16;--p2:#15151F;--p3:#1C1C29;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#F4F4F8;--mu:rgba(235,235,245,.55);--mu2:rgba(235,235,245,.35);
--pk:#FF3D7F;--vi:#8B5CF6;--cy:#22D3EE;--gr:#34D399;--am:#FBBF24;--rd:#F87171;--g:linear-gradient(135deg,#FF3D7F,#8B5CF6 55%,#22D3EE)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 Inter,Vazirmatn,system-ui,sans-serif;min-height:100vh;display:grid;grid-template-columns:290px 1fr}
body::before{content:"";position:fixed;inset:-30% -10% auto auto;width:720px;height:720px;background:radial-gradient(closest-side,rgba(139,92,246,.14),transparent);pointer-events:none}
.de{font-family:Inter,system-ui,sans-serif;direction:ltr;text-align:left;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
aside{background:var(--p1);border-inline-start:1px solid var(--ln);padding:16px;display:flex;flex-direction:column;gap:10px;height:100vh;position:sticky;top:0;overflow:auto;z-index:1}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.lg i{width:36px;height:36px;border-radius:11px;background:var(--g);display:grid;place-items:center;font:800 17px Inter;font-style:normal;box-shadow:0 8px 24px rgba(255,61,127,.35)}
.nav{display:flex;gap:6px;margin:0 0 4px}.nav a{flex:1;text-align:center;padding:7px;border-radius:10px;background:rgba(255,255,255,.06);color:inherit;text-decoration:none;font-size:12.5px}.nav a:hover{background:rgba(255,255,255,.12)}
.me{font-size:11.5px;color:var(--mu2);margin:-4px 0 6px 46px}
.new{height:40px;border-radius:12px;border:0;background:var(--g);font-weight:700}
.dr{padding:10px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer}.dr:hover{background:var(--p2)}.dr.on{background:var(--p3);border-color:var(--ln2)}
.dr b{display:block}.dr small{color:var(--mu);font-size:12px}
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:0 7px;border-radius:6px;margin-inline-start:4px;background:rgba(255,255,255,.07)}
.st.review{background:rgba(251,191,36,.18);color:var(--am)}.st.published{background:rgba(52,211,153,.16);color:var(--gr)}
.bar{height:4px;border-radius:3px;background:var(--p3);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.runs{margin-top:auto;border-top:1px solid var(--ln);padding-top:10px}.runs h4{font-size:12px;color:var(--mu);margin-bottom:6px}
.run{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0;color:var(--mu)}.run a{color:inherit;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu2);flex:none}.dot.run-on{background:var(--cy);box-shadow:0 0 10px var(--cy);animation:pulse 1s infinite alternate}.dot.ok{background:var(--gr)}.dot.bad{background:var(--rd)}
@keyframes pulse{to{opacity:.35}}
main{padding:22px 30px 130px;max-width:1120px;z-index:1}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font:800 28px Inter;margin-inline-end:auto}
.chip{padding:5px 11px;border-radius:99px;background:var(--p3);border:1px solid var(--ln);font-size:12.5px;color:var(--mu)}.chip.on{color:var(--tx);border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.16)}
.b{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ln2);background:var(--p2);font-weight:700;font-size:13px;white-space:nowrap}.b.pr{background:var(--g);border:0;box-shadow:0 8px 24px rgba(139,92,246,.3)}.b:disabled{opacity:.4;cursor:default}
.brief{color:var(--mu);margin:0 0 14px;font-size:13.5px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.meta span{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:12.5px}
.sc{margin:22px 0 8px;font-weight:800;color:var(--mu);font-size:13px}
.ln{display:grid;grid-template-columns:34px 130px 1fr 40px;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:rgba(21,21,31,.8);margin-bottom:6px}
.ln.ok{border-color:rgba(52,211,153,.35)}.ln.cur{box-shadow:0 0 0 1px var(--cy)}
.pl{width:30px;height:30px;border-radius:50%;background:rgba(34,211,238,.14);color:var(--cy);border:0}.pl:disabled{opacity:.3}
.who{font:700 11.5px Inter;letter-spacing:.4px;text-transform:uppercase;padding-top:6px}
[contenteditable]{outline:none;border-radius:6px;padding:2px 4px}[contenteditable]:focus{background:rgba(139,92,246,.16)}
.t-de{font:500 16px Inter}.t-tr{color:var(--mu);margin-top:3px}
.ck{width:32px;height:32px;border-radius:9px;border:1px solid var(--ln);background:var(--p3);color:var(--mu)}.ln.ok .ck{background:rgba(52,211,153,.2);color:var(--gr);border-color:rgba(52,211,153,.5)}
.empty{color:var(--mu);margin-top:60px;text-align:center}.empty b{display:block;font-size:20px;color:var(--tx);margin-bottom:6px}
.dock{position:fixed;bottom:16px;inset-inline-start:306px;inset-inline-end:16px;display:flex;align-items:center;gap:12px;background:rgba(21,21,31,.92);backdrop-filter:blur(14px);border:1px solid var(--ln2);border-radius:16px;padding:10px 14px;z-index:2}
.dock audio{flex:1;height:34px}.saved{font-size:12px;color:var(--mu2);min-width:70px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--ln2);border-radius:12px;padding:10px 16px;z-index:9;display:none}.toast.on{display:block}
dialog{background:var(--p2);color:var(--tx);border:1px solid var(--ln2);border-radius:18px;padding:20px;width:min(520px,92vw);margin:auto}dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:12px}dialog label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
dialog input,dialog textarea,dialog select{width:100%;background:var(--p3);border:1px solid var(--ln2);border-radius:10px;padding:9px 11px;color:var(--tx);font:inherit}
dialog textarea{min-height:90px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media (max-width:820px){body{grid-template-columns:1fr}aside{position:static;height:auto}.dock{inset-inline-start:16px}.ln{grid-template-columns:30px 1fr 36px}.ln .who{grid-column:2}.ln>div:nth-child(3){grid-column:1/-1}}
</style></head><body>
<aside>
  <div class="lg"><i>L</i>Studio</div><div class="me" id="me"></div>
  <nav class="nav"><a href="/admin">🛠 Admin panel</a><a href="/">← App</a><a href="#" id="lng">🌐 Language</a></nav>
  <button class="new" id="newBtn">＋ New content</button>
  <div id="list"></div>
  <div class="runs"><h4>Running jobs</h4><div id="runs"></div></div>
</aside>
<main id="main"><div class="empty"><b>Welcome to the studio</b>Pick a draft or make new content.</div></main>
<div class="dock"><span>🎧</span><audio id="player" controls></audio><span class="saved" id="saved"></span></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><form method="dialog" id="newForm">
  <h3>New content</h3>
  <label>Course language</label><l-select name="course" value="de"><option value="de" data-icon="🇩🇪" data-sub="Deutsch">German</option><option value="nl" data-icon="🇳🇱" data-sub="Nederlands">Dutch</option><option value="pl" data-icon="🇵🇱" data-sub="Polski">Polish</option></l-select>
  <div class="row2"><div><label>Type</label><l-select name="type" value="talk"><option value="talk" data-icon="💬">Conversation</option><option value="lesson" data-icon="🎧">Lesson</option><option value="story" data-icon="📖">Story</option></l-select></div>
  <div><label>Level</label><l-select name="level" value="A1"><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option></l-select></div></div>
  <label>Title (in the course language)</label><input name="title" required placeholder="Am Bahnhof" class="de">
  <label>Short name (for the folder) · <span style="opacity:.7">made from the title</span></label><input name="slug" required pattern="[a-z0-9][a-z0-9\-]{1,40}" placeholder="am-bahnhof" class="de" autocomplete="off" spellcheck="false">
  <label>Topic and wishes</label><textarea name="brief" placeholder="Buying a ticket, the platform, a delay… words and grammar it should have"></textarea>
  <div class="acts"><button class="b" value="cancel" formnovalidate>Cancel</button><button class="b pr" value="ok">Create</button></div>
</form></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COL = ["#38BDF8", "#FF3D7F", "#8B5CF6", "#34D399", "#FBBF24"];
const TYPE = { talk: "Conversation", lesson: "Lesson", story: "Story" };
const STATUS = { draft: "Draft", review: "Review", published: "Published" };
let D = null, SHA = null, lang = (() => { try { const l = localStorage.getItem("lapp:lang"); return ["fa", "ru", "uk"].includes(l) ? l : "en"; } catch { return "en"; } })(), dirty = false, saving = null, audioFor = null;

async function call(path, opt = {}) {
  const r = await fetch("/api/studio" + path, { ...opt, headers: { "Content-Type": "application/json", "X-LAPP": "1", ...(opt.headers || {}) } });
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.error || r.status);
  return b;
}
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 3500); }

async function list() {
  const ds = await call("/drafts").catch(e => (toast(e.message), []));
  $("#list").innerHTML = ds.map(d => `<div class="dr ${D && D.slug === d.slug ? "on" : ""}" data-s="${d.slug}"><b class="de">${esc(d.title)}</b>
    <small>${(d.course || "de").toUpperCase()} · ${TYPE[d.type] || d.type} · ${d.level} · ${d.ok}/${d.lines}</small><span class="st ${d.status}">${STATUS[d.status] || d.status}</span>
    <div class="bar"><i style="width:${d.lines ? d.ok / d.lines * 100 : 0}%"></i></div></div>`).join("") || `<p class="brief">No drafts yet.</p>`;
}
async function runs() {
  const rs = await call("/runs").catch(() => []);
  $("#runs").innerHTML = rs.slice(0, 6).map(r => `<div class="run"><i class="dot ${r.status !== "completed" ? "run-on" : r.conclusion === "success" ? "ok" : "bad"}"></i><a class="de" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div>`).join("") || `<div class="run">—</div>`;
  const busy = rs.some(r => r.status !== "completed");
  if (runs.busy && !busy && D) { toast("Job finished"); open(D.slug); list(); }
  runs.busy = busy;
  clearTimeout(runs.t); runs.t = setTimeout(runs, busy ? 5000 : 30000);
}
async function open(slug) {
  if (dirty) await save();
  const { draft, sha } = await call("/drafts/" + slug); D = draft; SHA = sha; audioFor = null; render(); list(); loadAudio();
}
async function loadAudio() {
  // fetched whole, so seeking to a line works even without Range support
  const r = await fetch("/api/studio/audio/" + D.slug);
  if (!r.ok) { $("#player").removeAttribute("src"); audioFor = null; return render(); }
  $("#player").src = URL.createObjectURL(await r.blob()); audioFor = D.slug; render();
}
function render() {
  const who = Object.keys(D.cast || {}), col = w => COL[Math.max(0, who.indexOf(w)) % COL.length], T = D.timings || null;
  const rows = D.scenes.flatMap(s => s.lines), done = rows.filter(r => r.ok).length;
  let n = 0;
  $("#main").innerHTML = `<div class="top"><h1 class="de">${esc(D.title)}</h1>
      ${["en", "fa", "ru", "uk"].map(l => `<span class="chip ${l === lang ? "on" : ""}" data-l="${l}">${l.toUpperCase()}</span>`).join("")}
      <button class="b" data-run="write">✦ Write with AI</button>
      <button class="b" data-run="voice" ${rows.length ? "" : "disabled"}>🎙 Make audio</button>
      <button class="b pr" data-run="publish" ${rows.length && done === rows.length && audioFor ? "" : "disabled"} title="When every line is approved and the audio is made">🚀 Publish</button></div>
    <p class="brief">${esc(D.brief || "")}</p>
    <div class="meta"><span>${(D.course || "de").toUpperCase()} · ${TYPE[D.type]} · ${D.level}</span><span>${done} / ${rows.length} approved</span>
      ${who.map(w => `<span><b class="de" style="color:${col(w)}">${esc(w)}</b> · <span class="de">${esc(D.cast[w].voice)}</span></span>`).join("")}
      ${rows.length ? `<button class="chip" data-all>✓ Approve all</button>` : ""}</div>
    ${rows.length ? "" : `<div class="empty"><b>No text yet</b>Press “✦ Write with AI”; in a few minutes the text and translations are here.</div>`}
    ${D.scenes.map((sc, si) => `<div class="sc"><span class="de">${esc(sc.title.de)}</span> · ${esc(sc.title[lang] || "")}</div>` + sc.lines.map((ln, li) => { const k = n++; return `
      <div class="ln ${ln.ok ? "ok" : ""}" data-si="${si}" data-li="${li}" data-k="${k}"><button class="pl" data-play ${audioFor ? "" : "disabled"}>▶</button>
      <div class="who de" style="color:${col(ln.who)}">${k + 1} · ${esc(ln.who)}</div>
      <div><div class="t-de de" contenteditable data-f="de">${esc(ln.de)}</div><div class="t-tr" contenteditable data-f="${lang}" dir="${lang === "fa" ? "rtl" : "ltr"}">${esc(ln[lang])}</div></div>
      <button class="ck" data-ok>✓</button></div>`; }).join("")).join("")}`;
}
async function save() {
  if (!dirty || !D) return;
  if (saving) return saving;
  $("#saved").textContent = "Saving…";
  saving = call("/drafts/" + D.slug, { method: "PUT", body: JSON.stringify({ draft: D, sha: SHA }) })
    .then(r => { SHA = r.sha; dirty = false; $("#saved").textContent = "Saved ✓"; list(); })
    .catch(e => { $("#saved").textContent = ""; toast(e.message); })
    .finally(() => { saving = null; });
  return saving;
}
const touch = () => { dirty = true; $("#saved").textContent = "…"; clearTimeout(touch.t); touch.t = setTimeout(save, 1500); };

document.addEventListener("click", async e => {
  const dr = e.target.closest("[data-s]"); if (dr) return open(dr.dataset.s);
  const l = e.target.closest("[data-l]"); if (l) { lang = l.dataset.l; return render(); }
  if (e.target.closest("[data-all]")) { D.scenes.forEach(s => s.lines.forEach(x => x.ok = true)); render(); touch(); return; }
  const row = e.target.closest(".ln");
  if (row && e.target.closest("[data-ok]")) { const ln = D.scenes[row.dataset.si].lines[row.dataset.li]; ln.ok = !ln.ok; render(); touch(); return; }
  if (row && e.target.closest("[data-play]")) {
    const t = (D.timings || [])[row.dataset.k]; const p = $("#player");
    if (!t) return toast("Make the audio first");
    p.currentTime = t[0]; p.play(); clearInterval(p.stopT);
    p.stopT = setInterval(() => { if (p.currentTime >= t[1]) { p.pause(); clearInterval(p.stopT); } }, 50);
    return;
  }
  const run = e.target.closest("[data-run]");
  if (run) {
    await save();
    const what = run.dataset.run;
    if (what === "write" && D.scenes.length && !confirm("The new text replaces the current text. Continue?")) return;
    try { await call(`/run/${what}/${D.slug}`, { method: "POST", body: "{}" }); toast({ write: "Writing started…", voice: "Making audio started…", publish: "Publishing started…" }[what]); setTimeout(runs, 3000); }
    catch (err) { toast(err.message); }
  }
});
document.addEventListener("input", e => {
  const f = e.target.dataset.f, row = e.target.closest(".ln"); if (!f || !row) return;
  const ln = D.scenes[row.dataset.si].lines[row.dataset.li]; ln[f] = e.target.textContent.trim();
  if (ln.ok) { ln.ok = false; row.classList.remove("ok"); }
  touch();
});
$("#newBtn").onclick = () => $("#dlg").showModal();
// the folder name: lower case, a–z 0–9 and dashes; made from the title until it is typed by hand
const slugify = v => v.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").replace(/[^a-z0-9]+/g, "-").replace(/^-+/, "").slice(0, 41);
{
  const t = $("#newForm [name=title]"), sl = $("#newForm [name=slug]");
  let own = false;
  t.addEventListener("input", () => { if (!own) sl.value = slugify(t.value).replace(/-+$/, ""); });
  sl.addEventListener("input", () => { own = sl.value !== ""; const v = slugify(sl.value); if (v !== sl.value) sl.value = v; });
  sl.addEventListener("change", () => { sl.value = sl.value.replace(/-+$/, ""); });
  $("#newBtn").addEventListener("click", () => { own = false; });
}
$("#dlg").addEventListener("close", async () => {
  if ($("#dlg").returnValue !== "ok") return;
  const f = Object.fromEntries(new FormData($("#newForm")));
  try { await call("/drafts", { method: "POST", body: JSON.stringify(f) }); $("#newForm").reset(); await list(); open(f.slug); }
  catch (err) { toast(err.message); }
});
addEventListener("beforeunload", e => { if (dirty) { save(); e.preventDefault(); } });
call("/me").then(m => $("#me").textContent = m.email).catch(() => {});
list(); runs();
$("#lng").onclick = e => { e.preventDefault(); e.stopPropagation(); PanelI18N.menu(e.currentTarget); };
addEventListener("panel:lang", () => { list(); if (D) render(); });
</script>
</body></html>
