# LAPP — the whole site as one Cloudflare Worker (deployed by .github/workflows/deploy.yml)
name = "lapp"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "lapp.khaledi.eu", custom_domain = true }]

# the static app; worker/, _studio/, tools/ … are kept out by .assetsignore
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/manage", "/manage/", "/files", "/files/", "/admin", "/admin/", "/studio", "/studio/", "/s/*", "/content/lessons/*/audio.mp3", "/content/lessons/s-*"]

[[d1_databases]]
binding = "DB"
database_name = "lapp"
database_id = "00000000-0000-0000-0000-000000000000"   # the deploy workflow puts the real id here
migrations_dir = "worker/migrations"

# LAPP AI: open-source models on our own Cloudflare account (the studio's default AI, no key)
[ai]
binding = "AI"

# live classes: one Durable Object per lesson (worker/src/room.js)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[rules]]
type = "Text"
globs = ["**/*.html"]

[vars]
APP_URL = "https://lapp.khaledi.eu"
EMAIL_FROM = "LAPP <no-reply@khaledi.eu>"
REPO = "khaledialireza/LAPP"
BRANCH = "main"
STRIPE_PRICE_MONTHLY = ""
STRIPE_PRICE_YEARLY = ""
# what the plans sheet shows (the real price is the Stripe price above)
PRICE_MONTH_LABEL = "€8.99"
PRICE_YEAR_LABEL = "€59.99"
PRICE_SAVE_LABEL = "45%"

# Secrets (wrangler secret put …, or the deploy workflow from GitHub secrets — never in this file):
#   ADMIN_EMAILS           comma-separated; these accounts become admin once their e-mail is verified
#   RESEND_API_KEY         e-mail (codes and password resets)
#   STRIPE_SECRET_KEY      payments
#   STRIPE_WEBHOOK_SECRET  signature of https://lapp.khaledi.eu/api/stripe/webhook
#   GITHUB_TOKEN           studio: fine-grained token for this repository (Actions read/write: starts the voice job)
